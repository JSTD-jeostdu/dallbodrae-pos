<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>달보드레</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 달보드레 — '달콤하고 부드럽다'는 이름에 맞춘 부드러운 색감 */
  :root {
    --bg: #fdf7f2;
    --panel: #ffffff;
    --ink: #2a2320;
    --muted: #7a6b60;
    --line: #e8dcd2;
    --brand: #b5651d;
    --brand-dark: #8c4a12;
    --ok: #2f7d4f;
    --warn: #d98a00;
    --danger: #c0392b;
    --radius: 18px;
    /* 글자 크기 3단계 — Task 5에서 실제로 전환한다 */
    --scale: 1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: calc(16px * var(--scale));
    display: flex; flex-direction: column; min-height: 100vh;
    user-select: none; -webkit-user-select: none;
  }
  input, textarea, select { user-select: text; -webkit-user-select: text; font: inherit; }
  button { font: inherit; cursor: pointer; border: none; touch-action: manipulation; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  /* main은 flex:1로 정해진 실제 높이를 갖지만 overflow 기본값(visible)이라
     자식이 그보다 커지면 그림만 상자 밖으로 흘러 footer와 겹친다.
     화면(주문·관리 등)이 늘어나도 항상 이 안에서만 스크롤되게 여기서 막는다. */
  main { flex: 1; padding: 16px; min-height: 0; overflow-y: auto; }
  footer { text-align: center; padding: 10px; color: var(--muted); font-size: calc(13px * var(--scale)); }
  #selftest-result { padding: 20px; font-size: 15px; white-space: pre-wrap; line-height: 1.7; }

  /* ---- 공통 버튼 ---- */
  .btn {
    padding: 12px 20px; border-radius: var(--radius); font-weight: 700;
    font-size: calc(15px * var(--scale)); min-height: 48px;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:active { background: var(--brand-dark); }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 2px solid var(--line) !important; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.ok { background: var(--ok); color: #fff; }

  /* ---- 상단바 ---- */
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line);
  }
  .topbar[hidden] { display: none; }
  .topbar h1 { font-size: calc(20px * var(--scale)); margin: 0; color: var(--brand); }
  .role-tag {
    background: var(--brand); color: #fff; font-weight: 700;
    padding: 5px 14px; border-radius: 999px; font-size: calc(14px * var(--scale));
  }
  .staff {
    color: var(--muted); font-size: calc(13px * var(--scale));
  }
  .spacer { flex: 1; }
  .net-tag {
    color: var(--muted); background: var(--bg); border: 1px solid var(--line);
    padding: 4px 12px; border-radius: 999px; font-size: calc(12px * var(--scale));
  }
  .font-switch { display: flex; gap: 6px; align-items: center; }
  .font-switch button {
    min-width: 44px; min-height: 44px; border-radius: 12px;
    background: var(--panel); border: 2px solid var(--line); color: var(--ink);
  }
  .font-switch button:nth-child(1) { font-size: 14px; }
  .font-switch button:nth-child(2) { font-size: 19px; }
  .font-switch button:nth-child(3) { font-size: 24px; }
  .font-switch button.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  #btn-change-role {
    background: var(--brand-dark); color: #fff; font-weight: 700;
    padding: 10px 16px; border-radius: var(--radius); font-size: calc(14px * var(--scale));
    min-height: 44px;
  }

  /* ---- 역할 선택 화면 ----
     학생이 처음 만나는 화면이라 카드는 크고, 서로 멀리 떨어뜨려
     옆 카드를 잘못 누르는 일을 줄인다 (접근성 원칙 3·5). */
  .role-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 28px; max-width: 760px; margin: 24px auto; padding: 8px;
  }
  .role-grid button {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; min-height: 180px; background: var(--panel);
    border: 3px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
    color: var(--ink); transition: transform .1s ease, border-color .1s ease;
  }
  .role-grid button:active { transform: scale(.96); border-color: var(--brand); }
  .role-grid button span { font-size: 56px; line-height: 1; }
  .role-grid button small { color: var(--muted); font-size: calc(14px * var(--scale)); font-weight: 400; }
  .role-grid button { font-size: calc(22px * var(--scale)); font-weight: 900; }

  /* ---- 토스트 ----
     되돌릴 수 있는 알림. 눈에 잘 띄되 화면을 막지 않는다. */
  .toast {
    position: fixed; left: 50%; bottom: 28px; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    background: var(--ink); color: #fff; padding: 14px 22px; border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: calc(15px * var(--scale));
    max-width: 90vw; z-index: 500;
  }
  .toast button {
    background: var(--brand); color: #fff; font-weight: 700;
    padding: 8px 16px; border-radius: 12px; white-space: nowrap;
  }

  /* ---- 확인창 ----
     파괴적인 동작 앞에 반드시 세운다 (접근성 원칙 4). */
  .modal-back {
    position: fixed; inset: 0; background: rgba(42,35,32,.5);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 600;
  }
  .modal {
    background: var(--panel); border-radius: var(--radius); padding: 28px;
    max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .modal h3 { margin: 0 0 12px; font-size: calc(20px * var(--scale)); color: var(--ink); }
  .modal p { margin: 0; color: var(--muted); line-height: 1.7; font-size: calc(15px * var(--scale)); white-space: pre-line; }
  .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; }

  /* ---- 관리 화면 : PIN 잠금 ---- */
  .card {
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 28px; max-width: 420px; margin: 24px auto; text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
  }
  .pin-gate h2 { margin: 0 0 8px; color: var(--brand); font-size: calc(22px * var(--scale)); }
  .pin-gate p { color: var(--muted); font-size: calc(15px * var(--scale)); margin: 0; }
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 24px 0; }
  .pin-dot { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); }
  .pin-dot.on { background: var(--brand); border-color: var(--brand); }
  .pin-dots.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
  .key { min-height: 68px; font-size: 26px; font-weight: 700; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); }
  .key.blank { visibility: hidden; }

  /* ---- 관리 화면 : 탭 · 메뉴 목록 · 입력 폼 ---- */
  .admin { max-width: 720px; margin: 0 auto; }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .admin-tab {
    flex: 1; min-width: 100px; min-height: 52px; background: var(--panel);
    border: 2px solid var(--line); border-radius: var(--radius); font-weight: 700;
    font-size: calc(16px * var(--scale)); color: var(--muted);
  }
  .admin-tab.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }

  .menu-tab-head { margin-bottom: 14px; }
  .menu-list { display: flex; flex-direction: column; gap: 12px; }
  .menu-row {
    display: flex; align-items: center; gap: 14px; padding: 12px;
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    flex-wrap: wrap;
  }
  .menu-thumb {
    width: 56px; height: 56px; border-radius: 12px; background: var(--bg);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 28px; overflow: hidden; flex-shrink: 0;
  }
  .menu-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .menu-info { flex: 1; min-width: 100px; }
  .menu-name { font-weight: 700; font-size: calc(16px * var(--scale)); display: flex; align-items: center; gap: 8px; }
  .menu-price { color: var(--muted); font-size: calc(14px * var(--scale)); }
  .badge { font-size: calc(12px * var(--scale)); font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .badge.soldout { background: var(--danger); color: #fff; }
  .menu-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; background: var(--panel);
    border: 2px solid var(--line); font-size: 16px; color: var(--ink);
  }
  .btn.small { padding: 8px 14px; min-height: 40px; font-size: calc(13px * var(--scale)); }
  .empty-hint { color: var(--muted); text-align: center; padding: 40px 0; font-size: calc(15px * var(--scale)); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; text-align: left; }
  .field span { font-weight: 700; font-size: calc(14px * var(--scale)); color: var(--ink); }
  .field input, .field select {
    min-height: 46px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: calc(15px * var(--scale));
  }
  .field .hint { color: var(--muted); font-size: calc(12px * var(--scale)); font-weight: 400; line-height: 1.5; }
  .photo-pick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .photo-preview {
    width: 72px; height: 72px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: calc(12px * var(--scale)); color: var(--muted); overflow: hidden; text-align: center;
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .modal .modal-hint { color: var(--muted); font-size: calc(13px * var(--scale)); min-height: 18px; margin: 6px 0 0; }
  .tab-desc { color: var(--muted); font-size: calc(14px * var(--scale)); line-height: 1.6; margin: 0 0 16px; }
  .storage-info { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .storage-info p { color: var(--muted); font-size: calc(13px * var(--scale)); margin: 0; }

  /* ---- 주문 화면 (PRD 3.1) ----
     AAC 원칙: 사진과 글자가 한 타일 안에 항상 함께 있다.
     품절은 색이 아니라 흐림 + 화면을 덮는 큰 ✕로 표시하고, 버튼 자체를 막는다. */
  .order-screen { display: flex; gap: 16px; height: 100%; }
  /* .order-menu는 이제 스크롤 상자가 아니라 [스크롤 영역(.menu-scroll) + 화살표] 를
     세로로 쌓는 틀이다. 스크롤 상자 "안"에 화살표 자리를 padding으로 비워 두면,
     내용이 넘칠 때 그 padding 안까지 다음 줄이 비집고 들어와 버린다(스크롤 컨테이너의
     padding은 넘치는 내용을 막는 경계가 아니라 스크롤 가능한 여유 공간일 뿐이라서).
     그래서 화살표를 스크롤 영역 "밖" 형제로 두어, 항상 자기 자리(고정 높이)만
     차지하고 타일 줄과는 절대 겹치지 않게 한다. */
  .order-menu { flex: 3; min-width: 0; height: 100%; display: flex; flex-direction: column; overflow: hidden; }
  .menu-scroll { flex: 1; min-height: 0; overflow-y: auto; }
  /* 주문하기는 항상 눌려야 하는 버튼이라 담은 내용이 길어져도 스크롤에 묻히면 안 된다.
     그래서 패널 전체를 스크롤하는 대신, 카드 목록(.cart-list)만 안에서 스크롤하고
     머리글·합계·버튼은 항상 제자리에 고정한다. min-height: 0은 flex 자식이
     내용 크기 아래로 줄어들 수 있게 해 .cart-list의 overflow-y가 실제로 걸리게 한다. */
  .order-cart {
    flex: 2; min-width: 260px; max-width: 380px; height: 100%; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 16px;
  }
  /* 좁은 화면(또는 아주 크게 글자 크기)에서 가로 스크롤 없이 위아래로 쌓는다.
     order-screen의 높이는 main 박스에 그대로 고정해 둔다(height: 100%, auto 아님).
     장바구니는 담긴 만큼만 차지하다가(flex-grow: 0) 화면의 절반을 넘지 않게 막고
     (max-height), 메뉴가 남는 공간을 전부 가져간다(flex: 1) — 학생이 실제로 가장
     자주 쓰는 곳은 메뉴 타일이고, 장바구니는 주문을 시작할 때 항상 비어 있어
     처음 화면을 볼 때 메뉴가 더 넓게 보이도록 우선순위를 뒀다. 두 영역의 높이 합은
     항상 order-screen(= main) 높이와 같으므로 footer를 침범할 여지가 없다. */
  @media (max-width: 760px) {
    .order-screen { flex-direction: column; height: 100%; }
    .order-menu { flex: 1 1 auto; min-height: 0; height: auto; max-width: none; }
    .order-cart {
      flex: 0 0 auto; min-height: 0; height: auto; max-height: 50%; max-width: none;
      overflow-y: auto;   /* 극단적으로 좁은 화면에서도 내용이 상자 밖으로 흘러넘치지 않게 하는 안전장치 */
    }
  }

  .menu-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .tile {
    position: relative; display: flex; flex-direction: column; gap: 8px;
    min-width: 160px; min-height: 180px; padding: 10px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05); text-align: center;
  }
  .tile:active:not(:disabled) { transform: scale(.96); border-color: var(--brand); }
  .tile-photo {
    aspect-ratio: 1; border-radius: 14px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .tile-photo img { width: 100%; height: 100%; object-fit: cover; }
  .tile-photo .emoji { font-size: 52px; line-height: 1; }
  .tile-name { font-size: calc(19px * var(--scale)); font-weight: 900; line-height: 1.25; overflow-wrap: break-word; }
  /* 품절: 색만으로 구분하지 않는다 — 흐림 + 큰 ✕ 오버레이. 버튼은 disabled로 실제로 눌리지 않는다 */
  .tile.soldout { opacity: .35; }
  .tile-soldout {
    position: absolute; inset: 0; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 900; color: var(--danger);
  }

  .cart-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cart-head h2 { margin: 0; font-size: calc(18px * var(--scale)); color: var(--brand); flex: 1; }
  /* .cart-list도 .order-menu와 같은 구조다: [스크롤 영역(.cart-scroll) + 화살표]를
     세로로 쌓는 틀이라, 카드 목록만 안에서 스크롤되고 화살표는 항상 제자리에 있다. */
  /* overflow: hidden — 아주 좁은 화면에서 메뉴 한 줄을 지키느라 장바구니가 빠듯하게
     줄어드는 극단적인 경우에도, 안쪽 내용(카드+화살표)이 이 틀 밖으로 흘러넘쳐
     주문하기 버튼을 덮는 일이 없게 하는 안전장치다(overflow: hidden이 있어야
     이 틀도 "내용 크기 아래로 줄어들 수 있는" 자동 최소 높이를 갖는다). */
  .cart-list { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .cart-scroll { display: flex; flex-direction: column; gap: 10px; flex: 1; min-height: 60px; overflow-y: auto; }
  /* 스크롤로 가려진 내용이 더 있을 때만 나타나는 화살표. 늘 자기 자리(고정 높이)만
     차지해 타일·카드와 결코 겹치지 않는다. 색이 아니라 모양(⌄)으로 "더 있음"을 알린다.
     visibility로 켜고 꺼서(= display 아님) 안 보일 때도 자리는 그대로 남긴다 —
     그래야 화살표가 나타나거나 사라져도 위쪽 스크롤 영역 크기 계산이 흔들리지 않는다. */
  .scroll-cue {
    visibility: hidden; flex-shrink: 0; margin: 3px auto 0;
    width: 40px; height: 24px; border-radius: 999px;
    background: var(--panel); border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; line-height: 1; color: var(--brand-dark);
    box-shadow: 0 2px 8px rgba(0,0,0,.15); pointer-events: none;
  }
  .scroll-cue.show { visibility: visible; }
  .cart-card {
    display: flex; align-items: center; gap: 12px; padding: 10px;
    background: var(--bg); border: 2px solid var(--line); border-radius: 16px;
  }
  .cart-thumb {
    width: 56px; height: 56px; flex-shrink: 0; border-radius: 12px; background: var(--panel);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 28px;
  }
  .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cart-info { flex: 1; min-width: 0; }
  .cart-name { font-weight: 700; font-size: calc(15px * var(--scale)); margin-bottom: 6px; overflow-wrap: break-word; }
  .qty-row { display: flex; align-items: center; gap: 10px; }
  .qty-btn {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: var(--panel);
    border: 2px solid var(--line); font-size: 18px; font-weight: 900; color: var(--brand-dark);
  }
  .qty-num { min-width: 24px; text-align: center; font-weight: 900; font-size: calc(16px * var(--scale)); }
  .cart-del {
    width: 36px; height: 36px; flex-shrink: 0; border-radius: 10px; background: var(--panel);
    border: 2px solid var(--line); color: var(--danger); font-size: 16px; font-weight: 900;
  }
  .cart-total { text-align: right; font-weight: 900; font-size: calc(16px * var(--scale)); margin: 10px 0; }
  .btn.big { min-height: 60px; font-size: calc(18px * var(--scale)); width: 100%; margin-top: 10px; }

  /* ---- 주문 완료 : 번호 표시 ----
     번호 글자 크기는 상단바 글자 크기 설정과 독립적으로 화면 폭에 맞춰 정한다 —
     이미 화면에서 가장 큰 요소라 --scale까지 곱하면 좁은 화면에서 가로로 넘칠 수 있다. */
  .order-no-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; min-height: 60vh; gap: 12px; text-align: center;
  }
  .order-no-label { color: var(--muted); font-size: calc(20px * var(--scale)); margin: 0; }
  .order-no-big { font-size: clamp(72px, 25vw, 200px); font-weight: 900; color: var(--brand); margin: 0; line-height: 1; }
  .order-no-sub { color: var(--muted); font-size: calc(18px * var(--scale)); margin: 0; }

  /* ---- 제조 화면 (PRD 3.2) ----
     JS로 스크롤 높이를 재지 않는다 — main(#app)이 이미 overflow-y: auto라
     카드가 늘어나면 그 안에서 자연스럽게 흐르며 스크롤된다(Task 7의 "잘린 카드"류
     버그는 JS로 스크롤 구간을 잘라낼 때만 생긴다). */
  .barista-screen { max-width: 1100px; margin: 0 auto; }
  .order-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .order-card {
    display: flex; flex-direction: column; gap: 10px; padding: 16px;
    background: var(--panel); border: 3px solid var(--line); border-radius: var(--radius);

  }
  /* 지연: 색에만 기대지 않는다 — 배경색 + 두꺼운 테두리 + ⏰ 아이콘, 세 가지를 함께 쓴다 */
  .order-card.late { border-color: var(--danger); border-width: 4px; background: #fdece8; }
  .order-no { font-size: calc(40px * var(--scale)); font-weight: 900; color: var(--brand); line-height: 1; }
  .order-items { display: flex; flex-direction: column; gap: 8px; }
  .oi { display: flex; align-items: center; gap: 10px; }
  .oi-thumb {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: var(--bg);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 22px;
  }
  .oi-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .oi-name { flex: 1; min-width: 0; font-weight: 700; font-size: calc(16px * var(--scale)); overflow-wrap: break-word; }
  .oi-qty { font-size: calc(16px * var(--scale)); color: var(--brand-dark); flex-shrink: 0; }
  .oi-soldout {
    flex-shrink: 0; padding: 4px 10px; border-radius: 10px; font-size: calc(12px * var(--scale));
    font-weight: 700; background: var(--panel); border: 2px solid var(--line); color: var(--muted);
    min-height: 32px;
  }
  .oi-soldout.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .order-elapsed { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: calc(14px * var(--scale)); }
  .late-badge { display: none; font-size: calc(18px * var(--scale)); }
  .order-card.late .late-badge { display: inline; }
  .order-card.late .order-elapsed { color: var(--danger); font-weight: 700; }
</style>

<script type="module">
// ===== 1. 설정 (CONFIG) =====
// 여기 값만 바꾸면 다른 학급·다른 학년도에서도 그대로 쓸 수 있다.
const CONFIG = {
  // Firebase 콘솔 > 프로젝트 설정 > 내 앱 > (웹 앱 추가) 의 값을 붙여넣는다.
  // 비워두면 로컬 모드로 동작한다 (같은 기기의 탭끼리만 동기화 · 연습용).
  firebase: {
    apiKey: '',
    authDomain: '',
    projectId: '',
    storageBucket: '',
    messagingSenderId: '',
    appId: '',
  },
  firebaseVersion: '12.19.0',
  appName: 'dallbodrae-pos',     // Firebase 인스턴스 이름 — 다른 앱과 캐시가 섞이지 않게
  databaseId: '',                // 비우면 (default) 데이터베이스
  dataRoot: 'dallbodrae_pos',    // 최상위 컬렉션 — 기존 앱이 쓰지 않는 이름이어야 한다
  spaceId: 'cafe-2026',          // 운영 단위. 새로 시작하고 싶으면 이 값만 바꾼다
  cafeName: '달보드레',

  defaults: {
    priceMode: 'off',            // 'off' | 'show' | 'practice'
    fontScale: 'normal',         // 'normal' | 'large' | 'xlarge'
    ttsText: '{번호}번 손님, 음료 나왔습니다.',
    ttsRate: 1.0,
    ttsVolume: 1.0,
    chime: true,
    lateMinutes: 5,              // 제조 지연 강조 기준 (분)
    pin: '1234',                 // 관리 화면 PIN (설정에서 변경 가능)
  },

  photoMaxPx: 400,               // 사진 리사이즈 한 변 (px)
  photoQuality: 0.7,             // JPEG 품질
  photoMaxBytes: 300 * 1024,     // 이보다 크면 품질을 낮춰 재시도
  undoSeconds: 6,                // "완료" 되돌리기 가능 시간 (초)
  recentOrderCount: 12,          // 주문 화면 최근 주문 표시 개수
  displayRecentCount: 4,         // 호출 화면에 함께 보여줄 직전 번호 개수

  localStorageKey: 'dallbodrae-local-db',
  roleKey: 'dallbodrae-role',
  fontScaleKey: 'dallbodrae-font-scale',
};

const FONT_SCALES = { normal: 1, large: 1.25, xlarge: 1.55 };

// ===== 2. 순수 로직 =====
// 이 구획에는 DOM 접근과 네트워크 호출을 넣지 않는다 (자가 테스트 대상).

// ---- 영업일 ----
// 상시 운영이므로 날짜가 바뀌면 주문번호가 저절로 1번부터 다시 시작한다.
function businessDateOf(date = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
}

// ---- 주문번호 ----
// counters/{영업일}.value 는 "마지막으로 발번한 번호"를 담는다. 없으면 0으로 본다.
function nextOrderNo(counterValue) {
  return (counterValue || 0) + 1;
}

// ---- 주문번호 초기화 (PRD 3.6.1) ----
// 아직 받아가지 않은 주문이 남은 채로 번호를 되돌리면 같은 번호가 두 번 불린다.
// 그래서 대기 건수를 보여주고 한 번 더 확인받는다.
function resetPlan(counterValue, startFrom, waitingCount) {
  if (!Number.isInteger(startFrom) || startFrom < 1) {
    return {
      ok: false,
      needsConfirm: false,
      message: '시작 번호는 1 이상의 정수여야 합니다.',
      newCounterValue: counterValue,
    };
  }
  const newCounterValue = startFrom - 1;
  if (waitingCount > 0) {
    return {
      ok: true,
      needsConfirm: true,
      message: `아직 받지 않은 주문이 ${waitingCount}건 있어요.\n지금 번호를 되돌리면 같은 번호가 두 번 불릴 수 있습니다.`,
      newCounterValue,
    };
  }
  return {
    ok: true,
    needsConfirm: false,
    message: `주문번호를 ${startFrom}번부터 다시 시작합니다.`,
    newCounterValue,
  };
}

// ---- 사진 리사이즈 (PRD 6.3) ----
// Firebase Storage를 쓰지 않고 Firestore 문서에 data URL로 넣기 때문에
// 업로드 시점에 반드시 줄여야 한다.

// base64 data URL의 실제 바이트 수
function dataUrlBytes(dataUrl) {
  const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
  const padding = (b64.match(/=+$/) || [''])[0].length;
  return Math.floor(b64.length * 3 / 4) - padding;
}

// 비율을 지키며 한 변이 maxPx 이하가 되는 크기. 원본이 더 작으면 그대로 둔다.
function fitBox(w, h, maxPx) {
  const ratio = Math.min(1, maxPx / Math.max(w, h));
  return { w: Math.round(w * ratio), h: Math.round(h * ratio) };
}

// DOM과 캔버스를 사용하므로 자가 테스트 대상이 아니다.
// File → 줄인 JPEG data URL. 목표 용량을 넘으면 품질을 낮춰 최대 3번 재시도한다.
async function shrinkImage(file, opts = {}) {
  const maxPx = opts.maxPx ?? CONFIG.photoMaxPx;
  const maxBytes = opts.maxBytes ?? CONFIG.photoMaxBytes;
  let quality = opts.quality ?? CONFIG.photoQuality;

  // imageOrientation: 휴대폰으로 세로로 찍은 사진이 눕지 않게 EXIF 회전을 반영한다
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const { w, h } = fitBox(bitmap.width, bitmap.height, maxPx);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();

  let dataUrl = canvas.toDataURL('image/jpeg', quality);
  for (let i = 0; i < 3 && dataUrlBytes(dataUrl) > maxBytes; i++) {
    quality = Math.max(0.3, quality - 0.15);
    dataUrl = canvas.toDataURL('image/jpeg', quality);
  }
  return dataUrl;
}

// ---- 메뉴 정렬 ----
// order가 없는 메뉴는 맨 뒤에 둔다 (새로 만든 메뉴가 중간에 끼어들지 않게).
function sortedMenus(menus) {
  return [...menus].sort((a, b) => {
    const ao = a.order ?? Number.MAX_SAFE_INTEGER;
    const bo = b.order ?? Number.MAX_SAFE_INTEGER;
    if (ao !== bo) return ao - bo;
    return String(a.name).localeCompare(String(b.name), 'ko');
  });
}

// ---- 장바구니 ----
// 화면에 사진을 다시 조회하지 않아도 되게, 담는 시점의 표시 정보를 함께 복사해 둔다.
function cartAdd(cart, menu) {
  const found = cart.find((c) => c.menuId === menu.id);
  if (found) return cart.map((c) => (c.menuId === menu.id ? { ...c, qty: c.qty + 1 } : c));
  return [...cart, {
    menuId: menu.id,
    name: menu.name,
    photo: menu.photo || null,
    emoji: menu.emoji || '☕',
    price: menu.price || 0,
    qty: 1,
  }];
}

function cartSetQty(cart, menuId, qty) {
  if (qty <= 0) return cart.filter((c) => c.menuId !== menuId);
  return cart.map((c) => (c.menuId === menuId ? { ...c, qty } : c));
}

function cartTotal(cart) {
  return cart.reduce((sum, c) => sum + (c.price || 0) * c.qty, 0);
}

// ---- 제조 대기 목록 ----
// 정렬은 반드시 createdAt 기준이다.
// 주문번호는 초기화(3.6.1) 때문에 같은 날 중복될 수 있으므로 정렬 키로 쓰면 안 된다.
function waitingOrders(orders) {
  return orders
    .filter((o) => o.status === 'waiting')
    .sort((a, b) => a.createdAt - b.createdAt);
}

function isLate(order, now, lateMinutes) {
  return now - order.createdAt > lateMinutes * 60 * 1000;
}

// ===== 3. 백엔드 어댑터 =====
// 로컬 모드와 Firestore 모드가 아래 메서드를 똑같이 제공한다.
//   subscribe / add / set / remove / issueOrderNo / resetOrderNo / bump

const COLLECTIONS = ['menus', 'ingredients', 'orders', 'stockLogs', 'counterResets', 'settings'];

// ---- 로컬 모드 ----
// CONFIG.firebase.apiKey 가 비어 있을 때 쓴다.
// 같은 기기의 탭끼리만 동기화된다 (storage 이벤트). 연습·시연용.
function createLocalBackend(storageKey = CONFIG.localStorageKey) {
  const listeners = {};   // { 컬렉션명: [cb, ...] }

  function load() {
    try { return JSON.parse(localStorage.getItem(storageKey)) || {}; }
    catch { return {}; }
  }
  function save(db) {
    localStorage.setItem(storageKey, JSON.stringify(db));
  }
  function docsOf(db, name) {
    return Object.entries(db[name] || {}).map(([id, data]) => ({ id, ...data }));
  }
  function notify(db, name) {
    for (const cb of listeners[name] || []) cb(docsOf(db, name));
  }
  function notifyAll(db) {
    for (const name of Object.keys(listeners)) notify(db, name);
  }

  // 다른 탭에서 바뀌면 이쪽에도 반영한다
  window.addEventListener('storage', (e) => {
    if (e.key === storageKey) notifyAll(load());
  });

  const api = {
    mode: 'local',

    subscribe(name, cb) {
      (listeners[name] ||= []).push(cb);
      cb(docsOf(load(), name));   // 구독 즉시 현재 상태를 한 번 준다
      return () => {
        listeners[name] = listeners[name].filter((f) => f !== cb);
      };
    },

    addSync(name, data) {
      const db = load();
      const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      (db[name] ||= {})[id] = data;
      save(db); notify(db, name);
      return id;
    },

    setSync(name, id, patch) {
      const db = load();
      const prev = (db[name] ||= {})[id] || {};
      db[name][id] = { ...prev, ...patch };   // 필드 단위 merge
      save(db); notify(db, name);
    },

    removeSync(name, id) {
      const db = load();
      if (db[name]) delete db[name][id];
      save(db); notify(db, name);
    },

    bumpSync(name, id, fields) {
      const db = load();
      const prev = (db[name] ||= {})[id] || {};
      const next = { ...prev };
      for (const [k, delta] of Object.entries(fields)) next[k] = (next[k] || 0) + delta;
      db[name][id] = next;
      save(db); notify(db, name);
    },

    issueOrderNoSync(businessDate) {
      const db = load();
      const counters = (db.counters ||= {});
      const value = nextOrderNo(counters[businessDate] || 0);
      counters[businessDate] = value;
      save(db);
      return value;
    },

    resetOrderNoSync(businessDate, value) {
      const db = load();
      (db.counters ||= {})[businessDate] = value;
      save(db);
    },

    clearSync() {
      localStorage.removeItem(storageKey);
      notifyAll({});
    },
  };

  // 앱이 쓰는 비동기 인터페이스
  api.add = async (n, d) => api.addSync(n, d);
  api.set = async (n, i, p) => api.setSync(n, i, p);
  api.remove = async (n, i) => api.removeSync(n, i);
  api.bump = async (n, i, f) => api.bumpSync(n, i, f);
  api.issueOrderNo = async (bd) => api.issueOrderNoSync(bd);
  api.resetOrderNo = async (bd, v) => api.resetOrderNoSync(bd, v);
  api.clear = async () => api.clearSync();
  return api;
}

// ===== 4. 공통 UI 부품 =====

// 되돌릴 수 있는 알림. 접근성 원칙 4번(모든 동작은 되돌릴 수 있다)의 손발이다.
function toast(text, { actionText, onAction, ms = 3000 } = {}) {
  const el = document.createElement('div');
  el.className = 'toast';
  el.innerHTML = `<span></span>`;
  el.firstChild.textContent = text;
  if (actionText) {
    const b = document.createElement('button');
    b.textContent = actionText;
    b.onclick = () => { el.remove(); onAction?.(); };
    el.appendChild(b);
  }
  document.body.appendChild(el);
  setTimeout(() => el.remove(), ms);
}

// 확인창. 파괴적인 동작 앞에 반드시 둔다.
function confirmModal({ title, msg, okText = '확인', okClass = 'primary', cancelText = '취소' }) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal">
        <h3></h3><p></p>
        <div class="modal-actions">
          <button class="btn ghost" data-no></button>
          <button class="btn ${okClass}" data-yes></button>
        </div>
      </div>`;
    back.querySelector('h3').textContent = title;
    back.querySelector('p').textContent = msg;       // \n 을 살리려면 CSS white-space: pre-line
    back.querySelector('[data-no]').textContent = cancelText;
    back.querySelector('[data-yes]').textContent = okText;
    back.querySelector('[data-no]').onclick = () => { back.remove(); resolve(false); };
    back.querySelector('[data-yes]').onclick = () => { back.remove(); resolve(true); };
    document.body.appendChild(back);
  });
}

// ===== 5. 화면 =====
const state = {
  role: null,
  backend: null,
  menus: [], ingredients: [], orders: [], settings: {},
  fontScale: 'normal',
};

const ROLE_LABEL = { order: '주문', barista: '제조', display: '호출', admin: '관리' };

// ---- 설정 저장 ----
// settings/app 문서 하나에 필드 단위로 merge 한다 (backend.set 규약).
async function saveSettings(patch) {
  await state.backend.set('settings', 'app', patch);
}

// ---- 글자 크기 (PRD 3.1.7) ----
// 학생마다 편차가 커서 설정 깊숙이 넣지 않고 상단바에 상시 노출한다.
// 화면에 실제로 적용만 한다 — 이 기기의 선택으로 "기억"할지는 호출하는 쪽이 정한다.
function applyFontScale(key) {
  state.fontScale = FONT_SCALES[key] ? key : 'normal';
  document.documentElement.style.setProperty('--scale', FONT_SCALES[state.fontScale]);
  for (const b of document.querySelectorAll('.font-switch button')) {
    b.classList.toggle('on', b.dataset.scale === state.fontScale);
  }
  // 글자 크기가 바뀌면 타일 이름·장바구니 이름의 실제 렌더 높이가 달라진다.
  // 주문 화면이 지금 떠 있다면 줄 단위 스크롤 한도를 다시 재야 한다 — 그대로 두면
  // 이전 크기 기준으로 계산해 둔 max-height가 새 글자 크기에서는 줄 중간을 자를 수
  // 있다. 화면 전체를 다시 그리면(render) 다른 화면(관리 화면 입력 중인 값 등)이
  // 끊기므로, 주문 화면 패널만 찾아 다시 잰다.
  reclampOrderScreen();
}

// applyFontScale이 호출하는, 주문 화면 전용 재계산. 주문 화면이 떠 있지 않으면
// 아무 것도 하지 않는다(다른 화면에는 이런 패널이 없다). 실제 계산은
// layoutOrderPanels()가 두 패널을 함께 맞춘다(주석 참고).
function reclampOrderScreen() {
  const menuPane = document.querySelector('.order-menu');
  const menuScroll = document.querySelector('.menu-scroll');
  const cartPane = document.querySelector('.order-cart');
  const cartList = document.querySelector('.cart-list');
  const cartScroll = document.querySelector('.cart-scroll');
  if (!menuPane || !menuScroll || !cartPane || !cartList || !cartScroll) return;
  const { cartTruncated, menuTruncated } = layoutOrderPanels(
    menuPane, menuScroll, [...menuScroll.querySelectorAll('.tile')],
    cartPane, cartList, cartScroll, [...cartScroll.querySelectorAll('.cart-card')],
  );
  const menuCue = menuPane.querySelector('.scroll-cue');
  if (menuCue) attachScrollCue(menuScroll, menuCue, menuTruncated);

// ---- 주문 화면 크기 재계산: 창 크기 변화 대응 ----
// 태블릿이 회전하거나, 화면 키보드가 열리고 닫히거나, 모바일 브라우저 주소창이
// 스크롤에 따라 나타났다 사라지는 것만으로도 뷰포트 높이가 바뀐다 — 버튼을
// 누르거나 글자 크기를 바꾸는 것 같은 "동작" 없이도 생기는 일이라, 여기서도
// reclampOrderScreen()을 불러야 예전 크기 기준 max-height가 남아 줄을 자르지 않는다.
// main(#app)은 역할이 바뀌거나 화면이 재렌더돼도 절대 다시 만들어지지 않는
// 고정된 엘리먼트라, 옵저버를 한 번만 만들어 여기 달아 두면 재렌더마다 다시
// 쌓일 일이 없다(관리 화면 등 주문 화면이 아닐 때는 reclampOrderScreen이 그냥
// 아무 것도 하지 않고 돌아간다).
let mainResizeObserver = null;
let resizeRaf = null;
function watchOrderScreenResize() {
  if (mainResizeObserver || typeof ResizeObserver === 'undefined') return;
  const main = document.getElementById('app');
  mainResizeObserver = new ResizeObserver(() => {
    // 창을 드래그로 빠르게 늘렸다 줄였다 해도 매 프레임 수십 번씩 다시 재지
    // 않도록, 한 애니메이션 프레임에 한 번만 재계산하게 묶는다.
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = null;
      reclampOrderScreen();
    });
  });
  mainResizeObserver.observe(main);
}

// 선생님이 코드를 열지 않고 메뉴·담당·설정을 바꾸는 유일한 경로다.

// 학생이 실수로 들어가 메뉴를 지우는 일을 막는 잠금장치다.
// 보안이 목적이 아니므로 세션 단위로만 기억한다.
let adminUnlocked = sessionStorage.getItem('dallbodrae-admin') === 'ok';
let pinInput = '';

function renderPinGate(el) {
  el.innerHTML = `
    <div class="card pin-gate">
      <h2>선생님 확인</h2>
      <p>관리 화면에 들어가려면 비밀번호 4자리를 눌러 주세요.</p>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="keypad" id="pin-pad"></div>
    </div>`;

  const dots = el.querySelector('#pin-dots');
  const pad = el.querySelector('#pin-pad');

  function drawDots() {
    dots.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const d = document.createElement('span');
      d.className = 'pin-dot' + (i < pinInput.length ? ' on' : '');
      dots.appendChild(d);
    }
  }

  function push(ch) {
    if (pinInput.length >= 4) return;
    pinInput += ch;
    drawDots();
    if (pinInput.length === 4) setTimeout(check, 150);
  }

  function check() {
    const expected = String(state.settings.pin || CONFIG.defaults.pin);
    if (pinInput === expected) {
      sessionStorage.setItem('dallbodrae-admin', 'ok');
      adminUnlocked = true;
      pinInput = '';
      render();
    } else {
      dots.classList.add('shake');
      setTimeout(() => dots.classList.remove('shake'), 400);
      pinInput = '';
      drawDots();
    }
  }

  for (const label of ['1','2','3','4','5','6','7','8','9','','0','지우기']) {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = 'key' + (label === '지우기' ? ' wide' : '');
    if (label === '') { b.disabled = true; b.className = 'key blank'; }
    else if (label === '지우기') b.onclick = () => { pinInput = pinInput.slice(0, -1); drawDots(); };
    else b.onclick = () => push(label);
    pad.appendChild(b);
  }

  pinInput = '';
  drawDots();
}

// 목록 순서를 위/아래로 한 칸 옮기고 order를 1부터 다시 매긴다.
// (order 값이 서로 겹치거나 비어 있어도 항상 정확한 순서로 정리된다)
async function moveMenu(id, dir) {
  const list = sortedMenus(state.menus);
  const idx = list.findIndex((m) => m.id === id);
  const j = idx + dir;
  if (idx < 0 || j < 0 || j >= list.length) return;
  [list[idx], list[j]] = [list[j], list[idx]];
  await Promise.all(list.map((m, i) => state.backend.set('menus', m.id, { order: i + 1 })));
}

// ---- 메뉴 추가 · 수정 모달 ----
// existing이 있으면 수정, 없으면 새 메뉴 추가.
function openMenuModal(existing) {
  const isEdit = !!existing;
  let photo = existing?.photo || null;

  const back = document.createElement('div');
  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal menu-modal">
      <h3>${isEdit ? '메뉴 수정' : '메뉴 추가'}</h3>
      <label class="field">
        <span>이름</span>
        <input type="text" id="mm-name" maxlength="20" placeholder="예: 아이스 아메리카노">
      </label>
      <label class="field">
        <span>가격 (원)</span>
        <input type="number" id="mm-price" min="0" step="100" placeholder="예: 1000">
      </label>
      <label class="field">
        <span>이모지 (사진이 없을 때 표시)</span>
        <input type="text" id="mm-emoji" maxlength="4" placeholder="☕">
      </label>
      <div class="field">
        <span>사진 (선택)</span>
        <div class="photo-pick">
          <div class="photo-preview" id="mm-preview">${photo ? `<img src="${photo}" alt="미리보기">` : '사진 없음'}</div>
          <input type="file" accept="image/*" id="mm-file" style="display:none">
          <button type="button" class="btn ghost small" id="mm-pick-btn">사진 선택</button>
          <button type="button" class="btn ghost small" id="mm-clear-btn" ${photo ? '' : 'disabled'}>사진 지우기</button>
        </div>
        <p class="modal-hint" id="mm-hint"></p>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="mm-cancel">취소</button>
        <button class="btn primary" id="mm-save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(back);

  const nameInput = back.querySelector('#mm-name');
  const priceInput = back.querySelector('#mm-price');
  const emojiInput = back.querySelector('#mm-emoji');
  const preview = back.querySelector('#mm-preview');
  const fileInput = back.querySelector('#mm-file');
  const pickBtn = back.querySelector('#mm-pick-btn');
  const clearBtn = back.querySelector('#mm-clear-btn');
  const hint = back.querySelector('#mm-hint');
  const saveBtn = back.querySelector('#mm-save');
  const cancelBtn = back.querySelector('#mm-cancel');

  nameInput.value = existing?.name || '';
  priceInput.value = existing?.price ?? '';
  emojiInput.value = existing?.emoji || '☕';

  pickBtn.onclick = () => fileInput.click();
  cancelBtn.onclick = () => back.remove();

  function setPreview() {
    preview.innerHTML = '';
    if (photo) {
      const img = document.createElement('img');
      img.src = photo;
      img.alt = '미리보기';
      preview.appendChild(img);
    } else {
      preview.textContent = '사진 없음';
    }
    clearBtn.disabled = !photo;
  }

  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    pickBtn.disabled = true;
    saveBtn.disabled = true;
    hint.textContent = '사진을 줄이는 중...';
    try {
      photo = await shrinkImage(file);
      setPreview();
      hint.textContent = '';
    } catch (err) {
      hint.textContent = '사진을 불러오지 못했어요. 다른 사진으로 시도해 주세요.';
    } finally {
      pickBtn.disabled = false;
      saveBtn.disabled = false;
    }
  };

  clearBtn.onclick = () => { photo = null; setPreview(); };

  saveBtn.onclick = async () => {
    const name = nameInput.value.trim();
    const price = Number(priceInput.value);
    const emoji = emojiInput.value.trim() || '☕';
    if (!name) { toast('메뉴 이름을 입력해 주세요.'); return; }
    if (!Number.isFinite(price) || price < 0) { toast('가격을 올바르게 입력해 주세요.'); return; }
    // shrinkImage는 3번 재시도해도 용량을 못 맞추면 큰 사진을 그대로 돌려준다.
    // 그대로 저장하면 1MB 문서 제한에 걸려 아무 안내 없이 저장이 실패하므로 미리 막는다.
    if (photo && dataUrlBytes(photo) > CONFIG.photoMaxBytes) {
      toast('사진 용량이 너무 커요. 다른 사진으로 다시 올려 주세요.', { ms: 5000 });
      return;
    }
    saveBtn.disabled = true;
    try {
      const patch = { name, price, emoji, photo };
      if (isEdit) {
        await state.backend.set('menus', existing.id, patch);
      } else {
        const maxOrder = state.menus.reduce((mx, m) => Math.max(mx, Number(m.order) || 0), 0);
        await state.backend.add('menus', { ...patch, order: maxOrder + 1, visible: true, soldOut: false, recipe: [] });
      }
      back.remove();
      toast(isEdit ? '메뉴를 저장했어요.' : '메뉴를 추가했어요.');
    } finally {
      saveBtn.disabled = false;
    }
  };
}

  photoBox.className = 'tile-photo';
  if (menu.photo) {
    const img = document.createElement('img');
    img.src = menu.photo;
    img.alt = '';
    photoBox.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'emoji';
    span.textContent = menu.emoji || '☕';
    photoBox.appendChild(span);
  }
  tile.appendChild(photoBox);

  const nameEl = document.createElement('div');
  nameEl.className = 'tile-name';
  nameEl.textContent = menu.name || '';
  tile.appendChild(nameEl);

  // 품절: 색으로만 구분하지 않는다 — 흐림(.soldout) + 화면을 덮는 큰 ✕
  if (menu.soldOut) {
    const x = document.createElement('div');
    x.className = 'tile-soldout';
    x.setAttribute('aria-hidden', 'true');
    x.textContent = '✕';
    tile.appendChild(x);
  } else {
    tile.onclick = () => {
      cart = cartAdd(cart, menu);
      navigator.vibrate?.(30);   // 탭에 대한 즉각적인 다감각 피드백
      render();
    };
  }
  return tile;
}

// 담은 내용 카드 — 글을 못 읽어도 사진만 보고 무엇을 담았는지 알 수 있게 한다.
function buildCartCard(item) {
  const card = document.createElement('div');
  card.className = 'cart-card';

  const thumb = document.createElement('div');
  thumb.className = 'cart-thumb';
  if (item.photo) {
    const img = document.createElement('img');
    img.src = item.photo;
    img.alt = '';
    thumb.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'emoji';
    span.textContent = item.emoji || '☕';
    thumb.appendChild(span);
  }
  card.appendChild(thumb);

  const info = document.createElement('div');
  info.className = 'cart-info';
  const nameEl = document.createElement('div');
  nameEl.className = 'cart-name';
  nameEl.textContent = item.name || '';
  info.appendChild(nameEl);

  const qtyRow = document.createElement('div');
  qtyRow.className = 'qty-row';

  const minusBtn = document.createElement('button');
  minusBtn.type = 'button';
  minusBtn.className = 'qty-btn';
  minusBtn.textContent = '－';
  minusBtn.setAttribute('aria-label', `${item.name} 수량 줄이기`);
  minusBtn.onclick = () => {
    cart = cartSetQty(cart, item.menuId, item.qty - 1);
    navigator.vibrate?.(30);
    render();
  };

  const qtyNum = document.createElement('span');
  qtyNum.className = 'qty-num';
  qtyNum.textContent = String(item.qty);

  const plusBtn = document.createElement('button');
  plusBtn.type = 'button';
  plusBtn.className = 'qty-btn';
  plusBtn.textContent = '＋';
  plusBtn.setAttribute('aria-label', `${item.name} 수량 늘리기`);
  plusBtn.onclick = () => {
    cart = cartSetQty(cart, item.menuId, item.qty + 1);
    navigator.vibrate?.(30);
    render();
  };

  qtyRow.append(minusBtn, qtyNum, plusBtn);
  info.appendChild(qtyRow);
  card.appendChild(info);

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'cart-del';
  delBtn.textContent = '✕';
  delBtn.setAttribute('aria-label', `${item.name} 빼기`);
  delBtn.onclick = () => {
    cart = cartSetQty(cart, item.menuId, 0);
    navigator.vibrate?.(30);
    render();
  };
  card.appendChild(delBtn);

  return card;
}

// ---- 스크롤 패널이 항목을 중간에서 자르지 않게 하기 ----
// AAC 원칙(사진 + 글자가 항상 함께)이 걸린 곳: 타일 줄이 반만 보이면 이름 글자도
// 반만 보인다. 그래서 "화면 비율의 몇 %"처럼 어림잡지 않고, 실제로 렌더된 각 항목의
// 위치를 재서 항상 "줄 전체" 단위로만 보이게 자른다. 이름이 길어 두 줄로 접히는
// 항목이 섞여 있어도, 평균이 아니라 각 항목의 실제 위치를 보고 판단하므로 안전하다.

// 항목들을 실제 렌더된 위치 기준으로 "줄"별로 묶는다(순수 측정, 스타일은 안 건드림).
function measureRows(pane, items) {
  const paneTop = pane.getBoundingClientRect().top - pane.scrollTop;
  const rows = [];
  for (const item of items) {
    const rect = item.getBoundingClientRect();
    const top = rect.top - paneTop;
    const bottom = top + rect.height;
    const row = rows.find((r) => Math.abs(r.top - top) < 1);
    if (row) row.bottom = Math.max(row.bottom, bottom);
    else rows.push({ top, bottom });
  }
  rows.sort((a, b) => a.top - b.top);
  return rows;
}

// pane이 지금 가진 공간(clientHeight) 안에서 "줄 전체"만 보이도록 max-height를
// 맞춘다. 반환값은 잘린 줄이 있는지 여부 — 스크롤 화살표를 켤지 그대로 쓴다.
function clampToRows(pane, rows) {
  const cs = getComputedStyle(pane);
  const padTop = parseFloat(cs.paddingTop) || 0;
  const padBottom = parseFloat(cs.paddingBottom) || 0;
  const available = pane.clientHeight - padTop - padBottom;
  let fit = rows[0].bottom;   // 한 줄도 안 들어가는 극단적인 경우에도 첫 줄은 보여준다
  for (const row of rows) {
    if (row.bottom > available) break;
    fit = row.bottom;
  }
  pane.style.maxHeight = (fit + padTop + padBottom) + 'px';
  return fit < rows[rows.length - 1].bottom;
}

// 메뉴 타일 패널과 장바구니 패널의 높이를 함께 정한다. 왜 따로따로가 아니라 "함께"인가:
// 좁은 화면에서는 장바구니가 늘어난 만큼 메뉴가 줄어드는 구조라, 장바구니가 커지면
// 메뉴 타일 줄이 중간에서 잘릴 수 있다(이번 라운드에서 고치는 문제).
// 그렇다고 메뉴에 무조건 최소 높이를 주기만 하면, 이번엔 메뉴+장바구니 합이
// order-screen(= main) 높이를 넘어 footer를 다시 침범한다(Fix round 1에서 고친 문제).
// 그래서 순서를 정해 둘을 한 번에 계산한다:
//   1) 메뉴 "한 줄" 최소 높이를 먼저 잰다 — 메뉴는 이 아래로 줄어들 수 없다.
//   2) 장바구니의 최대 높이를 "전체 − 그 한 줄 − 간격"으로 역산한다
//      (기존 CSS 상한 50%와 비교해 더 작은 쪽을 쓴다).
//   3) 장바구니를 그 한도 안에서 카드 목록 줄 단위로 자리 잡게 한다.
//   4) 장바구니가 실제로 정착한 높이만 빼고 나머지를 전부 메뉴에게 주고,
//      그 안에서 다시 줄 단위로 자른다 — 장바구니가 작으면 메뉴는 한 줄보다
//      더 많이 보일 수 있다.
// 화면을 좌우로 나누는 넓은 화면에서는 두 패널이 각자 height: 100%로 독립적이라
// 이런 다툼이 없으므로 각자 잰다.
// menuPane/cartList는 [스크롤 영역 + 화살표]를 세로로 쌓는 틀이고,
// menuScroll/cartScroll이 실제로 스크롤되는(overflow-y: auto) 안쪽 상자다.
// 타일/카드 줄 단위 계산은 항상 안쪽 상자를 기준으로 한다.
function layoutOrderPanels(menuPane, menuScroll, menuItems, cartPane, cartList, cartScroll, cartItems) {
  const screen = menuPane.parentElement;   // .order-screen
  const stacked = getComputedStyle(screen).flexDirection === 'column';

  // 이전에 재 둔 값이 남아 있으면 지금 실제로 쓸 수 있는 공간을 잘못 잰다
  // (예: 글자 크기가 커져 옆 패널이 자라난 뒤라면, 예전 값 그대로는 "얼마나
  // 남았는지"를 알 수 없다) — 늘 지우고 나서 새로 잰다.
  menuPane.style.maxHeight = '';
  menuPane.style.minHeight = '';
  menuScroll.style.maxHeight = '';
  cartPane.style.maxHeight = '';
  cartScroll.style.maxHeight = '';

  if (!stacked || menuItems.length === 0) {
    const cartTruncated = cartItems.length ? clampToRows(cartScroll, measureRows(cartScroll, cartItems)) : false;
    const menuTruncated = menuItems.length ? clampToRows(menuScroll, measureRows(menuScroll, menuItems)) : false;
    return { cartTruncated, menuTruncated };
  }

  // 화살표는 항상 자기 자리(고정 높이)를 차지하므로, 보이든 안 보이든 그 높이를
  // "메뉴 틀 전체가 최소한 필요로 하는 높이"에 더해야 한다.
  const menuCue = menuPane.querySelector('.scroll-cue');
  const cueBox = menuCue.getBoundingClientRect();
  const cueMarginTop = parseFloat(getComputedStyle(menuCue).marginTop) || 0;
  const cueReserve = cueBox.height + cueMarginTop;

  const menuRows = measureRows(menuScroll, menuItems);
  const oneRow = menuRows[0].bottom;
  const menuFloor = oneRow + cueReserve;   // .order-menu 틀 전체 기준 최소 높이(한 줄 + 화살표 자리)

  // min-height를 명시적으로 걸어 둔다. .order-menu에는 overflow: hidden이 있는데,
  // 이는 (스크롤/클립 컨테이너에게 자동 최소 높이를 0으로 주는 flexbox 규칙 때문에)
  // 화면이 아주 좁고 낮을 때 order-screen이 menuFloor보다 작으면 flex가 이 패널을
  // 한 줄 밑으로 짜부라뜨릴 수 있다는 뜻이다. 명시적 min-height는 그 자동 규칙을
  // 덮어써서 무조건 한 줄은 지키게 하고, 대신 장바구니(overflow-y: auto라 자동
  // 최소 높이가 0)가 먼저 줄어들게 한다 — 그래도 공간이 부족하면 main의
  // overflow-y: auto(Fix round 1)가 마지막 안전망으로 전체를 스크롤시킨다.
  menuPane.style.minHeight = menuFloor + 'px';

  const gap = parseFloat(getComputedStyle(screen).rowGap) || 0;
  const screenHeight = screen.clientHeight;

  // CSS의 max-height: 50%는 JS가 실패할 때만 쓰이는 정적 안전망이다 — 여기서
  // getComputedStyle로 다시 읽지 않는다(퍼센트가 항상 px로 풀리는 게 아니라,
  // 컨테이닝 블록에 따라 "50%" 문자열 그대로 돌아올 수 있어 parseFloat가
  // 50%를 50px로 잘못 읽는 함정이 있다). 아래 계산이 이미 "메뉴 한 줄은 반드시
  // 남긴다"는 조건으로 상한을 정하므로 그 자체로 안전하다.
  //
  // 다만 상한을 0까지 내려버리면(화면이 아주 좁고 낮아 메뉴 한 줄만으로도 이미
  // 공간이 모자란 극단적인 경우) 장바구니 머리글·주문하기 버튼처럼 스스로 줄어들
  // 수 없는 요소들이 이상하게 찌그러진 채 렌더링될 수 있다. 그래서 장바구니가
  // "카드 목록 없이 머리글 + 버튼만 있을 때"의 자연스러운 최소 높이 아래로는
  // 내려가지 않게 한다 — 카드 목록(.cart-scroll)은 0까지 접혀도 되지만(overflow:
  // hidden으로 조용히 가려짐), 버튼은 항상 제 모양을 유지해야 한다. 그래도 전체가
  // 화면에 못 들어가면 main의 overflow-y: auto가 나머지를 스크롤로 받아 준다.
  // 머리글 높이 + 버튼 높이 + 각각의 margin + padding을 일일이 더하면 CSS가
  // 바뀔 때마다 어긋나기 쉽다(실제로 margin을 하나 빠뜨려 8px 차이가 났었다).
  // 대신 카드 목록을 잠깐 display: none으로 빼고 실제 렌더된 높이를 그대로
  // 재는 쪽이 항상 정확하다 — 재고 나서 바로 되돌린다.
  const cartListDisplay = cartList.style.display;
  cartList.style.display = 'none';
  const cartFloor = cartPane.getBoundingClientRect().height;
  cartList.style.display = cartListDisplay;

  const cartCap = Math.max(cartFloor, screenHeight - gap - menuFloor);
  cartPane.style.maxHeight = cartCap + 'px';

  const cartTruncated = cartItems.length ? clampToRows(cartScroll, measureRows(cartScroll, cartItems)) : false;

  const cartActual = cartPane.getBoundingClientRect().height;
  const menuWrapperAvailable = Math.max(menuFloor, screenHeight - gap - cartActual);
  menuPane.style.maxHeight = menuWrapperAvailable + 'px';
  menuScroll.style.maxHeight = (menuWrapperAvailable - cueReserve) + 'px';
  const menuTruncated = clampToRows(menuScroll, menuRows);

  return { cartTruncated, menuTruncated };
}

// 스크롤로 가려진 내용이 더 있을 때만 화살표 표시를 보여주고, 끝까지 스크롤하면 감춘다.
// 색으로만 "더 있음"을 표시하지 않도록(접근성 원칙 2) 화살표 모양을 쓴다.
// truncated(clampPaneToWholeRows의 반환값)가 false면 애초에 잘린 줄이 없다는
// 뜻이라 스크롤 위치와 무관하게 화살표를 절대 보여주지 않는다.
// render()가 패널을 통째로 새로 만들 때뿐 아니라, reclampOrderScreen()이 같은
// DOM을 재사용해 다시 부를 때도 있다 — 이전에 달아 둔 리스너를 먼저 떼어 내
// 스크롤 리스너가 쌓이지 않게 한다.
function attachScrollCue(pane, cue, truncated) {
  if (pane._scrollCueHandler) {
    pane.removeEventListener('scroll', pane._scrollCueHandler);
    pane._scrollCueHandler = null;
  }
  if (!truncated) { cue.classList.remove('show'); return; }
  function update() {
    const hasMore = pane.scrollHeight - pane.scrollTop - pane.clientHeight > 1;
    cue.classList.toggle('show', hasMore);
  }
  pane._scrollCueHandler = update;
  pane.addEventListener('scroll', update);
  update();
}

// 주문 화면 본체 — 왼쪽 메뉴 타일 / 오른쪽 담은 내용.
function renderOrderCartScreen(el) {
  watchOrderScreenResize();   // 최초 1회만 실제로 옵저버를 만든다(내부에서 중복 방지)

  const wrap = document.createElement('div');
  wrap.className = 'order-screen';

  // ---- 왼쪽: 메뉴 타일 ----
  // .order-menu(틀) 안에 [.menu-scroll(스크롤 영역) + 화살표]를 쌓는다.
  // 화살표가 스크롤 영역 "밖"에 있어야 타일 줄과 절대 겹치지 않는다.
  const menuPane = document.createElement('div');
  menuPane.className = 'order-menu';
  const menuScroll = document.createElement('div');
  menuScroll.className = 'menu-scroll';
  const grid = document.createElement('div');
  grid.className = 'menu-grid';
  const menus = sortedMenus(state.menus).filter((m) => m.visible !== false);
  if (menus.length === 0) {
    const hint = document.createElement('p');
    hint.className = 'empty-hint';
    hint.textContent = '등록된 메뉴가 없어요. 선생님께 메뉴 등록을 부탁해 주세요.';
    grid.appendChild(hint);
  } else {
    for (const m of menus) grid.appendChild(buildMenuTile(m));
  }
  menuScroll.appendChild(grid);
  menuPane.appendChild(menuScroll);
  const menuCue = document.createElement('div');
  menuCue.className = 'scroll-cue';
  menuCue.setAttribute('aria-hidden', 'true');
  menuCue.textContent = '⌄';
  menuPane.appendChild(menuCue);

  // ---- 오른쪽: 담은 내용 ----
  const cartPane = document.createElement('div');
  cartPane.className = 'order-cart';

  const head = document.createElement('div');
  head.className = 'cart-head';
  const h2 = document.createElement('h2');
  h2.textContent = '담은 주문';
  head.appendChild(h2);
  if (cart.length > 0) {
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'btn ghost small';
    clearBtn.textContent = '전체 비우기';
    clearBtn.onclick = async () => {
      const ok = await confirmModal({
        title: '모두 뺄까요?',
        msg: '담은 내용을 모두 비웁니다.',
        okText: '비우기', okClass: 'danger', cancelText: '취소',
      });
      if (ok) { cart = []; render(); }
    };
    head.appendChild(clearBtn);
  }
  cartPane.appendChild(head);

  // .cart-list(틀) 안에 [.cart-scroll(스크롤 영역) + 화살표]를 쌓는다 — 메뉴와 같은 구조.
  const list = document.createElement('div');
  list.className = 'cart-list';
  const cartScroll = document.createElement('div');
  cartScroll.className = 'cart-scroll';
  if (cart.length === 0) {
    const hint = document.createElement('p');
    hint.className = 'empty-hint';
    hint.textContent = '메뉴를 눌러 담아 주세요.';
    cartScroll.appendChild(hint);
  } else {
    for (const item of cart) cartScroll.appendChild(buildCartCard(item));
  }
  list.appendChild(cartScroll);
  const cartCue = document.createElement('div');
  cartCue.className = 'scroll-cue';
  cartCue.setAttribute('aria-hidden', 'true');
  cartCue.textContent = '⌄';
  list.appendChild(cartCue);
  cartPane.appendChild(list);

  // 금액 표시(off): 이번 버전에서는 가격·합계를 DOM에 아예 만들지 않는다.
  if (state.settings.priceMode !== 'off' && cart.length > 0) {
    const totalEl = document.createElement('div');
    totalEl.className = 'cart-total';
    totalEl.textContent = `합계 ${cartTotal(cart).toLocaleString('ko-KR')}원`;
    cartPane.appendChild(totalEl);
  }

  const submitBtn = document.createElement('button');
  submitBtn.type = 'button';
  submitBtn.className = 'btn primary big';
  submitBtn.textContent = '주문하기';
  submitBtn.disabled = cart.length === 0 || submitting;
  submitBtn.onclick = () => submitOrder();
  cartPane.appendChild(submitBtn);

  wrap.append(menuPane, cartPane);
  el.appendChild(wrap);

  // DOM에 실제로 붙은 뒤에만 렌더된 크기를 잴 수 있다 — 타일/카드 줄이 잘리지 않게
  // 여기서 두 패널의 높이를 함께 맞추고(layoutOrderPanels), 더 있을 때만 스크롤
  // 화살표를 켠다.
  const { cartTruncated, menuTruncated } = layoutOrderPanels(
    menuPane, menuScroll, [...grid.querySelectorAll('.tile')],
    cartPane, list, cartScroll, [...cartScroll.querySelectorAll('.cart-card')],
  );
  attachScrollCue(cartScroll, cartCue, cartTruncated);
  attachScrollCue(menuScroll, menuCue, menuTruncated);
}

// 주문 완료 — 화면을 덮는 큰 번호. 3초 뒤 자동으로 빈 주문 화면으로 돌아간다.
function renderOrderNoScreen(el, orderNo) {
  const wrap = document.createElement('div');
  wrap.className = 'order-no-screen';
  const label = document.createElement('p');
  label.className = 'order-no-label';
  label.textContent = '주문번호';
  const big = document.createElement('p');
  big.className = 'order-no-big';
  big.textContent = String(orderNo);
  const sub = document.createElement('p');
  sub.className = 'order-no-sub';

// (render()가 그 사이 다시 불려도 번호 화면을 다시 그릴 뿐, 타이머를 새로 잡지 않는다).
function showOrderNumber(orderNo) {

// 주문 저장. 반환하는 orderId는 Task 13(재료 차감 기록)에서 stockLogs.orderId로 쓴다.
async function submitOrder() {
  if (cart.length === 0 || submitting) return;
  submitting = true;
  render();   // 버튼을 바로 비활성화해 중복 탭을 막는다
  const businessDate = businessDateOf();
  try {
    const orderNo = await state.backend.issueOrderNo(businessDate);   // 트랜잭션 — 실패할 수 있다
    const staff = state.settings.todayStaff || {};
    const orderId = await state.backend.add('orders', {
      orderNo,
      businessDate,
      items: cart,
      total: cartTotal(cart),
      status: 'waiting',
      cashier: staff.cashier || '',   // 기록만 해 둔다 (이번 버전에서는 집계하지 않는다)
      barista: staff.barista || '',
      createdAt: Date.now(),
    });
    submitting = false;
    cart = [];   // 주문이 안전하게 저장된 뒤에만 장바구니를 비운다
    showOrderNumber(orderNo);
    return orderId;
  } catch (err) {
    // 발번이 실패하면 장바구니를 그대로 두어 다시 시도할 수 있게 한다.
    submitting = false;
    render();
    toast('주문 번호를 받아오지 못했어요. 다시 눌러 주세요.', { ms: 5000 });
  }
}

// 바리스타 학생이 "무엇을 몇 개 만들지"만 보고, 다 만들면 버튼 하나만 누르면 된다.
// 레이아웃은 main(#app)이 이미 가진 overflow-y: auto에 그대로 맡기는 흐르는 카드
// 그리드다 — Task 7에서 스크롤 구간을 JS로 재다가 세 번 고친 전례가 있어서,
// 여기서는 아예 높이를 재지 않는 쪽을 택했다(잴 게 없으면 잘못 잴 일도 없다).

// 경과 시간·지연 표시를 10초마다 다시 그리지 않고 이 값만 갱신한다.
// 역할이 바뀌거나(다른 화면으로 이동) 주문 데이터가 바뀌어 render()가 다시 불리면
// 카드가 통째로 새로 만들어지므로, 그때마다 반드시 이전 타이머를 지워야
// 재렌더 때마다 인터벌이 쌓이지 않는다.
let baristaTimer = null;
function stopBaristaTimer() {
  if (baristaTimer) { clearInterval(baristaTimer); baristaTimer = null; }
}

// 카드 한 장의 "경과 시간·지연 여부"만 갱신한다(그리기는 buildOrderCard가 한다).
function updateCardTiming(card, order, now, lateMinutes) {
  const late = isLate(order, now, lateMinutes);
  card.classList.toggle('late', late);   // 색에만 기대지 않는다: 두꺼운 테두리(CSS) + 아래 ⏰ 아이콘과 함께 쓴다
  const mins = Math.max(0, Math.floor((now - order.createdAt) / 60000));
  card.querySelector('.elapsed-text').textContent = `${mins}분 경과`;
}

// 재료가 떨어진 걸 가장 먼저 아는 사람이 바리스타이므로, 관리 화면까지 가지 않고
// 여기서 바로 품절 처리할 수 있게 한다. set은 필드 단위로 merge하므로
// soldOut 한 필드만 보낸다(메뉴 객체 전체나 배열을 잘못 보내면 다른 필드가 날아간다).
function toggleMenuSoldOut(menuId) {
  const menu = state.menus.find((m) => m.id === menuId);
  if (!menu) return;
  state.backend.set('menus', menuId, { soldOut: !menu.soldOut });
}

// 주문 한 줄(메뉴 하나) — 사진(또는 이모지) + 이름 + 수량을 항상 함께 보여준다(AAC 원칙).
function buildOrderItemRow(item) {
  const row = document.createElement('div');
  row.className = 'oi';

  const thumb = document.createElement('div');
  thumb.className = 'oi-thumb';
  if (item.photo) {
    const img = document.createElement('img');
    img.src = item.photo;
    img.alt = '';
    thumb.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'emoji';
    span.textContent = item.emoji || '☕';
    thumb.appendChild(span);
  }
  row.appendChild(thumb);

  const name = document.createElement('span');
  name.className = 'oi-name';
  name.textContent = item.name || '';
  row.appendChild(name);

  const qty = document.createElement('b');
  qty.className = 'oi-qty';
  qty.textContent = `×${item.qty}`;
  row.appendChild(qty);

  const menu = state.menus.find((m) => m.id === item.menuId);
  const soldOutBtn = document.createElement('button');
  soldOutBtn.type = 'button';
  soldOutBtn.className = 'oi-soldout' + (menu?.soldOut ? ' on' : '');
  soldOutBtn.textContent = menu?.soldOut ? '품절 해제' : '품절';
  soldOutBtn.setAttribute('aria-label', `${item.name} ${menu?.soldOut ? '품절 해제' : '품절 처리'}`);
  soldOutBtn.onclick = () => toggleMenuSoldOut(item.menuId);
  row.appendChild(soldOutBtn);

  return row;
}

// 대기 카드 한 장.
function buildOrderCard(order, now, lateMinutes) {
  const card = document.createElement('div');
  card.className = 'order-card';
  card.dataset.orderId = order.id;

  const no = document.createElement('div');
  no.className = 'order-no';
  no.textContent = String(order.orderNo);
  card.appendChild(no);

  const items = document.createElement('div');
  items.className = 'order-items';
  for (const item of order.items) items.appendChild(buildOrderItemRow(item));
  card.appendChild(items);

  const elapsed = document.createElement('div');
  elapsed.className = 'order-elapsed';
  const badge = document.createElement('span');
  badge.className = 'late-badge';
  badge.setAttribute('aria-hidden', 'true');   // 색에만 기대지 않는 지연 표시 — 아이콘
  badge.textContent = '⏰';
  const text = document.createElement('span');
  text.className = 'elapsed-text';
  elapsed.append(badge, text);
  card.appendChild(elapsed);

  const doneBtn = document.createElement('button');
  doneBtn.type = 'button';
  doneBtn.className = 'btn ok big';
  doneBtn.textContent = '완료';
  doneBtn.setAttribute('aria-label', `${order.orderNo}번 주문 완료`);
  doneBtn.onclick = () => markReady(order);
  card.appendChild(doneBtn);

  updateCardTiming(card, order, now, lateMinutes);
  return card;
}

// 완료 + 되돌리기 (접근성 원칙 4: 모든 동작은 되돌릴 수 있다)
async function markReady(order) {
  await state.backend.set('orders', order.id, { status: 'ready', readyAt: Date.now() });
  toast(`${order.orderNo}번 호출했어요`, {
    actionText: '되돌리기',
    ms: CONFIG.undoSeconds * 1000,
    onAction: () => state.backend.set('orders', order.id, { status: 'waiting', readyAt: null }),
  });
}

function renderBaristaView(el) {
  stopBaristaTimer();
  const list = waitingOrders(state.orders);
  const lateMinutes = Number(state.settings.lateMinutes) || CONFIG.defaults.lateMinutes;

  const wrap = document.createElement('div');
  wrap.className = 'barista-screen';

  if (list.length === 0) {
    const hint = document.createElement('p');
    hint.className = 'empty-hint';
    hint.textContent = '지금은 만들 음료가 없어요. 잠시 쉬어도 좋아요 :)';
    wrap.appendChild(hint);
  } else {
    const grid = document.createElement('div');
    grid.className = 'order-grid';
    const now0 = Date.now();
    for (const order of list) grid.appendChild(buildOrderCard(order, now0, lateMinutes));
    wrap.appendChild(grid);
  }
  el.appendChild(wrap);

  // 경과 시간은 시간이 흐르기만 해도 바뀐다 — 데이터가 안 바뀌어도 10초마다 다시 잰다.
  baristaTimer = setInterval(() => {
    const now = Date.now();
    const lm = Number(state.settings.lateMinutes) || CONFIG.defaults.lateMinutes;
    for (const order of list) {
      const card = el.querySelector(`.order-card[data-order-id="${order.id}"]`);
      if (card) updateCardTiming(card, order, now, lm);
    }
  }, 10000);
}

// ===== 6. 자가 테스트 =====
// DOM·네트워크를 건드리지 않는 순수 로직만 여기서 검증한다.
const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }

// 깊은 비교 단언. 다르면 Error를 던진다.
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${msg ? msg + ' — ' : ''}기대: ${e} / 실제: ${a}`);
}

function runSelfTest() {
  const fails = [];
  let pass = 0;
  for (const t of TESTS) {
    try { t.fn(); pass++; }
    catch (err) { fails.push(`✗ ${t.name}\n    ${err.message}`); }
  }
  const head = fails.length === 0 ? `PASS ${pass}/${TESTS.length}` : `FAIL ${pass}/${TESTS.length}`;
  document.body.innerHTML =
    `<pre id="selftest-result">${head}\n\n${fails.join('\n\n') || '모든 테스트를 통과했습니다.'}</pre>`;
}

test('테스트 러너가 불일치를 잡아낸다', () => {
  let caught = false;
  try { eq(1, 2); } catch (err) { caught = true; }
  if (!caught) throw new Error('eq가 불일치를 통과시켰습니다');
});

  eq(isLate({ createdAt: 0 }, now, 5), true,  '10분 경과 > 기준 5분');
  eq(isLate({ createdAt: 8 * 60 * 1000 }, now, 5), false, '2분 경과 < 기준 5분');
});

// ===== 7. 시작 =====
if (new URLSearchParams(location.search).has('selftest')) {
  runSelfTest();
} else {
  // Firebase 키가 비어 있으면 로컬 모드로 동작한다 (PRD 6.2)
  state.backend = createLocalBackend();

  // 저장된 데이터가 깨져 있으면 로컬 백엔드는 조용히 빈 상태로 시작한다.
  // 선생님 눈에는 "메뉴가 이유 없이 사라진" 것으로 보이므로 반드시 알린다.
  const raw = localStorage.getItem(CONFIG.localStorageKey);
  if (raw) {
    try { JSON.parse(raw); }
    catch {
      toast('저장된 자료를 읽지 못했어요. 메뉴를 다시 등록해 주세요.', { ms: 8000 });
    }
  }

  for (const name of ['menus', 'ingredients', 'orders']) {
    state.backend.subscribe(name, (docs) => { state[name] = docs; render(); });
  }
  state.backend.subscribe('settings', (docs) => {
    state.settings = { ...CONFIG.defaults, ...(docs.find((d) => d.id === 'app') || {}) };
    // 이 기기가 직접 고른 글자 크기가 없을 때만 선생님의 기본값을 따라간다.
    // (있으면 학생이 이미 고른 값을 절대 덮어쓰지 않는다)
    if (!localStorage.getItem(CONFIG.fontScaleKey)) {
      applyFontScale(state.settings.fontScale);
    }
    render();
  });

  // 지금 로컬인지 클라우드인지 상단바에 표시한다.
  // Task 11에서 Firestore를 붙이면 '연결됨'으로 바뀐다.
  document.getElementById('net-tag').textContent = '연습 모드';

  // 글자 크기 초기값: 이 기기의 선택 → 선생님 기본값 → 전역 기본값 순서로 정한다.
  applyFontScale(localStorage.getItem(CONFIG.fontScaleKey) || state.settings.fontScale || CONFIG.defaults.fontScale);
  for (const b of document.querySelectorAll('.font-switch button')) {
    b.onclick = () => setFontScale(b.dataset.scale);
  }
  document.getElementById('btn-change-role').onclick = changeRole;

  setRole(localStorage.getItem(CONFIG.roleKey) || null);
}
</script>
</body>
</html>
