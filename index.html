<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no">
<title>달보드레</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  /* 달보드레 — '달콤하고 부드럽다'는 이름에 맞춘 부드러운 색감 */
  :root {
    --bg: #fdf7f2;
    --panel: #ffffff;
    --ink: #2a2320;
    --muted: #7a6b60;
    --line: #e8dcd2;
    --brand: #b5651d;
    --brand-dark: #8c4a12;
    --ok: #2f7d4f;
    --warn: #d98a00;
    --danger: #c0392b;
    --radius: 18px;
    /* 글자 크기 3단계 — Task 5에서 실제로 전환한다 */
    --scale: 1;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg); color: var(--ink);
    font-family: 'Noto Sans KR', system-ui, sans-serif;
    font-size: calc(16px * var(--scale));
    display: flex; flex-direction: column; min-height: 100vh;
    user-select: none; -webkit-user-select: none;
  }
  input, textarea, select { user-select: text; -webkit-user-select: text; font: inherit; }
  button { font: inherit; cursor: pointer; border: none; touch-action: manipulation; }
  button:disabled { cursor: not-allowed; opacity: .4; }
  /* main은 flex:1로 정해진 실제 높이를 갖지만 overflow 기본값(visible)이라
     자식이 그보다 커지면 그림만 상자 밖으로 흘러 footer와 겹친다.
     화면(주문·관리 등)이 늘어나도 항상 이 안에서만 스크롤되게 여기서 막는다. */
  main { flex: 1; padding: 16px; min-height: 0; overflow-y: auto; }
  footer { text-align: center; padding: 10px; color: var(--muted); font-size: calc(13px * var(--scale)); }
  #selftest-result { padding: 20px; font-size: 15px; white-space: pre-wrap; line-height: 1.7; }

  /* ---- 공통 버튼 ---- */
  .btn {
    padding: 12px 20px; border-radius: var(--radius); font-weight: 700;
    font-size: calc(15px * var(--scale)); min-height: 48px;
  }
  .btn.primary { background: var(--brand); color: #fff; }
  .btn.primary:active { background: var(--brand-dark); }
  .btn.ghost { background: var(--panel); color: var(--ink); border: 2px solid var(--line) !important; }
  .btn.danger { background: var(--danger); color: #fff; }
  .btn.ok { background: var(--ok); color: #fff; }

  /* ---- 상단바 ---- */
  .topbar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    padding: 10px 16px; background: var(--panel); border-bottom: 2px solid var(--line);
  }
  .topbar[hidden] { display: none; }
  .topbar h1 { font-size: calc(20px * var(--scale)); margin: 0; color: var(--brand); }
  .role-tag {
    background: var(--brand); color: #fff; font-weight: 700;
    padding: 5px 14px; border-radius: 999px; font-size: calc(14px * var(--scale));
  }
  .staff {
    color: var(--muted); font-size: calc(13px * var(--scale));
  }
  .spacer { flex: 1; }
  .net-tag {
    color: var(--muted); background: var(--bg); border: 1px solid var(--line);
    padding: 4px 12px; border-radius: 999px; font-size: calc(12px * var(--scale));
  }
  .font-switch { display: flex; gap: 6px; align-items: center; }
  .font-switch button {
    min-width: 44px; min-height: 44px; border-radius: 12px;
    background: var(--panel); border: 2px solid var(--line); color: var(--ink);
  }
  .font-switch button:nth-child(1) { font-size: 14px; }
  .font-switch button:nth-child(2) { font-size: 19px; }
  .font-switch button:nth-child(3) { font-size: 24px; }
  .font-switch button.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  #btn-change-role {
    background: var(--brand-dark); color: #fff; font-weight: 700;
    padding: 10px 16px; border-radius: var(--radius); font-size: calc(14px * var(--scale));
    min-height: 44px;
  }

  /* ---- 역할 선택 화면 ----
     학생이 처음 만나는 화면이라 카드는 크고, 서로 멀리 떨어뜨려
     옆 카드를 잘못 누르는 일을 줄인다 (접근성 원칙 3·5). */
  .role-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
    gap: 28px; max-width: 760px; margin: 24px auto; padding: 8px;
  }
  .role-grid button {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; min-height: 180px; background: var(--panel);
    border: 3px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
    color: var(--ink); transition: transform .1s ease, border-color .1s ease;
  }
  .role-grid button:active { transform: scale(.96); border-color: var(--brand); }
  .role-grid button span { font-size: 56px; line-height: 1; }
  .role-grid button small { color: var(--muted); font-size: calc(14px * var(--scale)); font-weight: 400; }
  .role-grid button { font-size: calc(22px * var(--scale)); font-weight: 900; }

  /* ---- 사용법 안내 (선생님용) ----
     처음 앱을 켠 선생님이 학생 앞에 서기 전에 혼자 읽고 준비할 수 있어야 한다.
     그래서 역할 선택 화면에서 바로 닿고, 읽는 중에는 다른 것이 끼어들지 않는다. */
  .guide { max-width: 720px; margin: 0 auto; padding-bottom: 32px; }
  .guide-head { display: flex; align-items: center; gap: 12px; margin-bottom: 6px; }
  .guide-head h2 { margin: 0; flex: 1; font-size: calc(24px * var(--scale)); color: var(--brand); }
  .guide-lead { color: var(--muted); font-size: calc(15px * var(--scale)); line-height: 1.7; margin: 0 0 20px; }
  .guide section { margin-bottom: 16px; }
  .guide h3 {
    margin: 0 0 10px; font-size: calc(18px * var(--scale)); color: var(--ink);
    display: flex; align-items: center; gap: 8px;
  }
  .guide p, .guide li { font-size: calc(15px * var(--scale)); line-height: 1.75; color: var(--ink); }
  .guide p { margin: 0 0 10px; }
  .guide ol, .guide ul { margin: 0; padding-left: 22px; }
  .guide li { margin-bottom: 8px; }
  .guide li:last-child { margin-bottom: 0; }
  .guide b { color: var(--brand-dark); }
  .guide-table { width: 100%; border-collapse: collapse; }
  .guide-table th, .guide-table td {
    text-align: left; padding: 10px 8px; border-bottom: 1px solid var(--line);
    font-size: calc(15px * var(--scale));
  }
  .guide-table th { color: var(--muted); font-weight: 700; width: 38%; }
  .guide-table tr:last-child td, .guide-table tr:last-child th { border-bottom: none; }
  /* 놓치면 "소리가 안 나요"로 돌아오는 항목은 따로 세운다 */
  .guide-note {
    background: #fff8ec; border: 2px solid var(--warn); border-radius: var(--radius);
    padding: 14px 16px; margin: 0;
  }
  .guide-note p:last-child { margin-bottom: 0; }
  .guide-open {
    display: block; margin: 8px auto 0; background: none; color: var(--muted);
    font-size: calc(15px * var(--scale)); text-decoration: underline;
    text-underline-offset: 4px; padding: 12px 16px; min-height: 44px;
  }

  /* ---- 토스트 ----
     되돌릴 수 있는 알림. 눈에 잘 띄되 화면을 막지 않는다.
     여러 개가 동시에 뜰 수 있어(예: 완료 직후 품절 토글) 좌표 하나에 고정하지 않되,
     "이미 떠 있는 토스트의 자리는 절대 다시 계산하지 않는다"가 핵심이다 — 학생이
     한 버튼을 겨냥해 손을 뻗는 사이 그 버튼이 움직이면 다른 살아있는 버튼(완료·
     다시 팔기 등) 위에 손가락이 떨어질 수 있기 때문이다. 그래서 flex 재배치에
     기대지 않고, 각 토스트를 만들 때 bottom 값을 딱 한 번 계산해 인라인으로
     박아 둔다(toast() 참고). .toast-stack은 그 낱개 토스트들을 모아 두는 논리적
     그릇일 뿐, 배치에는 관여하지 않는다(각 .toast가 스스로 position: fixed). */
  .toast {
    position: fixed; left: 50%; transform: translateX(-50%);
    display: flex; align-items: center; gap: 16px;
    background: var(--ink); color: #fff; padding: 14px 22px; border-radius: var(--radius);
    box-shadow: 0 6px 20px rgba(0,0,0,.25); font-size: calc(15px * var(--scale));
    max-width: 90vw; z-index: 500;
  }
  .toast button {
    background: var(--brand); color: #fff; font-weight: 700;
    padding: 8px 16px; border-radius: 12px; white-space: nowrap;
  }
  /* 지워진 토스트: DOM에서 바로 빼지 않고 자리(높이)만 남긴 채 숨긴다 — 그래야
     아직 남은 다른 토스트들의 계산된 bottom이 어긋나지 않는다(옆에 갑자기 빈
     칸이 생기는 것도, 자리가 밀리는 것도 아니다. 그냥 그 자리가 "빈 채" 남는다). */
  .toast.dismissed { visibility: hidden; pointer-events: none; }

  /* ---- 확인창 ----
     파괴적인 동작 앞에 반드시 세운다 (접근성 원칙 4). */
  .modal-back {
    position: fixed; inset: 0; background: rgba(42,35,32,.5);
    display: flex; align-items: center; justify-content: center; padding: 16px; z-index: 600;
  }
  .modal {
    background: var(--panel); border-radius: var(--radius); padding: 28px;
    max-width: 420px; width: 100%; box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }
  .modal h3 { margin: 0 0 12px; font-size: calc(20px * var(--scale)); color: var(--ink); }
  .modal p { margin: 0; color: var(--muted); line-height: 1.7; font-size: calc(15px * var(--scale)); white-space: pre-line; }
  .modal-actions { display: flex; gap: 12px; justify-content: flex-end; margin-top: 22px; }

  /* ---- 관리 화면 : PIN 잠금 ---- */
  .card {
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    padding: 28px; max-width: 420px; margin: 24px auto; text-align: center;
    box-shadow: 0 3px 10px rgba(0,0,0,.06);
  }
  .pin-gate h2 { margin: 0 0 8px; color: var(--brand); font-size: calc(22px * var(--scale)); }
  .pin-gate p { color: var(--muted); font-size: calc(15px * var(--scale)); margin: 0; }
  .pin-dots { display: flex; gap: 14px; justify-content: center; margin: 24px 0; }
  .pin-dot { width: 20px; height: 20px; border-radius: 50%; border: 3px solid var(--line); }
  .pin-dot.on { background: var(--brand); border-color: var(--brand); }
  .pin-dots.shake { animation: shake .4s; }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  .keypad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; max-width: 320px; margin: 0 auto; }
  .key { min-height: 68px; font-size: 26px; font-weight: 700; border-radius: 14px; background: var(--panel); border: 2px solid var(--line); }
  .key.blank { visibility: hidden; }

  /* ---- 관리 화면 : 탭 · 메뉴 목록 · 입력 폼 ---- */
  .admin { max-width: 720px; margin: 0 auto; }
  .admin-tabs { display: flex; gap: 8px; margin-bottom: 18px; flex-wrap: wrap; }
  .admin-tab {
    flex: 1; min-width: 100px; min-height: 52px; background: var(--panel);
    border: 2px solid var(--line); border-radius: var(--radius); font-weight: 700;
    font-size: calc(16px * var(--scale)); color: var(--muted);
  }
  .admin-tab.on { background: var(--brand); border-color: var(--brand-dark); color: #fff; }

  .menu-tab-head { margin-bottom: 14px; }
  .menu-list { display: flex; flex-direction: column; gap: 12px; }
  .menu-row {
    display: flex; align-items: center; gap: 14px; padding: 12px;
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
    flex-wrap: wrap;
  }
  .menu-thumb {
    width: 56px; height: 56px; border-radius: 12px; background: var(--bg);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    font-size: 28px; overflow: hidden; flex-shrink: 0;
  }
  .menu-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .menu-info { flex: 1; min-width: 100px; }
  .menu-name { font-weight: 700; font-size: calc(16px * var(--scale)); display: flex; align-items: center; gap: 8px; }
  .menu-price { color: var(--muted); font-size: calc(14px * var(--scale)); }
  .badge { font-size: calc(12px * var(--scale)); font-weight: 700; padding: 2px 10px; border-radius: 999px; }
  .badge.soldout { background: var(--danger); color: #fff; }
  .menu-actions { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .icon-btn {
    width: 40px; height: 40px; border-radius: 10px; background: var(--panel);
    border: 2px solid var(--line); font-size: 16px; color: var(--ink);
  }
  .btn.small { padding: 8px 14px; min-height: 40px; font-size: calc(13px * var(--scale)); }
  .empty-hint { color: var(--muted); text-align: center; padding: 40px 0; font-size: calc(15px * var(--scale)); }

  .field { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; text-align: left; }
  .field span { font-weight: 700; font-size: calc(14px * var(--scale)); color: var(--ink); }
  .field input, .field select {
    min-height: 46px; padding: 8px 12px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--panel); color: var(--ink); font-size: calc(15px * var(--scale));
  }
  .field .hint { color: var(--muted); font-size: calc(12px * var(--scale)); font-weight: 400; line-height: 1.5; }
  .photo-pick { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  .photo-preview {
    width: 72px; height: 72px; border-radius: 12px; border: 2px solid var(--line);
    background: var(--bg); display: flex; align-items: center; justify-content: center;
    font-size: calc(12px * var(--scale)); color: var(--muted); overflow: hidden; text-align: center;
  }
  .photo-preview img { width: 100%; height: 100%; object-fit: cover; }
  .modal .modal-hint { color: var(--muted); font-size: calc(13px * var(--scale)); min-height: 18px; margin: 6px 0 0; }
  .tab-desc { color: var(--muted); font-size: calc(14px * var(--scale)); line-height: 1.6; margin: 0 0 16px; }
  .storage-info { margin-top: 18px; padding-top: 14px; border-top: 1px solid var(--line); }
  .storage-info p { color: var(--muted); font-size: calc(13px * var(--scale)); margin: 0; }

  /* ---- 관리 화면 : 주문번호 초기화 (PRD 3.6.1) ---- */
  .reset-block { margin-top: 20px; padding-top: 18px; border-top: 1px solid var(--line); }
  .reset-block h3 { margin: 0 0 8px; font-size: calc(17px * var(--scale)); color: var(--ink); }
  .reset-current { margin: 0 0 14px; font-size: calc(15px * var(--scale)); color: var(--muted); }
  .reset-current b { color: var(--brand); font-size: calc(20px * var(--scale)); }
  /* 글자까지 눌러도 켜지도록 label로 감싼다 — 작은 네모만 겨냥하지 않아도 된다 */
  .check {
    display: flex; align-items: center; gap: 10px; margin-bottom: 16px; cursor: pointer;
    font-size: calc(15px * var(--scale)); min-height: 44px;
  }
  .check input { width: 24px; height: 24px; flex-shrink: 0; accent-color: var(--brand); }
  .danger-block { border-top-color: var(--danger); }
  .danger-block h3 { color: var(--danger); }

  /* ---- 관리 화면 : 재료 (PRD 3.4 · Task 13) ---- */
  .ing-row .menu-price b { color: var(--ink); }
  .badge.low { background: var(--warn); color: #fff; }
  .shopping-card {
    background: #fff8ec; border: 2px solid var(--warn); border-radius: var(--radius);
    padding: 14px 16px; margin-bottom: 16px;
  }
  .shopping-card h3 { margin: 0 0 8px; font-size: calc(17px * var(--scale)); }
  .shopping-card ul { margin: 0 0 12px; padding-left: 20px; }
  .shopping-card li { font-size: calc(15px * var(--scale)); line-height: 1.8; }
  .shopping-card li small { color: var(--muted); }
  .shopping-actions { display: flex; gap: 8px; flex-wrap: wrap; }
  /* 메뉴 편집 창의 레시피 줄: [재료 고르기][양][단위][✕] */
  .recipe-rows { display: flex; flex-direction: column; gap: 8px; margin-bottom: 8px; }
  .recipe-row { display: flex; align-items: center; gap: 8px; }
  .recipe-row select { flex: 1; min-width: 0; }
  .recipe-row input { width: 90px; }
  .recipe-row select, .recipe-row input {
    min-height: 44px; padding: 8px; border: 2px solid var(--line); border-radius: 10px;
    font-size: calc(15px * var(--scale)); background: var(--panel);
  }
  .recipe-unit { width: 2.4em; color: var(--muted); font-size: calc(14px * var(--scale)); }
  .recipe-row .icon-btn { flex-shrink: 0; }
  .form-modal .field select {
    min-height: 44px; padding: 8px 10px; border: 2px solid var(--line); border-radius: 10px;
    font-size: calc(15px * var(--scale)); background: var(--panel);
  }
  /* 재료 부족 — 경고일 뿐 판매를 막지 않는다 (품절과 다르다). 색만이 아니라 글자로도 알린다 */
  .tile-low {
    position: absolute; top: 6px; right: 6px; padding: 3px 8px; border-radius: 999px;
    background: var(--warn); color: #fff; font-size: calc(12px * var(--scale)); font-weight: 900;
  }
  /* 장볼 목록만 종이에 뽑는다 */
  @media print {
    body.print-shopping > *:not(#app) { display: none !important; }
    body.print-shopping #app * { visibility: hidden; }
    body.print-shopping .shopping-card, body.print-shopping .shopping-card * { visibility: visible; }
    body.print-shopping .shopping-card { position: absolute; left: 0; top: 0; width: 100%; border: none; background: #fff; }
    body.print-shopping .shopping-actions { display: none; }
  }

  /* ---- 관리 화면 : 기록 (PRD 3.5 · Task 16) ----
     막대는 CSS로만 그리고 숫자를 늘 함께 적는다 (길이·색에만 기대지 않는다). */
  .rec-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-bottom: 8px; }
  .rec-bar .seg button { min-height: 44px; }
  .rec-dates { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .rec-dates input { min-height: 44px; padding: 6px 8px; border: 2px solid var(--line); border-radius: 10px; font-size: calc(14px * var(--scale)); }
  .rec-meta { color: var(--muted); font-size: calc(13px * var(--scale)); margin: 0 0 14px; }
  .rec-cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 10px; margin-bottom: 18px; }
  .rec-card { background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px; }
  .rec-card small { display: block; color: var(--muted); font-size: calc(13px * var(--scale)); }
  .rec-card b { font-size: calc(22px * var(--scale)); color: var(--brand-dark); }
  .rec-sec { margin-bottom: 20px; }
  .rec-sec h3 { margin: 0 0 10px; font-size: calc(17px * var(--scale)); }
  .bar-row { display: grid; grid-template-columns: minmax(80px, 30%) 1fr auto; align-items: center; gap: 10px; margin-bottom: 6px; }
  .bar-name { font-size: calc(14px * var(--scale)); overflow-wrap: anywhere; }
  .bar-track { height: 18px; background: var(--bg); border-radius: 999px; overflow: hidden; }
  .bar { display: block; height: 100%; background: var(--brand); border-radius: 999px; }
  .bar-qty { font-size: calc(14px * var(--scale)); min-width: 3.5em; text-align: right; }
  .hour-chart { display: flex; align-items: flex-end; gap: 4px; height: 170px; padding-top: 4px; overflow-x: auto; }
  .hour-col { flex: 1 0 28px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 3px; }
  .hour-col .v { width: 70%; background: var(--brand); border-radius: 6px 6px 0 0; min-height: 2px; }
  .hour-col small { font-size: calc(12px * var(--scale)); color: var(--muted); }
  .hour-col b { font-size: calc(12px * var(--scale)); }
  .rec-table { width: 100%; border-collapse: collapse; font-size: calc(14px * var(--scale)); }
  .rec-table th, .rec-table td { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: right; }
  .rec-table th:first-child, .rec-table td:first-child { text-align: left; }
  .rec-table th { color: var(--muted); font-weight: 700; }
  .rec-list { margin: 0; padding-left: 20px; font-size: calc(14px * var(--scale)); line-height: 1.8; }

  /* ---- 바리스타 ----
     주문 화면 맨 위에서 "누가 만들지"를 먼저 고른다. 메뉴 타일과 같은 생김새로 두어
     학생이 조작을 따로 배우지 않아도 된다. */
  /* 주문 화면은 좌 · 우 두 칸이다.
       왼쪽 : 누가 주문하나요?(고정) + [누가 만들까요? · 메뉴](여기만 스크롤)
       오른쪽: 담은 주문 — 맨 위부터 맨 아래까지 통째로 쓴다
     페이지 자체는 스크롤하지 않는다 — '주문하기'가 늘 같은 자리에 보여야 한다. */
  .order-page { height: 100%; display: flex; flex-direction: row; gap: 16px; min-height: 0; }
  .order-main { flex: 1 1 0; min-width: 0; min-height: 0; display: flex; flex-direction: column; gap: 12px; }
  .barista-bar { flex-shrink: 0; }
  /* 누가 주문하나요? — 맨 위에 두고 눈에 띄게 한다. 원격 주문을 받는 선생님이
     놓치지 않아야 해서, 고르기 전에는 테두리와 배경으로 한 번 더 부른다. */
  .cust-bar {
    flex-shrink: 0; padding: 10px 12px; border-radius: var(--radius);
    background: var(--panel); border: 3px solid var(--line);
  }
  .cust-bar.empty { background: #fdf3e9; border-color: var(--brand); }
  .cust-bar .barista-head h2 { color: var(--brand-dark); }
  .cust-strip { display: flex; gap: 10px; overflow-x: auto; padding: 2px 2px 6px; }
  .ct {
    position: relative; flex: 0 0 auto; min-width: 128px; max-width: 230px; min-height: 76px;
    padding: 10px 14px; border-radius: 16px; text-align: left;
    display: flex; align-items: center; gap: 10px;
    background: var(--bg); border: 3px solid var(--line); color: var(--ink);
  }
  .ct:active { transform: scale(.97); }
  .ct .em { font-size: 28px; line-height: 1; flex-shrink: 0; }
  .ct .nm { font-size: calc(17px * var(--scale)); font-weight: 900; line-height: 1.25; overflow-wrap: anywhere; }
  /* 고른 사람: 색만으로 구분하지 않는다 — 두꺼운 테두리 + 배경 + ✓ */
  .ct.on { border-color: var(--ok); background: #eef7f1; }
  .ct.on::after {
    content: '✓'; position: absolute; top: -10px; right: -8px; width: 30px; height: 30px;
    border-radius: 50%; background: var(--ok); color: #fff; font-size: 17px; font-weight: 900;
    border: 3px solid var(--bg); display: flex; align-items: center; justify-content: center;
  }
  .ct.write { border-style: dashed; }
  .ct.seats { border-style: dashed; }

  /* ---- 자리배치도 고르기 창 ---- */
  .seat-modal { max-width: 900px; width: 100%; max-height: 88vh; display: flex; flex-direction: column; }
  .seat-body { flex: 1; min-height: 0; overflow-y: auto; margin: 10px 0; }
  /* 자리배치도 — 종이 배치도의 좌표를 그대로 흉내 내면 칸이 빽빽하고 제목이 겹친다.
     층 → 교무실 → 사람 순서로 가지런히 늘어놓는 쪽이 눈에 잘 들어오고 찾기도 빠르다. */
  /* 층마다 접었다 편다 — 한 번에 다 펼치면 세로로 너무 길어 찾기 어렵다 */
  .seat-floor { margin-bottom: 10px; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seat-floor > summary {
    list-style: none; cursor: pointer; padding: 12px 14px; min-height: 52px;
    display: flex; align-items: center; gap: 10px;
    background: var(--ink); color: #fff; font-size: calc(16px * var(--scale)); font-weight: 900;
  }
  .seat-floor > summary::-webkit-details-marker { display: none; }
  .seat-floor > summary::before { content: '▸'; font-size: calc(14px * var(--scale)); }
  .seat-floor[open] > summary::before { content: '▾'; }
  .seat-floor > summary .count {
    margin-left: auto; font-size: calc(13px * var(--scale)); font-weight: 400;
    background: rgba(255, 255, 255, .18); border-radius: 999px; padding: 3px 10px;
  }
  .seat-floor > .seat-rooms { padding: 12px; }
  .seat-rooms { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .seat-room {
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px; padding: 12px;
  }
  .seat-room > h5 {
    margin: 0 0 2px; font-size: calc(15px * var(--scale)); color: var(--brand-dark); font-weight: 900;
  }
  .seat-room > .note { margin: 0 0 8px; color: var(--muted); font-size: calc(12px * var(--scale)); line-height: 1.5; }
  .seat-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(132px, 1fr)); gap: 8px; }
  /* 책상 배열을 아는 방은 실제 자리대로 칸을 놓는다 (cols·at). 빈자리는 빈칸으로 남긴다.
     이름만 늘어놓는 것보다, 평소 앉은 자리 모양 그대로가 훨씬 빨리 찾힌다. */
  .seat-room.mapped .seat-grid { grid-template-columns: repeat(var(--cols), minmax(0, 1fr)); }
  .seat-room { grid-column: span 2; }          /* 기본: 한 줄의 반 */
  .seat-room.wide { grid-column: 1 / -1; }     /* 교무실처럼 한 줄 전체 */
  .seat-room.narrow { grid-column: span 1; }   /* 한두 자리뿐인 방: 한 줄에 네 개 */
  .seat-room.narrow:not(.mapped) .seat-grid { grid-template-columns: 1fr; }
  /* 휴대폰에서는 네 칸으로 쪼개면 글자가 다 깨진다. 큰 상자는 한 줄, 작은 방만 둘씩. */
  @media (max-width: 700px) {
    .seat-rooms { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .seat-room, .seat-room.wide { grid-column: 1 / -1; }
    .seat-room.narrow { grid-column: span 1; }
  }
  /* 사람이 없는 공간(미술실 등)은 칸을 꽉 채워 한 줄로 */
  .seat-room.place-only:not(.mapped) .seat-grid { grid-template-columns: 1fr; }
  .seat-cell {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
    min-height: 58px; padding: 8px 6px; border-radius: 12px; text-align: center;
    background: var(--bg); border: 2px solid var(--line); color: var(--ink);
  }
  .seat-cell b { font-size: calc(16px * var(--scale)); font-weight: 900; line-height: 1.2; overflow-wrap: anywhere; }
  .seat-cell small { font-size: calc(11px * var(--scale)); color: var(--muted); line-height: 1.3; }
  .seat-cell:hover, .seat-cell:focus-visible { border-color: var(--brand); background: #fdf3e9; outline: none; }
  .seat-cell:active { transform: scale(.97); border-color: var(--ok); background: #eef7f1; }
  .seat-cell.place { background: var(--panel); border-style: dashed; }
  .seat-cell.place b { color: var(--brand-dark); font-size: calc(15px * var(--scale)); }
  /* 고른 사람이 맞는지 확인받는 작은 창.
     배치도 창(.modal-back, z-index 600)보다 높은 층에 둬야 한다.
     낮게 두면 배치도 뒤에 숨어, 눌러도 아무 일이 없는 것처럼 보인다. */
  /* ---- 관리 → 자리배치도 ---- */
  .seat-edit-room { border: 2px solid var(--line); border-radius: 14px; padding: 12px; margin-bottom: 12px; }
  .seat-edit-head { display: flex; align-items: flex-start; gap: 10px; flex-wrap: wrap; margin-bottom: 10px; }
  .seat-edit-title { flex: 1; min-width: 160px; }
  .seat-edit-title b { display: block; font-size: calc(15px * var(--scale)); color: var(--brand-dark); }
  .seat-edit-title small { color: var(--muted); font-size: calc(12px * var(--scale)); }
  .seat-edit-add { display: flex; gap: 8px; margin-top: 10px; }
  .seat-restore-hint { display: block; color: var(--muted); font-size: calc(12px * var(--scale)); margin-top: 4px; }
  /* 관리 화면 미리보기는 늘 한 줄을 다 쓴다 — 고르는 화면이 아니라 고치는 화면이다 */
  .seat-preview { grid-template-columns: 1fr !important; }
  .seat-preview .seat-room { grid-column: 1 / -1 !important; }
  /* 빈칸은 책상 사이를 벌려 주기만 한다. 고르는 화면에서는 보이지 않고,
     관리 화면에서만 눌러서 옮길 수 있게 모양을 준다. */
  .seat-blank { min-height: 58px; visibility: hidden; }
  .seat-preview .seat-blank {
    visibility: visible; border-radius: 12px; border: 2px dashed var(--line);
    background: repeating-linear-gradient(45deg, transparent, transparent 6px, var(--panel) 6px, var(--panel) 12px);
    color: var(--muted); font-size: calc(12px * var(--scale));
  }
  .seat-confirm-back {
    position: fixed; inset: 0; z-index: 700; background: rgba(42, 35, 32, .5);
    display: flex; align-items: center; justify-content: center; padding: 16px;
  }
  .seat-confirm {
    background: var(--panel); border: 3px solid var(--ok); border-radius: var(--radius);
    padding: 18px 20px; box-shadow: 0 10px 30px rgba(42, 35, 32, .3); min-width: 240px; max-width: 90vw;
  }
  .seat-confirm p { margin: 0 0 12px; font-size: calc(17px * var(--scale)); font-weight: 700; }
  .seat-confirm small { display: block; color: var(--muted); font-weight: 400; font-size: calc(12px * var(--scale)); }
  .seat-confirm .row { display: flex; gap: 6px; }
  .seat-confirm .btn { flex: 1; min-height: 44px; padding: 6px 10px; font-size: calc(14px * var(--scale)); }
  .seat-empty { color: var(--muted); padding: 20px 0; text-align: center; }
  /* 화면이 좁고 낮을 때(휴대폰 가로, 글자 아주 크게)는 주문자 칸을 납작하게 줄인다.
     메뉴 자리를 지키는 게 먼저다 — 주문자는 선택 사항이고 담은 주문 위에도 또 있다. */
  @media (max-height: 820px) and (max-width: 560px) {
    .cust-bar { padding: 8px 10px; }
    .cust-bar .barista-head { margin-bottom: 4px; }
    .cust-bar .barista-head h2 { font-size: calc(17px * var(--scale)); }
    .cust-bar .pick-hint { display: none; }
    .ct { min-height: 56px; min-width: 112px; padding: 8px 12px; }
    .ct .em { font-size: 22px; }
    .ct .nm { font-size: calc(15px * var(--scale)); }
  }
  .barista-head { display: flex; align-items: baseline; gap: 10px; margin: 0 0 8px; flex-wrap: wrap; }
  .barista-head h2 { margin: 0; font-size: calc(20px * var(--scale)); color: var(--brand); font-weight: 900; }
  .barista-head .pick-hint { color: var(--muted); font-size: calc(14px * var(--scale)); }
  .barista-strip { display: flex; gap: 14px; overflow-x: auto; padding: 4px 2px 8px; }
  /* 바리스타 타일은 메뉴 타일과 같은 크기로 둔다 — 손님이 '누가 만드는지'를 보고
     고르는 것이 이 카페의 중요한 교육 목표라, 메뉴보다 작게 두면 뜻이 흐려진다. */
  .bt {
    /* 메뉴 타일처럼 남는 자리를 나눠 갖고 늘어난다. 다만 160px 밑으로는 줄지 않아,
       학생이 많아지면 옆으로 넘겨 본다 (세로로 쌓여 메뉴 자리를 먹지 않게). */
    position: relative; flex: 1 0 160px; max-width: 220px; min-height: 180px; padding: 10px;
    display: flex; flex-direction: column; gap: 8px; text-align: center;
    background: var(--panel); border: 3px solid var(--line); border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  .bt:active { transform: scale(.96); }
  /* 타일 안의 얼굴은 칸을 꽉 채운다 (작은 칩에서 쓰는 .bt-photo 크기는 그대로 둔다) */
  .bt > .bt-photo { width: 100%; height: auto; aspect-ratio: 1; font-size: 52px; border-width: 3px; }
  .bt-photo {
    width: 64px; height: 64px; border-radius: 50%; overflow: hidden; background: var(--bg);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; font-size: 30px;
  }
  .bt-photo img { width: 100%; height: 100%; object-fit: cover; }
  .bt-name { font-size: calc(19px * var(--scale)); font-weight: 900; line-height: 1.25; overflow-wrap: break-word; }
  /* 고른 학생: 색만으로 구분하지 않는다 — 두꺼운 테두리 + 체크 + 글자 */
  .bt.on { border-color: var(--ok); background: #eef7f1; }
  .bt.on .bt-photo { border-color: var(--ok); }
  .bt-check {
    position: absolute; top: -10px; right: -8px; width: 34px; height: 34px; border-radius: 50%;
    background: var(--ok); color: #fff; font-size: 19px; font-weight: 900;
    border: 3px solid var(--bg);
    display: flex; align-items: center; justify-content: center;
  }
  .barista-empty {
    color: var(--muted); font-size: calc(14px * var(--scale)); background: var(--panel);
    border: 2px dashed var(--line); border-radius: 14px; padding: 12px 14px;
  }
  /* 누가 시켰는지 — 담은 주문 위에 둔다. 안 고르면 '현장 손님'이다. */
  .cust-pick {
    display: flex; align-items: center; gap: 8px; width: 100%; margin-bottom: 10px;
    padding: 10px 12px; min-height: 52px; border-radius: 12px; text-align: left;
    background: var(--panel); border: 2px dashed var(--line); color: var(--ink);
    font-size: calc(14px * var(--scale));
  }
  .cust-pick.on { border-style: solid; border-color: var(--brand); background: #fdf3e9; }
  .cust-pick .who { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
  .cust-pick .label { color: var(--muted); flex-shrink: 0; }
  .cust-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; margin-bottom: 14px; }
  .cust-tile {
    display: flex; align-items: center; gap: 8px; padding: 12px; min-height: 60px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 14px;
    color: var(--ink); font-size: calc(15px * var(--scale)); font-weight: 700; text-align: left;
  }
  .cust-tile .em { font-size: 24px; flex-shrink: 0; }
  .cust-tile span { overflow-wrap: anywhere; }
  .cust-tile[aria-pressed="true"] { border-color: var(--brand); background: #fdf3e9; }
  /* 주문자 표 — 제조·매니저 카드에 붙는다 */
  .cust-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px;
    background: #fdf3e9; border: 2px solid var(--brand); border-radius: 999px;
    font-size: calc(13px * var(--scale)); font-weight: 700; color: var(--brand-dark); max-width: 100%;
  }
  .cust-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 호출 화면 — 번호 아래에 이름 */
  .display-cust {
    margin: 0; font-size: clamp(16px, 3vmin, 32px); font-weight: 700; color: var(--brand-dark);
  }

  /* 담은 주문 아래에서 '누가 만드는지'를 한 번 더 보여 준다 */
  .cart-barista {
    display: flex; align-items: center; gap: 8px; margin-bottom: 10px; padding: 8px 10px;
    background: #eef7f1; border: 2px solid var(--ok); border-radius: 12px;
    font-size: calc(14px * var(--scale));
  }
  .cart-barista .bt-photo { width: 34px; height: 34px; font-size: 18px; border-width: 2px; }
  .cart-barista b { color: var(--ok); }
  .need-barista {
    margin: 0 0 8px; padding: 8px 10px; border-radius: 12px; text-align: center;
    background: #fff8ec; border: 2px solid var(--warn); color: var(--ink);
    font-size: calc(14px * var(--scale)); font-weight: 700;
  }
  /* 제조·매니저 카드에 붙는 "누가 만들어요" 표 */
  .who-chip {
    display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px 3px 4px;
    background: var(--bg); border: 2px solid var(--line); border-radius: 999px;
    font-size: calc(13px * var(--scale)); font-weight: 700; max-width: 100%;
  }
  .who-chip .bt-photo { width: 26px; height: 26px; font-size: 14px; border-width: 2px; }
  .who-chip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 제조 화면 위쪽: 내 주문만 보기 */
  .mine-bar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 14px; }
  .mine-bar .label { color: var(--muted); font-size: calc(14px * var(--scale)); }
  .mine-btn {
    min-height: 44px; padding: 6px 12px; border-radius: 999px; background: var(--panel);
    border: 2px solid var(--line); color: var(--ink); font-weight: 700;
    font-size: calc(14px * var(--scale)); display: inline-flex; align-items: center; gap: 6px;
  }
  .mine-btn[aria-pressed="true"] { background: var(--brand); border-color: var(--brand-dark); color: #fff; }
  .mine-btn .bt-photo { width: 26px; height: 26px; font-size: 14px; border-width: 2px; }

  /* ---- 주문 화면 (PRD 3.1) ----
     AAC 원칙: 사진과 글자가 한 타일 안에 항상 함께 있다.
     품절은 색이 아니라 흐림 + 화면을 덮는 큰 ✕로 표시하고, 버튼 자체를 막는다. */
  /* .order-menu는 이제 스크롤 상자가 아니라 [스크롤 영역(.menu-scroll) + 화살표] 를
     세로로 쌓는 틀이다. 스크롤 상자 "안"에 화살표 자리를 padding으로 비워 두면,
     내용이 넘칠 때 그 padding 안까지 다음 줄이 비집고 들어와 버린다(스크롤 컨테이너의
     padding은 넘치는 내용을 막는 경계가 아니라 스크롤 가능한 여유 공간일 뿐이라서).
     그래서 화살표를 스크롤 영역 "밖" 형제로 두어, 항상 자기 자리(고정 높이)만
     차지하고 타일 줄과는 절대 겹치지 않게 한다. */
  /* 왼쪽: 바리스타 줄과 메뉴 타일이 한 덩어리로 여기서만 스크롤된다.
     타일을 줄 단위로 잘라 내지 않으므로 '반쯤 잘린 줄'이 생기지 않는다. */
  .order-menu {
    flex: 1 1 0; min-width: 0; min-height: 0; max-width: none;
    display: flex; flex-direction: column; gap: 12px; overflow-y: auto;
  }
  .menu-scroll { flex: 0 0 auto; }
  /* 주문하기는 항상 눌려야 하는 버튼이라 담은 내용이 길어져도 스크롤에 묻히면 안 된다.
     그래서 패널 전체를 스크롤하는 대신, 카드 목록(.cart-list)만 안에서 스크롤하고
     머리글·합계·버튼은 항상 제자리에 고정한다. min-height: 0은 flex 자식이
     내용 크기 아래로 줄어들 수 있게 해 .cart-list의 overflow-y가 실제로 걸리게 한다. */
  .order-cart {
    /* max-height를 CSS로 걸지 않는다 — JS(layoutOrderPanels)가 "메뉴 한 줄은 반드시
       남긴다"는 조건으로 실제 상한을 정하는데, 여기 퍼센트 상한이 함께 걸려 있으면
       JS가 "머리글 + 버튼만 있을 때의 최소 높이"를 재는 순간에도 적용돼
       그 값을 52px처럼 터무니없이 작게 읽는다(실제로 그렇게 깨졌다). */
    /* 세로로 길게 — 위아래를 꽉 채운다. 담은 목록(.cart-list)만 안에서 스크롤하고
       머리글 · 주문자 · 만드는 사람 · 주문하기는 늘 제자리에 보인다. */
    flex: 0 0 340px; min-width: 280px; max-width: 420px; height: 100%; min-height: 0;
    display: flex; flex-direction: column;
    background: var(--panel); border: 3px solid var(--brand); border-radius: var(--radius);
    padding: 14px 16px;
  }

  /* 옆에 세울 만큼 넓지 않으면(휴대폰 등) 아래로 쌓는다 — 가로 스크롤은 만들지 않는다.
     세로로 세운 태블릿(768px)까지는 옆에 세운다: 카트 340 + 메뉴 400 = 타일 두 줄. */
  @media (max-width: 640px) {
    .order-page { flex-direction: column; gap: 12px; }
    .order-main { flex: 1 1 auto; }
    .order-cart { flex: 0 0 auto; width: 100%; min-width: 0; max-width: none; height: auto; max-height: 52%; }
  }

  .menu-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 14px;
  }
  .tile {
    position: relative; display: flex; flex-direction: column; gap: 8px;
    min-width: 160px; min-height: 180px; padding: 10px;
    background: var(--panel); border: 2px solid var(--line); border-radius: 20px;
    box-shadow: 0 2px 8px rgba(0,0,0,.05); text-align: center;
  }
  .tile:active:not(:disabled) { transform: scale(.96); border-color: var(--brand); }
  .tile-photo {
    aspect-ratio: 1; border-radius: 14px; background: var(--bg);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
  }
  .tile-photo img { width: 100%; height: 100%; object-fit: cover; }
  .tile-photo .emoji { font-size: 52px; line-height: 1; }
  .tile-name { font-size: calc(19px * var(--scale)); font-weight: 900; line-height: 1.25; overflow-wrap: break-word; }
  /* 품절: 색만으로 구분하지 않는다 — 흐림 + 큰 ✕ 오버레이. 버튼은 disabled로 실제로 눌리지 않는다 */
  .tile.soldout { opacity: .35; }
  .tile-soldout {
    position: absolute; inset: 0; border-radius: 18px;
    display: flex; align-items: center; justify-content: center;
    font-size: 64px; font-weight: 900; color: var(--danger);
  }

  .cart-head { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .cart-head h2 { margin: 0; font-size: calc(20px * var(--scale)); color: var(--brand); font-weight: 900; flex: 1; }
  /* .cart-list도 .order-menu와 같은 구조다: [스크롤 영역(.cart-scroll) + 화살표]를
     세로로 쌓는 틀이라, 카드 목록만 안에서 스크롤되고 화살표는 항상 제자리에 있다. */
  /* overflow: hidden — 아주 좁은 화면에서 메뉴 한 줄을 지키느라 장바구니가 빠듯하게
     줄어드는 극단적인 경우에도, 안쪽 내용(카드+화살표)이 이 틀 밖으로 흘러넘쳐
     주문하기 버튼을 덮는 일이 없게 하는 안전장치다(overflow: hidden이 있어야
     이 틀도 "내용 크기 아래로 줄어들 수 있는" 자동 최소 높이를 갖는다). */
  .cart-list { display: flex; flex-direction: column; flex: 1; min-height: 0; overflow: hidden; }
  .cart-scroll {
    display: flex; flex-direction: column; gap: 12px;
    flex: 1; min-height: 60px; overflow-y: auto;
  }
  /* 스크롤로 가려진 내용이 더 있을 때만 나타나는 화살표. 늘 자기 자리(고정 높이)만
     차지해 타일·카드와 결코 겹치지 않는다. 색이 아니라 모양(⌄)으로 "더 있음"을 알린다.
     visibility로 켜고 꺼서(= display 아님) 안 보일 때도 자리는 그대로 남긴다 —
     그래야 화살표가 나타나거나 사라져도 위쪽 스크롤 영역 크기 계산이 흔들리지 않는다. */
  .scroll-cue {
    visibility: hidden; flex-shrink: 0; margin: 3px auto 0;
    width: 40px; height: 24px; border-radius: 999px;
    background: var(--panel); border: 2px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 16px; font-weight: 900; line-height: 1; color: var(--brand-dark);
    box-shadow: 0 2px 8px rgba(0,0,0,.15); pointer-events: none;
  }
  .scroll-cue.show { visibility: visible; }
  .order-page .scroll-cue { display: none; }
  .cart-card {
    display: flex; align-items: center; gap: 14px; padding: 12px 14px;
    background: var(--bg); border: 2px solid var(--line); border-radius: 16px;
  }
  .cart-thumb {
    width: 68px; height: 68px; flex-shrink: 0; border-radius: 14px; background: var(--panel);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 34px;
  }
  .cart-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .cart-info { flex: 1; min-width: 0; }
  .cart-name { font-weight: 900; font-size: calc(17px * var(--scale)); margin-bottom: 8px; overflow-wrap: break-word; }
  .qty-row { display: flex; align-items: center; gap: 10px; }
  .qty-btn {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; background: var(--panel);
    border: 2px solid var(--line); font-size: 22px; font-weight: 900; color: var(--brand-dark);
  }
  .qty-num { min-width: 32px; text-align: center; font-weight: 900; font-size: calc(19px * var(--scale)); }
  .cart-del {
    width: 46px; height: 46px; flex-shrink: 0; border-radius: 12px; background: var(--panel);
    border: 2px solid var(--line); color: var(--danger); font-size: 18px; font-weight: 900;
  }
  .cart-total { text-align: right; font-weight: 900; font-size: calc(16px * var(--scale)); margin: 10px 0; }
  .btn.big { min-height: 68px; font-size: calc(21px * var(--scale)); width: 100%; margin-top: 12px; }

  /* ---- 주문 완료 : 번호 표시 ----
     번호 글자 크기는 상단바 글자 크기 설정과 독립적으로 화면 폭에 맞춰 정한다 —
     이미 화면에서 가장 큰 요소라 --scale까지 곱하면 좁은 화면에서 가로로 넘칠 수 있다. */
  .order-no-screen {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; min-height: 60vh; gap: 12px; text-align: center;
  }
  .order-no-label { color: var(--muted); font-size: calc(20px * var(--scale)); margin: 0; }
  .order-no-big { font-size: clamp(72px, 25vw, 200px); font-weight: 900; color: var(--brand); margin: 0; line-height: 1; }
  .order-no-sub { color: var(--muted); font-size: calc(18px * var(--scale)); margin: 0; }

  /* ---- 제조 화면 (PRD 3.2) ----
     JS로 스크롤 높이를 재지 않는다 — main(#app)이 이미 overflow-y: auto라
     카드가 늘어나면 그 안에서 자연스럽게 흐르며 스크롤된다(Task 7의 "잘린 카드"류
     버그는 JS로 스크롤 구간을 잘라낼 때만 생긴다). */
  .barista-screen { max-width: 1100px; margin: 0 auto; }
  .order-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .order-card {
    display: flex; flex-direction: column; gap: 10px; padding: 16px;
    background: var(--panel); border: 3px solid var(--line); border-radius: var(--radius);
    box-shadow: 0 2px 8px rgba(0,0,0,.05);
  }
  /* 지연: 색에만 기대지 않는다 — 배경색 + 두꺼운 테두리 + ⏰ 아이콘, 세 가지를 함께 쓴다 */
  .order-card.late { border-color: var(--danger); border-width: 4px; background: #fdece8; }
  .order-no { font-size: calc(40px * var(--scale)); font-weight: 900; color: var(--brand); line-height: 1; }
  .order-items { display: flex; flex-direction: column; gap: 8px; }
  .oi { display: flex; align-items: center; gap: 10px; }
  .oi-thumb {
    width: 44px; height: 44px; flex-shrink: 0; border-radius: 10px; background: var(--bg);
    border: 2px solid var(--line); display: flex; align-items: center; justify-content: center;
    overflow: hidden; font-size: 22px;
  }
  .oi-thumb img { width: 100%; height: 100%; object-fit: cover; }
  .oi-name { flex: 1; min-width: 0; font-weight: 700; font-size: calc(16px * var(--scale)); overflow-wrap: break-word; }
  .oi-qty { font-size: calc(16px * var(--scale)); color: var(--brand-dark); flex-shrink: 0; }
  .oi-soldout {
    flex-shrink: 0; padding: 4px 10px; border-radius: 10px; font-size: calc(12px * var(--scale));
    font-weight: 700; background: var(--panel); border: 2px solid var(--line); color: var(--muted);
    min-height: 32px;
  }
  .oi-soldout.on { background: var(--danger); border-color: var(--danger); color: #fff; }
  .order-elapsed { display: flex; align-items: center; gap: 6px; color: var(--muted); font-size: calc(14px * var(--scale)); }
  .late-badge { display: none; font-size: calc(18px * var(--scale)); }
  .order-card.late .late-badge { display: inline; }
  .order-card.late .order-elapsed { color: var(--danger); font-weight: 700; }
  .pickup-head {
    margin: 28px 0 12px; padding-top: 18px; border-top: 2px dashed var(--line);
    font-size: calc(18px * var(--scale)); color: var(--ok);
  }
  .pickup-card { border-color: var(--ok); }
  /* ---- 매니저 보드 (Task 11.5) ----
     한 화면에서 주문의 흐름 전체를 본다. 보드는 main 높이를 꽉 채우고,
     열마다 따로 스크롤한다 — 수령 완료가 길어져도 제조 중이 밀려 내려가지 않는다. */
  .manager { height: 100%; display: flex; flex-direction: column; gap: 12px; min-height: 0; }
  .manager-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
  .manager-bar h2 { margin: 0; flex: 1 0 auto; font-size: calc(20px * var(--scale)); color: var(--brand); }
  .seg { display: inline-flex; border: 2px solid var(--line); border-radius: 12px; overflow: hidden; }
  .seg button {
    min-height: 44px; padding: 8px 14px; background: var(--panel); color: var(--muted);
    font-size: calc(14px * var(--scale)); font-weight: 700;
  }
  .seg button[aria-pressed="true"] { background: var(--brand); color: #fff; }
  /* 좁은 화면에서 태블릿 모드를 골라도 열이 짓눌려 글자가 세로로 쪼개지지 않게 최소 폭을 지키고,
     모자라면 보드 안에서만 옆으로 넘긴다 (페이지 전체는 가로로 밀리지 않는다) */
  .mboard {
    flex: 1; min-height: 0; display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr));
    gap: 12px; overflow-x: auto;
  }
  .mboard.single { grid-template-columns: 1fr; }
  .mcol {
    display: flex; flex-direction: column; min-height: 0;
    background: var(--panel); border: 2px solid var(--line); border-radius: var(--radius);
  }
  .mcol-head {
    display: flex; align-items: center; gap: 8px; padding: 12px 14px;
    border-bottom: 2px solid var(--line); font-weight: 900; font-size: calc(16px * var(--scale));
  }
  .mcol-count {
    margin-left: auto; min-width: 2em; text-align: center; padding: 2px 8px; border-radius: 999px;
    background: var(--bg); border: 2px solid var(--line); font-size: calc(14px * var(--scale));
  }
  .mcol.waiting .mcol-head { color: var(--brand-dark); }
  .mcol.ready { border-color: var(--ok); }
  .mcol.ready .mcol-head { color: var(--ok); }
  .mcol.pickedUp .mcol-head { color: var(--muted); }
  .mcol.cancelled .mcol-head { color: var(--danger); }
  .mcol-body { flex: 1; min-height: 0; overflow-y: auto; padding: 10px; display: flex; flex-direction: column; gap: 10px; }
  .mcol-empty { color: var(--muted); text-align: center; padding: 20px 0; font-size: calc(14px * var(--scale)); }
  .mcol-note {
    margin: 0; padding: 8px 14px; color: var(--muted); line-height: 1.5;
    font-size: calc(12px * var(--scale)); border-bottom: 1px solid var(--line);
  }
  .mcard {
    border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; background: var(--panel);
    display: flex; flex-direction: column; gap: 8px;
  }
  .mcard-no { font-size: calc(28px * var(--scale)); font-weight: 900; color: var(--brand); line-height: 1; }
  .mcol.pickedUp .mcard, .mcol.cancelled .mcard { background: var(--bg); }
  .mcol.pickedUp .mcard-no, .mcol.cancelled .mcard-no { color: var(--muted); }
  .mcol.cancelled .mcard-no { text-decoration: line-through; }
  .mcard .oi-thumb { width: 32px; height: 32px; font-size: 18px; border-radius: 8px; }
  .mcard .oi-name, .mcard .oi-qty { font-size: calc(14px * var(--scale)); }
  .mcard-actions { display: flex; flex-wrap: wrap; gap: 6px; }
  .mcard-actions .btn { flex: 1 1 auto; min-height: 44px; padding: 8px 10px; font-size: calc(13px * var(--scale)); }
  .btn.danger-ghost { background: var(--panel); color: var(--danger); border: 2px solid var(--danger) !important; }
  /* 모바일 모드 — 열 하나씩, 위의 탭으로 고른다 */
  .mtabs { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
  .mtabs button {
    min-height: 52px; padding: 6px 4px; border-radius: 12px; background: var(--panel);
    border: 2px solid var(--line); font-weight: 700; font-size: calc(13px * var(--scale)); color: var(--ink);
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
  }
  .mtabs button b { font-size: calc(18px * var(--scale)); }
  .mtabs button[aria-selected="true"] { background: var(--brand); border-color: var(--brand-dark); color: #fff; }

  /* ---- 호출 화면 (PRD 3.3) ----
     손님이 멀리서 보는 화면이다. 여기서는 글자 크기 3단계(--scale)를 곱하지 않는다 —
     이미 화면이 허락하는 최대치(vmin)까지 키워 두었고, 배율을 한 번 더 곱하면
     번호가 화면 밖으로 넘친다. */
  /* 위: 로고 / 가운데: 지금 부르는 번호 / 아래: 제조 중 · 준비 완료 */
  .display-screen {
    height: 100%; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; gap: 12px;
  }
  .display-head { display: flex; align-items: center; min-height: 0; }
  .display-logo { height: clamp(64px, 15vmin, 170px); width: auto; display: block; }
  .display-title {
    margin: 0; font-size: clamp(22px, 5vmin, 52px); font-weight: 900;
    color: var(--brand); letter-spacing: .06em;
  }
  .display-center {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 8px; text-align: center; min-height: 0;
  }
  /* 손님 눈에 띄지 않게 흐려 두되, 선생님이 찾으면 보이고 누르면 또렷해진다 */
  .display-exit {
    position: fixed; top: 10px; right: 10px; z-index: 40;
    min-height: 44px; padding: 10px 14px; border-radius: 12px;
    background: transparent; color: var(--muted); border: 2px solid transparent;
    font-size: calc(13px * var(--scale)); opacity: .3;
  }
  .display-exit:hover, .display-exit:focus-visible { opacity: 1; border-color: var(--line); background: var(--panel); }
  .display-no {
    font-size: clamp(100px, 30vmin, 340px); font-weight: 900; line-height: .95;
    color: var(--brand-dark); font-variant-numeric: tabular-nums;
  }
  .display-no.pop { animation: call-pop 1.4s ease-out; }
  @keyframes call-pop {
    0%   { transform: scale(.55); opacity: 0; }
    30%  { transform: scale(1.14); opacity: 1; }
    45%  { opacity: .2; }
    60%  { opacity: 1; }
    75%  { opacity: .2; }
    100% { transform: scale(1); opacity: 1; }
  }
  .display-line { margin: 0; font-size: clamp(18px, 4vmin, 40px); font-weight: 700; color: var(--ink); }
  .display-empty { margin: 0; font-size: clamp(20px, 4vmin, 40px); color: var(--muted); }
  .display-board { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .board-col {
    background: var(--panel); border: 3px solid var(--line); border-radius: var(--radius);
    padding: 12px 14px; min-height: clamp(90px, 16vmin, 170px);
  }
  /* 두 구역을 색만으로 가르지 않는다 — 제목 글자와 아이콘이 함께 있다 */
  .board-col h2 {
    margin: 0 0 10px; font-size: clamp(16px, 3vmin, 30px); font-weight: 900;
    display: flex; align-items: center; gap: 8px;
  }
  .board-col.making h2 { color: var(--brand-dark); }
  .board-col.done { border-color: var(--ok); }
  .board-col.done h2 { color: var(--ok); }
  .board-list { display: flex; flex-wrap: wrap; gap: 8px; }
  .board-no {
    min-width: 2.2em; padding: 4px 10px; border-radius: 12px; text-align: center;
    background: var(--bg); border: 2px solid var(--line); color: var(--ink);
    font-size: clamp(18px, 3.6vmin, 38px); font-weight: 900; font-variant-numeric: tabular-nums;
  }
  /* 방금 부른 번호 — 준비 완료 줄의 맨 끝에 가장 진하게 */
  .board-no.latest { background: var(--ok); border-color: var(--ok); color: #fff; }
  .board-more, .board-none { align-self: center; color: var(--muted); font-size: clamp(14px, 2.4vmin, 24px); }
  /* 세로로 긴 화면(세워 둔 태블릿 등)에서는 두 구역을 위아래로 쌓는다 */
  @media (max-width: 600px) { .display-board { grid-template-columns: 1fr; } }
  /* 첫 진입 안내 — 브라우저 자동재생 정책상 한 번 건드려야 소리가 난다 */
  .display-gate {
    position: fixed; inset: 0; z-index: 50; width: 100%;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    background: var(--bg); color: var(--ink); text-align: center; padding: 24px;
  }
  .display-gate-icon { font-size: clamp(48px, 12vmin, 120px); line-height: 1; }
  .display-gate strong { font-size: clamp(22px, 5vmin, 48px); }
  .display-gate small { font-size: clamp(14px, 2.6vmin, 24px); color: var(--muted); }
  /* 움직임에 민감한 사람을 위해 연출만 끈다 — 번호는 그대로 크게 보인다 */
  @media (prefers-reduced-motion: reduce) {
    .display-no.pop { animation: none; }
  }

</style>
</head>
<body>
<div class="topbar" id="topbar" hidden>
  <h1 id="topbar-title">달보드레</h1>
  <span class="role-tag" id="role-tag"></span>
  <span class="staff" id="staff-tag"></span>
  <span class="spacer"></span>
  <span class="net-tag" id="net-tag"></span>
  <div class="font-switch" role="group" aria-label="글자 크기">
    <button data-scale="normal">가</button>
    <button data-scale="large">가</button>
    <button data-scale="xlarge">가</button>
  </div>
  <button id="btn-change-role">역할 바꾸기</button>
</div>
<main id="app"></main>
<footer>Made by 정우쌤</footer>
