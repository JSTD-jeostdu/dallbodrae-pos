// 이 구획에는 DOM 접근과 네트워크 호출을 넣지 않는다 (자가 테스트 대상).

// ---- 영업일 ----
// 상시 운영이므로 날짜가 바뀌면 주문번호가 저절로 1번부터 다시 시작한다.
function businessDateOf(date = new Date()) {
  const p = (n) => String(n).padStart(2, '0');
  return `${date.getFullYear()}-${p(date.getMonth() + 1)}-${p(date.getDate())}`;
}

// ---- 주문번호 ----
// counters/{영업일}.value 는 "마지막으로 발번한 번호"를 담는다. 없으면 0으로 본다.
function nextOrderNo(counterValue) {
  return (counterValue || 0) + 1;
}

// ---- 주문번호 초기화 (PRD 3.6.1) ----
// 아직 받아가지 않은 주문이 남은 채로 번호를 되돌리면 같은 번호가 두 번 불린다.
// 그래서 대기 건수를 보여주고 한 번 더 확인받는다.
function resetPlan(counterValue, startFrom, waitingCount) {
  if (!Number.isInteger(startFrom) || startFrom < 1) {
    return {
      ok: false,
      needsConfirm: false,
      message: '시작 번호는 1 이상의 정수여야 합니다.',
      newCounterValue: counterValue,
    };
  }
  const newCounterValue = startFrom - 1;
  if (waitingCount > 0) {
    return {
      ok: true,
      needsConfirm: true,
      message: `아직 받지 않은 주문이 ${waitingCount}건 있어요.\n지금 번호를 되돌리면 같은 번호가 두 번 불릴 수 있습니다.`,
      newCounterValue,
    };
  }
  return {
    ok: true,
    needsConfirm: false,
    message: `주문번호를 ${startFrom}번부터 다시 시작합니다.`,
    newCounterValue,
  };
}

// ---- 사진 리사이즈 (PRD 6.3) ----
// Firebase Storage를 쓰지 않고 Firestore 문서에 data URL로 넣기 때문에
// 업로드 시점에 반드시 줄여야 한다.

// base64 data URL의 실제 바이트 수
function dataUrlBytes(dataUrl) {
  const b64 = dataUrl.slice(dataUrl.indexOf(',') + 1);
  const padding = (b64.match(/=+$/) || [''])[0].length;
  return Math.floor(b64.length * 3 / 4) - padding;
}

// 비율을 지키며 한 변이 maxPx 이하가 되는 크기. 원본이 더 작으면 그대로 둔다.
function fitBox(w, h, maxPx) {
  const ratio = Math.min(1, maxPx / Math.max(w, h));
  return { w: Math.round(w * ratio), h: Math.round(h * ratio) };
}

// DOM과 캔버스를 사용하므로 자가 테스트 대상이 아니다.
// File → 줄인 JPEG data URL. 목표 용량을 넘으면 품질을 낮춰 최대 3번 재시도한다.
async function shrinkImage(file, opts = {}) {
  const maxPx = opts.maxPx ?? CONFIG.photoMaxPx;
  const maxBytes = opts.maxBytes ?? CONFIG.photoMaxBytes;
  let quality = opts.quality ?? CONFIG.photoQuality;

  // imageOrientation: 휴대폰으로 세로로 찍은 사진이 눕지 않게 EXIF 회전을 반영한다
  const bitmap = await createImageBitmap(file, { imageOrientation: 'from-image' });
  const { w, h } = fitBox(bitmap.width, bitmap.height, maxPx);
  const canvas = document.createElement('canvas');
  canvas.width = w; canvas.height = h;
  const ctx = canvas.getContext('2d');
  ctx.drawImage(bitmap, 0, 0, w, h);
  bitmap.close?.();

  let dataUrl = canvas.toDataURL('image/jpeg', quality);
  for (let i = 0; i < 3 && dataUrlBytes(dataUrl) > maxBytes; i++) {
    quality = Math.max(0.3, quality - 0.15);
    dataUrl = canvas.toDataURL('image/jpeg', quality);
  }
  return dataUrl;
}

// ---- 메뉴 정렬 ----
// order가 없는 메뉴는 맨 뒤에 둔다 (새로 만든 메뉴가 중간에 끼어들지 않게).
function sortedMenus(menus) {
  return [...menus].sort((a, b) => {
    const ao = a.order ?? Number.MAX_SAFE_INTEGER;
    const bo = b.order ?? Number.MAX_SAFE_INTEGER;
    if (ao !== bo) return ao - bo;
    return String(a.name).localeCompare(String(b.name), 'ko');
  });
}

// ---- 장바구니 ----
// 화면에 사진을 다시 조회하지 않아도 되게, 담는 시점의 표시 정보를 함께 복사해 둔다.
function cartAdd(cart, menu) {
  const found = cart.find((c) => c.menuId === menu.id);
  if (found) return cart.map((c) => (c.menuId === menu.id ? { ...c, qty: c.qty + 1 } : c));
  return [...cart, {
    menuId: menu.id,
    name: menu.name,
    photo: menu.photo || null,
    emoji: menu.emoji || '☕',
    price: menu.price || 0,
    qty: 1,
  }];
}

function cartSetQty(cart, menuId, qty) {
  if (qty <= 0) return cart.filter((c) => c.menuId !== menuId);
  return cart.map((c) => (c.menuId === menuId ? { ...c, qty } : c));
}

function cartTotal(cart) {
  return cart.reduce((sum, c) => sum + (c.price || 0) * c.qty, 0);
}

// ---- 바리스타 ----
// 메뉴와 똑같이 관리한다 — 사진·이름을 등록하고 순서를 정한다.
function sortedBaristas(baristas) {
  return [...baristas].sort((a, b) => {
    const ao = a.order ?? Number.MAX_SAFE_INTEGER;
    const bo = b.order ?? Number.MAX_SAFE_INTEGER;
    if (ao !== bo) return ao - bo;
    return String(a.name).localeCompare(String(b.name), 'ko');
  });
}

// 오늘 쉬는 학생은 주문 화면에서 감춘다. 지우는 게 아니라 잠깐 내리는 것이다
// (메뉴 품절과 같은 방식) — 다음에 다시 켜면 그대로 돌아온다.
function activeBaristas(baristas) {
  return sortedBaristas(baristas).filter((b) => !b.offToday);
}

// 기록용 — 취소를 뺀 주문을 바리스타별로 모은다. 많이 만든 순.
// 바리스타를 고르지 않고 들어간 옛 주문은 한 칸에 모아 둔다.
function baristaSummary(orders, from, to) {
  const picked = orders
    .filter((o) => inRange(o, from, to) && o.status !== 'cancelled')
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const map = new Map();
  for (const o of picked) {
    const id = o.baristaId || '';
    const cur = map.get(id) || { baristaId: id, name: '(고르지 않음)', qty: 0, orderCount: 0 };
    cur.qty += (o.items || []).reduce((n, it) => n + (Number(it.qty) || 0), 0);
    cur.orderCount += 1;
    if (o.baristaName) cur.name = o.baristaName;   // 이름이 바뀌었으면 최근 것
    map.set(id, cur);
  }
  return [...map.values()].sort((a, b) => b.qty - a.qty || String(a.name).localeCompare(String(b.name), 'ko'));
}

// ---- 자리배치도 ----
// 주문자를 자리로 찾게 해 주는 명단이다. 관리 → 자리배치도에서 고친다.
//
// 자리는 좌표가 아니라 '순서'로 적는다. CSS 격자가 넣은 순서대로 왼쪽 위부터
// 칸을 채우고 이미 찬 칸은 건너뛰므로, 빈칸만 끼워 넣으면 어떤 모양이든 나온다.
// 한 사람을 지웠을 때 뒤의 모든 좌표를 다시 계산할 필요가 없다.
//   cols   — 한 줄에 몇 칸인지
//   width  — 상자 폭: 'wide' 한 줄 전체 · 'narrow' 반의 반 · 없으면 반 줄
//   span   — 책상이 가로로 몇 칸 (부장 자리 등)
//   rspan  — 세로로 몇 칸
//   blank  — 빈 책상 자리
// 아래는 앱에 들어 있는 기본 명단이다. 관리 화면에서 한 번이라도 고치면
// 저장된 명단만 쓴다 (seatMap 참고).
const DEFAULT_SEAT_MAP = [];
// 관리 화면에서 고친 명단이 있으면 그것만 쓰고, 아직 손대지 않았으면 기본 명단을 쓴다.
// 연습 모드나 처음 켠 기기에서도 자리배치도가 그대로 보이게 하려는 것이다.
function sortedSeatRooms(rooms) {
  return [...rooms].sort((a, b) => (Number(a.order) || 0) - (Number(b.order) || 0));
}

function seatMap() {
  if (state.seats.length) return sortedSeatRooms(state.seats);
  return state.settings.seatsEdited ? [] : DEFAULT_SEAT_MAP;
}

// 한 방에 실제로 앉은 사람만 (빈칸 제외)
function seatPeople(room) {
  return (room.cells || []).filter((c) => !c.blank && c.name);
}

// 주문에 남길 이름. 사람은 '고명희 (4층 본관 교무실)', 공간은 '미술실'.
// 호칭은 붙이지 않는다 — 명단에 교사뿐 아니라 주무관·실무사도 함께 있다.
function seatLabel(person, room) {
  return person.place ? person.name : `${person.name} (${room})`;
}

// ---- 주문자 ----
// 원격 주문(메신저로 받는 주문)이 있어 누가 시켰는지 남겨야 한다.
// 자주 주문하는 사람은 명단에 등록해 두고 타일로 고르고, 없으면 그때만 적는다.
// 받을 장소는 이름에 함께 적는다 (예: '김민수 선생님 (교무실)').
function sortedCustomers(customers) {
  return [...customers].sort((a, b) => {
    const ao = a.order ?? Number.MAX_SAFE_INTEGER;
    const bo = b.order ?? Number.MAX_SAFE_INTEGER;
    if (ao !== bo) return ao - bo;
    return String(a.name).localeCompare(String(b.name), 'ko');
  });
}

// 기록용 — 주문자별 주문 건수와 잔 수. 많이 시킨 순.
// 주문자를 적지 않은 건(카운터 앞 손님)은 한 칸에 모은다.
function customerSummary(orders, from, to) {
  const picked = orders
    .filter((o) => inRange(o, from, to) && o.status !== 'cancelled')
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  const map = new Map();
  for (const o of picked) {
    const name = (o.customerName || '').trim();
    const key = name || '';
    const cur = map.get(key) || { name: name || '현장 손님', qty: 0, orderCount: 0 };
    cur.qty += (o.items || []).reduce((n, it) => n + (Number(it.qty) || 0), 0);
    cur.orderCount += 1;
    map.set(key, cur);
  }
  return [...map.values()].sort((a, b) => b.orderCount - a.orderCount || b.qty - a.qty
    || String(a.name).localeCompare(String(b.name), 'ko'));
}

// ---- 제조 대기 목록 ----
// 정렬은 반드시 createdAt 기준이다.
// 주문번호는 초기화(3.6.1) 때문에 같은 날 중복될 수 있으므로 정렬 키로 쓰면 안 된다.
function waitingOrders(orders) {
  return orders
    .filter((o) => o.status === 'waiting')
    .sort((a, b) => a.createdAt - b.createdAt);
}

function isLate(order, now, lateMinutes) {
  return now - order.createdAt > lateMinutes * 60 * 1000;
}

// ---- 주문 상태 전이 (Task 11.5) ----
// 주문은 제조 중 → 준비 완료 → 수령 완료로 흐르고, 앞의 두 단계에서 취소될 수 있다.
//   status        'waiting' | 'ready' | 'pickedUp' | 'cancelled'
//   readyAt       완료한 시각. 다시 호출해도 바뀌지 않는다 (판매 기록의 제조 시간 계산용)
//   calledAt      마지막으로 부른 시각. 없으면 readyAt을 쓴다 (이 필드가 생기기 전 주문)
//   cancelledFrom 취소 직전 단계 — 되살릴 때 돌아갈 곳
// 모든 화면이 이 함수로만 상태를 바꾼다. 그래야 필드를 빠뜨리는 화면이 생기지 않는다.
function orderPatch(action, order, now) {
  switch (action) {
    case 'complete':     return { status: 'ready', readyAt: now, calledAt: now };
    // 잘못 누른 완료다 — 부른 적 없는 것으로 되돌려야 호출 화면이 직전 번호로 돌아간다
    case 'backToMaking': return { status: 'waiting', readyAt: null, calledAt: null };
    case 'recall':       return { calledAt: now };
    case 'pickUp':       return { status: 'pickedUp', pickedUpAt: now };
    case 'unPickUp':     return { status: 'ready', pickedUpAt: null };
    case 'cancel':       return { status: 'cancelled', cancelledAt: now, cancelledFrom: order.status };
    case 'restore':      return { status: order.cancelledFrom || 'waiting', cancelledAt: null, cancelledFrom: null };
    default: throw new Error(`알 수 없는 주문 동작: ${action}`);
  }
}

// 동작마다 출발할 수 있는 상태. 화면에 보이던 카드가 이미 다른 기기에서 바뀌었을 수 있으므로
// 바꾸기 직전에 최신 상태로 한 번 더 확인한다 — 같은 주문을 두 번 취소해 재료가 두 번
// 돌아오는 일을 막는다.
const ORDER_FROM = {
  complete: ['waiting'], backToMaking: ['ready'], recall: ['ready'],
  pickUp: ['ready'], unPickUp: ['pickedUp'], cancel: ['waiting', 'ready'], restore: ['cancelled'],
};
function canApply(action, order) {
  return (ORDER_FROM[action] || []).includes(order.status);
}

function callTime(order) {
  return order.calledAt || order.readyAt || 0;
}

// ---- 호출 (PRD 3.3) ----
// 아직 손님이 가져가지 않은 완료 주문을, 마지막으로 부른 시각의 최신순으로.
// hiddenFromDisplay는 주문번호를 초기화하면서 호출 화면만 비운 것이다 (PRD 3.6.1).
// 주문 자체는 남아 있으므로 판매 기록에는 그대로 잡힌다.
function recentCalls(orders, count) {
  return orders
    .filter((o) => o.status === 'ready' && callTime(o) && !o.hiddenFromDisplay)
    .sort((a, b) => callTime(b) - callTime(a))
    .slice(0, count);
}

// 호출 화면의 세 구역을 한 번에 정한다.
// 준비 완료는 부른 순서대로(오래된 것 → 새것) 최대 readyMax개만 남긴다.
// 새 번호가 들어오면 맨 앞(가장 오래전에 부른 번호)이 밀려난다.
// 지금 부르는 번호도 준비 완료에 함께 둔다 — 잠깐 한눈판 손님이 옆에서 다시 찾을 수 있다.
//
// 가운데(current)는 "마지막으로 부른 주문"이 아직 준비 완료일 때만 채운다.
// 그 손님이 가져갔거나 취소됐으면 비운다 — 예전 번호가 소리 없이 다시 크게 뜨면
// 손님이 자기 번호를 또 부른 줄 안다.
function displayBoard(orders, readyMax, waitingMax) {
  const ready = recentCalls(orders, readyMax).reverse();
  const waitingAll = waitingOrders(orders);
  let last = null;
  for (const o of orders) {
    if (!callTime(o) || o.hiddenFromDisplay || o.status === 'waiting') continue;
    if (!last || callTime(o) > callTime(last)) last = o;
  }
  return {
    current: last && last.status === 'ready' ? last : null,
    ready,
    waiting: waitingAll.slice(0, waitingMax),
    waitingMore: Math.max(0, waitingAll.length - waitingMax),
  };
}

// 손님을 기다리는 완료 주문 — 먼저 부른 것부터 (오래 기다린 손님이 위에 온다)
function readyQueue(orders) {
  return orders.filter((o) => o.status === 'ready').sort((a, b) => callTime(a) - callTime(b));
}

// ---- 손님 평가 ----
// 손님은 음료 점수(1~4) · 주문 정확도 · 기다린 시간 · 칭찬 스티커 · 한마디를 남긴다.
// 학생에게는 점수를 보여 주지 않는다 — 칭찬만 세어 선생님이 전해 준다.
const SPEED_LABEL = { fast: '빨랐어요', ok: '괜찮아요', slow: '오래 걸렸어요' };

function feedbackSummary(feedbacks) {
  const drinks = feedbacks.map((f) => Number(f.drink)).filter((n) => n >= 1 && n <= 4);
  const answered = feedbacks.filter((f) => typeof f.accurate === 'boolean');
  const speed = { fast: 0, ok: 0, slow: 0 };
  const praiseCount = new Map();     // 스티커별
  const byBarista = new Map();       // 학생별 칭찬 수

  for (const f of feedbacks) {
    if (speed[f.speed] !== undefined) speed[f.speed] += 1;
    const praises = Array.isArray(f.praises) ? f.praises : [];
    for (const text of praises) praiseCount.set(text, (praiseCount.get(text) || 0) + 1);
    if (f.baristaId || f.baristaName) {
      const key = f.baristaId || f.baristaName;
      const cur = byBarista.get(key) || { baristaId: f.baristaId || '', name: f.baristaName || '', praises: 0, count: 0 };
      cur.count += 1;
      cur.praises += praises.length;
      if (f.baristaName) cur.name = f.baristaName;
      byBarista.set(key, cur);
    }
  }

  const drinkCounts = [1, 2, 3, 4].map((v) => ({ score: v, count: drinks.filter((d) => d === v).length }));
  return {
    total: feedbacks.length,
    drinkAvg: drinks.length ? Math.round((drinks.reduce((a, b) => a + b, 0) / drinks.length) * 10) / 10 : null,
    drinkCounts,
    accurateYes: answered.filter((f) => f.accurate).length,
    accurateTotal: answered.length,
    speed,
    praises: [...praiseCount.entries()].map(([text, count]) => ({ text, count })).sort((a, b) => b.count - a.count),
    byBarista: [...byBarista.values()].sort((a, b) => b.praises - a.praises || String(a.name).localeCompare(String(b.name), 'ko')),
    comments: feedbacks.filter((f) => (f.comment || '').trim())
      .sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0)),
  };
}

// ---- 매니저 보드 (Task 11.5) ----
// 끝나지 않은 주문(제조 중 · 준비 완료)은 날짜와 상관없이 모두 보여준다 — 어제 처리 못 한
// 주문이 조용히 사라지면 안 된다. 끝난 주문(수령 · 취소)은 오늘 것만, 최신이 위.
// 손님이 가져간 주문은 잠깐만 남겨 둔다. 하루치가 그대로 쌓이면 보드가 금세 길어져
// 지금 해야 할 일(제조 중 · 준비 완료)이 묻힌다. 지난 건은 관리 → 기록에 그대로 있다.
function managerBoard(orders, businessDate, now = Date.now(), visibleMinutes = 10) {
  const today = (o) => o.businessDate === businessDate;
  const pickedToday = orders.filter((o) => o.status === 'pickedUp' && today(o));
  const cancelledToday = orders.filter((o) => o.status === 'cancelled' && today(o));
  const cutoff = now - visibleMinutes * 60 * 1000;
  return {
    waiting: waitingOrders(orders),
    ready: readyQueue(orders),
    // 수령 시각이 없는 옛 주문은 '방금'인지 알 수 없으니 보드에서 뺀다 (기록에는 남는다)
    pickedUp: pickedToday.filter((o) => (o.pickedUpAt || 0) > cutoff)
      .sort((a, b) => (b.pickedUpAt || 0) - (a.pickedUpAt || 0)),
    pickedUpTodayCount: pickedToday.length,
    // 취소도 마찬가지 — 쌓여 있으면 지금 할 일이 안 보인다. 취소 시각이 없는
    // 옛 주문은 '방금'인지 알 수 없으니 뺀다 (기록에는 남는다).
    cancelled: cancelledToday.filter((o) => (o.cancelledAt || 0) > cutoff)
      .sort((a, b) => (b.cancelledAt || 0) - (a.cancelledAt || 0)),
    cancelledTodayCount: cancelledToday.length,
  };
}

// 화면용 — 숫자를 그대로 쓴다. 손님과 학생이 번호표와 눈으로 맞춰야 한다.
function callText(template, orderNo) {
  return String(template).split('{번호}').join(String(orderNo));
}

// ---- 숫자를 한자어 수사로 (음성용) ----
// 한국어 TTS는 '3번'을 세는 단위로 보고 [세 번]이라고 읽는다.
// 주문번호는 횟수가 아니라 이름표이므로 [삼 번]이 맞다.
const SINO_DIGITS = ['', '일', '이', '삼', '사', '오', '육', '칠', '팔', '구'];
const SINO_UNITS = ['', '십', '백', '천'];

function sinoKorean(n) {
  const num = Math.floor(Math.abs(Number(n) || 0));
  if (num === 0) return '영';

  let out = '';
  const digits = String(num).split('').reverse();   // 1의 자리부터
  for (let i = digits.length - 1; i >= 0; i--) {
    const d = Number(digits[i]);
    if (d === 0) continue;
    // 십·백·천 앞의 1은 읽지 않는다 (10 → '십', 100 → '백')
    const head = (d === 1 && i > 0) ? '' : SINO_DIGITS[d];
    out += head + (SINO_UNITS[i] || '');
  }
  return out;
}

// 음성용 — 번호만 한글 수사로 바꾼다.
// 만 단위 이상은 다루지 않는다. 하루 주문번호가 9,999를 넘을 일이 없고,
// 넘더라도 단위 없이 읽혀 알아들을 수는 있다.
function speechText(template, orderNo) {
  return String(template).split('{번호}').join(sinoKorean(orderNo));
}

// ---- 재료 차감 (PRD 3.4 · Task 12) ----
// 레시피가 비어 있으면 차감하지 않는다. 이게 "점진 도입"의 핵심이다 —
// 선생님이 레시피를 채우기 전까지 재고 기능은 조용히 꺼져 있다.
function stockDelta(items, menuMap) {
  const delta = {};
  for (const item of items) {
    const menu = menuMap[item.menuId];
    if (!menu || !Array.isArray(menu.recipe) || menu.recipe.length === 0) continue;
    for (const r of menu.recipe) {
      delta[r.ingredientId] = (delta[r.ingredientId] || 0) - r.qty * item.qty;
    }
  }
  return delta;
}

function invertDelta(delta) {
  return Object.fromEntries(Object.entries(delta).map(([k, v]) => [k, -v]));
}

// 주문 상태가 바뀔 때 재고에 더할 양.
// 주문할 때 차감한 양(order.stockDelta)을 그대로 되돌리거나 다시 뺀다 — 현재 레시피로
// 다시 계산하면, 주문 뒤에 레시피를 고쳤을 때 복구량이 어긋난다.
function stockEffect(action, order) {
  const d = order.stockDelta || {};
  if (action === 'cancel') return invertDelta(d);
  if (action === 'restore') return { ...d };
  return {};
}

// ---- 장볼 목록 ----
// 기준점을 정하지 않은 재료는 "관리하지 않겠다"는 뜻으로 본다.
function shoppingList(ingredients) {
  return ingredients
    .filter((i) => typeof i.reorderPoint === 'number' && (i.current || 0) <= i.reorderPoint)
    .map((i) => ({
      id: i.id, name: i.name, unit: i.unit,
      current: i.current || 0,
      reorderPoint: i.reorderPoint,
      shortage: i.reorderPoint - (i.current || 0),
    }));
}

function menuLowStock(menu, ingredientMap) {
  if (!Array.isArray(menu.recipe) || menu.recipe.length === 0) return false;
  return menu.recipe.some((r) => {
    const ing = ingredientMap[r.ingredientId];
    return ing && typeof ing.reorderPoint === 'number' && (ing.current || 0) <= ing.reorderPoint;
  });
}

// ---- 집계 (PRD 3.5 · Task 15) ----
// 판매로 세는 주문: 제조 중 · 준비 완료 · 수령 완료. 취소만 뺀다.
function inRange(order, from, to) {
  return order.businessDate >= from && order.businessDate <= to;   // 'YYYY-MM-DD'는 문자열 비교로 충분
}

function summarize(orders, from, to) {
  const picked = orders.filter((o) => inRange(o, from, to));
  // 시간순으로 훑어야 메뉴 이름이 바뀌었을 때 가장 최근 이름이 남는다
  const live = picked.filter((o) => o.status !== 'cancelled')
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));

  const menuMap = new Map();
  const byHour = Array.from({ length: 24 }, (_, hour) => ({ hour, qty: 0 }));
  const days = new Set();
  let totalQty = 0, totalAmount = 0;

  for (const o of live) {
    days.add(o.businessDate);
    const hour = new Date(o.createdAt).getHours();
    for (const it of o.items || []) {
      const qty = Number(it.qty) || 0;
      const amount = (Number(it.price) || 0) * qty;
      const cur = menuMap.get(it.menuId) || { menuId: it.menuId, name: it.name, qty: 0, amount: 0 };
      cur.qty += qty;
      cur.amount += amount;
      cur.name = it.name;
      menuMap.set(it.menuId, cur);
      if (byHour[hour]) byHour[hour].qty += qty;
      totalQty += qty;
      totalAmount += amount;
    }
  }

  return {
    orderCount: live.length,
    cancelledCount: picked.length - live.length,
    dayCount: days.size,
    byMenu: [...menuMap.values()].sort((a, b) => b.qty - a.qty),
    byHour,
    totalQty,
    totalAmount,
  };
}

// ---- 기록 화면 계산 (Task 16) ----
// 기간 버튼. 이번 주는 월요일부터 (학교 한 주의 시작).
function rangeOf(kind, today) {
  if (kind === 'week') {
    const [y, m, d] = today.split('-').map(Number);
    const date = new Date(y, m - 1, d);
    date.setDate(date.getDate() - ((date.getDay() + 6) % 7));
    return { from: businessDateOf(date), to: today };
  }
  if (kind === 'month') return { from: `${today.slice(0, 8)}01`, to: today };
  return { from: today, to: today };
}

// 재료별 입고 · 사용 · 조정 합계. 취소와 되살리기는 판매 차감과 상쇄되어 '실제로 쓴 양'만 남는다.
function stockLedger(logs, ingredients) {
  const rows = new Map(ingredients.map((i) => [i.id, {
    id: i.id, name: i.name, unit: i.unit, current: Number(i.current) || 0, restock: 0, used: 0, adjust: 0,
  }]));
  for (const log of logs) {
    for (const [id, d] of Object.entries(log.delta || {})) {
      const row = rows.get(id);
      if (!row) continue;                       // 지워진 재료
      if (log.type === 'restock') row.restock += d;
      else if (log.type === 'adjust') row.adjust += d;
      else row.used -= d;                       // sale(-) · cancel(+) · restore(-)
    }
  }
  return [...rows.values()].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
}

// ---- CSV ----
function csvCell(v) {
  const s = v === null || v === undefined ? '' : String(v);
  return /[",\n]/.test(s) ? `"${s.replace(/"/g, '""')}"` : s;
}

function toCsv(rows) {
  return rows.map((r) => r.map(csvCell).join(',')).join('\n');
}

// ===== 3. 백엔드 어댑터 =====
// 로컬 모드와 Firestore 모드가 아래 메서드를 똑같이 제공한다.
//   subscribe / add / set / remove / issueOrderNo / resetOrderNo / bump

const COLLECTIONS = ['menus', 'ingredients', 'orders', 'stockLogs', 'counterResets', 'settings'];

// ---- 로컬 모드 ----
// CONFIG.firebase.apiKey 가 비어 있을 때 쓴다.
// 같은 기기의 탭끼리만 동기화된다 (storage 이벤트). 연습·시연용.
function createLocalBackend(storageKey = CONFIG.localStorageKey) {
  const listeners = {};   // { 컬렉션명: [cb, ...] }

  function load() {
    try { return JSON.parse(localStorage.getItem(storageKey)) || {}; }
    catch { return {}; }
  }
  function save(db) {
    localStorage.setItem(storageKey, JSON.stringify(db));
  }
  function docsOf(db, name) {
    return Object.entries(db[name] || {}).map(([id, data]) => ({ id, ...data }));
  }
  function notify(db, name) {
    for (const cb of listeners[name] || []) cb(docsOf(db, name));
  }
  function notifyAll(db) {
    for (const name of Object.keys(listeners)) notify(db, name);
  }

  // 다른 탭에서 바뀌면 이쪽에도 반영한다
  window.addEventListener('storage', (e) => {
    if (e.key === storageKey) notifyAll(load());
  });

  const api = {
    mode: 'local',

    subscribe(name, cb) {
      (listeners[name] ||= []).push(cb);
      cb(docsOf(load(), name));   // 구독 즉시 현재 상태를 한 번 준다
      return () => {
        listeners[name] = listeners[name].filter((f) => f !== cb);
      };
    },

    // field가 from 이상인 문서만 (Firestore 모드와 같은 결과를 내도록 맞춘다)
    subscribeSince(name, field, from, cb) {
      return api.subscribe(name, (docs) => cb(docs.filter((d) => d[field] >= from)));
    },

    deleteAllSync(name) {
      const db = load();
      const n = Object.keys(db[name] || {}).length;
      db[name] = {};
      save(db); notify(db, name);
      return n;
    },

    queryRangeSync(name, field, from, to) {
      return docsOf(load(), name).filter((d) => d[field] >= from && d[field] <= to);
    },

    addSync(name, data) {
      const db = load();
      const id = `${Date.now().toString(36)}-${Math.random().toString(36).slice(2, 8)}`;
      (db[name] ||= {})[id] = data;
      save(db); notify(db, name);
      return id;
    },

    setSync(name, id, patch) {
      const db = load();
      const prev = (db[name] ||= {})[id] || {};
      db[name][id] = { ...prev, ...patch };   // 필드 단위 merge
      save(db); notify(db, name);
    },

    removeSync(name, id) {
      const db = load();
      if (db[name]) delete db[name][id];
      save(db); notify(db, name);
    },

    bumpSync(name, id, fields) {
      const db = load();
      const prev = (db[name] ||= {})[id] || {};
      const next = { ...prev };
      for (const [k, delta] of Object.entries(fields)) next[k] = (next[k] || 0) + delta;
      db[name][id] = next;
      save(db); notify(db, name);
    },

    issueOrderNoSync(businessDate) {
      const db = load();
      const counters = (db.counters ||= {});
      const value = nextOrderNo(counters[businessDate] || 0);
      counters[businessDate] = value;
      save(db);
      return value;
    },

    resetOrderNoSync(businessDate, value) {
      const db = load();
      (db.counters ||= {})[businessDate] = value;
      save(db);
    },

    // 카운터는 구독 대상이 아니다 (바뀔 때마다 화면을 다시 그릴 이유가 없다).
    // 관리 화면에서 '지금 번호'를 보여줄 때만 그때그때 읽는다.
    getCounterSync(businessDate) {
      return (load().counters || {})[businessDate] || 0;
    },

    clearSync() {
      localStorage.removeItem(storageKey);
      notifyAll({});
    },
  };

  // 앱이 쓰는 비동기 인터페이스
  api.add = async (n, d) => api.addSync(n, d);
  api.set = async (n, i, p) => api.setSync(n, i, p);
  api.remove = async (n, i) => api.removeSync(n, i);
  api.bump = async (n, i, f) => api.bumpSync(n, i, f);
  api.issueOrderNo = async (bd) => api.issueOrderNoSync(bd);
  api.resetOrderNo = async (bd, v) => api.resetOrderNoSync(bd, v);
  api.getCounter = async (bd) => api.getCounterSync(bd);
  api.queryRange = async (n, f, from, to) => api.queryRangeSync(n, f, from, to);
  api.deleteAll = async (n) => api.deleteAllSync(n);
  api.clear = async () => api.clearSync();
  return api;
}

// ---- Firestore 모드 ----
// CONFIG.firebase.apiKey 가 채워져 있을 때 쓴다. 기기 여러 대가 실시간으로 함께 본다.
// 경로: {dataRoot}/{spaceId}/{컬렉션}/{문서}
// 인스턴스 이름을 따로 줘서 같은 도메인의 다른 앱과 오프라인 캐시가 섞이지 않게 한다.
async function createFirestoreBackend() {
  const v = CONFIG.firebaseVersion;
  const { initializeApp } = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-app.js`);
  const fs = await import(`https://www.gstatic.com/firebasejs/${v}/firebase-firestore.js`);

  const app = initializeApp(CONFIG.firebase, CONFIG.appName);

  // 오프라인 캐시 (PRD 6.4). 인터넷이 잠깐 끊겨도 화면이 비지 않는다.
  // 같은 기기에서 탭을 여러 개 열 수 있으므로 멀티탭 매니저를 쓴다.
  const settings = {};
  if (fs.persistentLocalCache && fs.persistentMultipleTabManager) {
    settings.localCache = fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() });
  }
  const db = CONFIG.databaseId
    ? fs.initializeFirestore(app, settings, CONFIG.databaseId)
    : fs.initializeFirestore(app, settings);

  const col = (name) => fs.collection(db, CONFIG.dataRoot, CONFIG.spaceId, name);
  const ref = (name, id) => fs.doc(db, CONFIG.dataRoot, CONFIG.spaceId, name, id);
  const counterRef = (bd) => ref('counters', bd);

  return {
    mode: 'firestore',

    subscribe(name, cb) {
      return fs.onSnapshot(col(name), (snap) => {
        cb(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      });
    },

    // 학기 내내 쌓이는 컬렉션(주문)은 최근 것만 실시간으로 받는다.
    // 통째로 구독하면 기기마다 앱을 열 때 수천 건을 읽어 하루 무료 한도를 넘긴다.
    subscribeSince(name, field, from, cb) {
      return fs.onSnapshot(fs.query(col(name), fs.where(field, '>=', from)), (snap) => {
        cb(snap.docs.map((d) => ({ id: d.id, ...d.data() })));
      });
    },

    // 컬렉션 하나를 통째로 지운다 (이 앱의 경로 안에서만). 한 번에 500건까지라 나눠서 지운다.
    async deleteAll(name) {
      const snap = await fs.getDocs(col(name));
      for (let i = 0; i < snap.docs.length; i += 400) {
        const batch = fs.writeBatch(db);
        for (const d of snap.docs.slice(i, i + 400)) batch.delete(d.ref);
        await batch.commit();
      }
      return snap.size;
    },

    // 기록 화면용 — 고른 기간만 그때 한 번 읽는다
    async queryRange(name, field, from, to) {
      const snap = await fs.getDocs(fs.query(col(name), fs.where(field, '>=', from), fs.where(field, '<=', to)));
      return snap.docs.map((d) => ({ id: d.id, ...d.data() }));
    },

    async add(name, data) {
      const d = await fs.addDoc(col(name), data);
      return d.id;
    },

    // 필드 단위 merge — 문서 전체를 덮어쓰지 않는다 (로컬 모드와 같은 동작)
    async set(name, id, patch) {
      await fs.setDoc(ref(name, id), patch, { merge: true });
    },

    async remove(name, id) {
      await fs.deleteDoc(ref(name, id));
    },

    // 재고 증감은 원자적으로 — 두 기기가 동시에 팔아도 유실되지 않는다
    async bump(name, id, fields) {
      const patch = {};
      for (const [k, delta] of Object.entries(fields)) patch[k] = fs.increment(delta);
      await fs.setDoc(ref(name, id), patch, { merge: true });
    },

    // 두 기기가 동시에 주문해도 번호가 겹치지 않으려면 트랜잭션이어야 한다.
    // 트랜잭션은 인터넷이 있어야 하므로 끊겨 있으면 실패한다 (주문 화면이 알린다).
    async issueOrderNo(businessDate) {
      return fs.runTransaction(db, async (tx) => {
        const snap = await tx.get(counterRef(businessDate));
        const value = nextOrderNo(snap.exists() ? snap.data().value : 0);
        tx.set(counterRef(businessDate), { value }, { merge: true });
        return value;
      });
    },

    async resetOrderNo(businessDate, value) {
      await fs.setDoc(counterRef(businessDate), { value }, { merge: true });
    },

    async getCounter(businessDate) {
      const snap = await fs.getDoc(counterRef(businessDate));
      return snap.exists() ? snap.data().value : 0;
    },

    async clear() {
      // 초기화도 이 경로 안에서만 동작한다
      for (const name of COLLECTIONS.concat('counters')) {
        const snap = await fs.getDocs(col(name));
        await Promise.all(snap.docs.map((d) => fs.deleteDoc(d.ref)));
      }
    },
  };
}

// ===== 4. 공통 UI 부품 =====

// 화면에 하나뿐인 토스트 쌓기 틀. #app처럼 절대 다시 만들지 않고 한 번만 붙인다.
let toastStack = null;
function getToastStack() {
  if (!toastStack) {
    toastStack = document.createElement('div');
    toastStack.className = 'toast-stack';
    document.body.appendChild(toastStack);
  }
  return toastStack;
}
const TOAST_STACK_MAX = 3;   // 한꺼번에 너무 많이 쌓이면 화면을 가리므로 오래된 것부터 치운다

// 토스트가 쌓이기 시작하는 기준선(px). round 2에서 만든 --toast-bottom(footer의
// 실제 높이 기반, ResizeObserver가 계속 맞춰 준다)을 그대로 읽어 쓴다.
function toastBaseline() {
  const v = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--toast-bottom'));
  return Number.isFinite(v) ? v : 28;
}

// 토스트 하나를 "지운다" — DOM에서 바로 빼지 않고 자리만 비운다.
// 왜: 다른 토스트가 아직 떠 있는데 하나가 사라졌다고 자리를 다시 계산하면,
// 남은 토스트의 되돌리기 버튼이 학생이 손을 뻗는 사이에 움직여 버린다(옆의
// 완료·다시 팔기 같은 다른 살아있는 버튼 위로 손가락이 떨어질 수 있다).
// 그래서 이 토스트가 차지하던 높이는 그대로 남겨두고(visibility: hidden) 숨기기만
// 하며, 아무도 더 이상 떠 있지 않을 때(전부 지워졌을 때)만 한꺼번에 청소한다 —
// 그 시점엔 누구도 그 자리를 겨냥하고 있지 않으므로 안전하다.
function dismissToast(el) {
  if (el.classList.contains('dismissed')) return;   // 타이머·클릭이 겹쳐도 두 번 처리하지 않는다
  el.classList.add('dismissed');
  const stack = el.parentElement;
  if (!stack) return;
  const anyStillLive = [...stack.children].some((c) => !c.classList.contains('dismissed'));
  if (!anyStillLive) stack.innerHTML = '';
}

// 되돌릴 수 있는 알림. 접근성 원칙 4번(모든 동작은 되돌릴 수 있다)의 손발이다.
// 여러 토스트가 동시에 떠 있어도(완료 직후 품절 토글 등) 전부 온전히 보이고
// 눌려야 한다 — 하나가 다른 하나의 되돌리기를 가리면 "보이는데 안 눌리는" 거짓
// 손잡이가 되어, 되돌리기가 아예 없는 것보다 나쁘다.
function toast(text, { actionText, onAction, ms = 3000 } = {}) {
  const stack = getToastStack();

  // 이 토스트의 자리(bottom)는 지금 딱 한 번만 정한다 — 이미 떠 있는(지워졌지만
  // 자리만 남은 것 포함) 토스트들의 높이를 기준선 위로 쌓아 올린 값이다.
  // 한 번 정하면 이 토스트가 화면에서 사라질 때까지 다시 계산하지 않는다.
  let bottom = toastBaseline();
  for (const child of stack.children) {
    bottom += child.offsetHeight + 10;
  }

  const el = document.createElement('div');
  el.className = 'toast';
  el.style.bottom = `${bottom}px`;
  el.innerHTML = `<span></span>`;
  el.firstChild.textContent = text;
  if (actionText) {
    const b = document.createElement('button');
    b.textContent = actionText;
    b.onclick = () => { dismissToast(el); onAction?.(); };
    el.appendChild(b);
  }
  stack.appendChild(el);
  setTimeout(() => dismissToast(el), ms);

  // 한꺼번에 너무 많이 쌓이면(화면을 가릴 만큼) 가장 오래된 것부터 지운다 —
  // 실행하지 않고 그냥 지운다는 점에서 시간이 다 돼 사라지는 것과 같다.
  // 이때도 dismissToast를 써서 다른 토스트의 자리를 건드리지 않는다.
  const live = [...stack.children].filter((c) => !c.classList.contains('dismissed'));
  while (live.length > TOAST_STACK_MAX) {
    dismissToast(live.shift());
  }
}

// 확인창. 파괴적인 동작 앞에 반드시 둔다.
function confirmModal({ title, msg, okText = '확인', okClass = 'primary', cancelText = '취소' }) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    back.innerHTML = `
      <div class="modal">
        <h3></h3><p></p>
        <div class="modal-actions">
          <button class="btn ghost" data-no></button>
          <button class="btn ${okClass}" data-yes></button>
        </div>
      </div>`;
    back.querySelector('h3').textContent = title;
    back.querySelector('p').textContent = msg;       // \n 을 살리려면 CSS white-space: pre-line
    back.querySelector('[data-no]').textContent = cancelText;
    back.querySelector('[data-yes]').textContent = okText;
    back.querySelector('[data-no]').onclick = () => { back.remove(); resolve(false); };
    back.querySelector('[data-yes]').onclick = () => { back.remove(); resolve(true); };
    document.body.appendChild(back);
  });
}

// 간단한 입력 양식 창. 저장하면 값 객체, 취소하면 null.
// fields: [{ id, label, type: 'text' | 'number' | 'select', value, options: [[값, 글자]], hint, min, step, placeholder }]
// validate(values)가 문구를 돌려주면 창을 닫지 않고 그 문구를 보여준다.
function formModal({ title, desc, fields, okText = '저장', validate }) {
  return new Promise((resolve) => {
    const back = document.createElement('div');
    back.className = 'modal-back';
    const modal = document.createElement('div');
    modal.className = 'modal form-modal';
    const h = document.createElement('h3');
    h.textContent = title;
    modal.appendChild(h);
    if (desc) {
      const d = document.createElement('p');
      d.className = 'tab-desc';
      d.textContent = desc;
      modal.appendChild(d);
    }
    const inputs = {};
    for (const f of fields) {
      const label = document.createElement('label');
      label.className = 'field';
      const span = document.createElement('span');
      span.textContent = f.label;
      label.appendChild(span);
      let input;
      if (f.type === 'select') {
        input = document.createElement('select');
        for (const [v, t] of f.options) {
          const o = document.createElement('option');
          o.value = v;
          o.textContent = t;
          input.appendChild(o);
        }
      } else {
        input = document.createElement('input');
        input.type = f.type || 'text';
        if (f.type === 'number') input.inputMode = 'decimal';
        if (f.min !== undefined) input.min = f.min;
        if (f.step !== undefined) input.step = f.step;
        if (f.placeholder) input.placeholder = f.placeholder;
      }
      input.value = f.value ?? '';
      label.appendChild(input);
      if (f.hint) {
        const hint = document.createElement('small');
        hint.className = 'hint';
        hint.textContent = f.hint;
        label.appendChild(hint);
      }
      inputs[f.id] = input;
      modal.appendChild(label);
    }
    const err = document.createElement('p');
    err.className = 'modal-hint';
    modal.appendChild(err);
    const actions = document.createElement('div');
    actions.className = 'modal-actions';
    const cancel = document.createElement('button');
    cancel.className = 'btn ghost';
    cancel.textContent = '취소';
    const ok = document.createElement('button');
    ok.className = 'btn primary';
    ok.textContent = okText;
    actions.append(cancel, ok);
    modal.appendChild(actions);
    back.appendChild(modal);
    document.body.appendChild(back);
    inputs[fields[0].id]?.focus();

    cancel.onclick = () => { back.remove(); resolve(null); };
    ok.onclick = () => {
      const values = Object.fromEntries(Object.entries(inputs).map(([k, el]) => [k, el.value.trim()]));
      const msg = validate ? validate(values) : null;
      if (msg) { err.textContent = msg; return; }
      back.remove();
      resolve(values);
    };
  });
}

// ===== 5. 화면 =====
const state = {
  role: null,
  backend: null,
  menus: [], baristas: [], customers: [], ingredients: [], orders: [], seats: [], settings: {},
  fontScale: 'normal',
};

const ROLE_LABEL = { order: '주문', barista: '제조', display: '호출', manager: '매니저', admin: '관리' };

// ---- 설정 저장 ----
// settings/app 문서 하나에 필드 단위로 merge 한다 (backend.set 규약).
async function saveSettings(patch) {
  await state.backend.set('settings', 'app', patch);
}

// ---- 글자 크기 (PRD 3.1.7) ----
// 학생마다 편차가 커서 설정 깊숙이 넣지 않고 상단바에 상시 노출한다.
// 화면에 실제로 적용만 한다 — 이 기기의 선택으로 "기억"할지는 호출하는 쪽이 정한다.
function applyFontScale(key) {
  state.fontScale = FONT_SCALES[key] ? key : 'normal';
  document.documentElement.style.setProperty('--scale', FONT_SCALES[state.fontScale]);
  for (const b of document.querySelectorAll('.font-switch button')) {
    b.classList.toggle('on', b.dataset.scale === state.fontScale);
  }
  // 글자 크기가 바뀌면 타일 이름·장바구니 이름의 실제 렌더 높이가 달라진다.
  // 주문 화면이 지금 떠 있다면 줄 단위 스크롤 한도를 다시 재야 한다 — 그대로 두면
  // 이전 크기 기준으로 계산해 둔 max-height가 새 글자 크기에서는 줄 중간을 자를 수
  // 있다. 화면 전체를 다시 그리면(render) 다른 화면(관리 화면 입력 중인 값 등)이
  // 끊기므로, 주문 화면 패널만 찾아 다시 잰다.
  reclampOrderScreen();
  // footer 높이도 글자 크기에 따라 바뀐다 — 옵저버가 잡기 전에 한 프레임이라도
  // 토스트가 footer를 가리는 일이 없게 즉시 한 번 더 맞춘다.
  syncToastBottomOffset();
}

// applyFontScale이 호출하는, 주문 화면 전용 재계산. 주문 화면이 떠 있지 않으면
// 아무 것도 하지 않는다(다른 화면에는 이런 패널이 없다). 실제 계산은
// layoutOrderPanels()가 두 패널을 함께 맞춘다(주석 참고).
function reclampOrderScreen() {
  const menuPane = document.querySelector('.order-menu');
  const menuScroll = document.querySelector('.menu-scroll');
  const cartPane = document.querySelector('.order-cart');
  const cartList = document.querySelector('.cart-list');
  const cartScroll = document.querySelector('.cart-scroll');
  if (!menuPane || !menuScroll || !cartPane || !cartList || !cartScroll) return;
  const { cartTruncated, menuTruncated } = layoutOrderPanels(
    menuPane, menuScroll, [...menuScroll.querySelectorAll('.tile')],
    cartPane, cartList, cartScroll, [...cartScroll.querySelectorAll('.cart-card')],
  );
  const menuCue = menuPane.querySelector('.scroll-cue');
  if (menuCue) attachScrollCue(menuScroll, menuCue, menuTruncated);
  const cartCue = cartList.querySelector('.scroll-cue');
  if (cartCue) attachScrollCue(cartScroll, cartCue, cartTruncated);
}

// ---- 주문 화면 크기 재계산: 창 크기 변화 대응 ----
// 태블릿이 회전하거나, 화면 키보드가 열리고 닫히거나, 모바일 브라우저 주소창이
// 스크롤에 따라 나타났다 사라지는 것만으로도 뷰포트 높이가 바뀐다 — 버튼을
// 누르거나 글자 크기를 바꾸는 것 같은 "동작" 없이도 생기는 일이라, 여기서도
// reclampOrderScreen()을 불러야 예전 크기 기준 max-height가 남아 줄을 자르지 않는다.
// main(#app)은 역할이 바뀌거나 화면이 재렌더돼도 절대 다시 만들어지지 않는
// 고정된 엘리먼트라, 옵저버를 한 번만 만들어 여기 달아 두면 재렌더마다 다시
// 쌓일 일이 없다(관리 화면 등 주문 화면이 아닐 때는 reclampOrderScreen이 그냥
// 아무 것도 하지 않고 돌아간다).
let mainResizeObserver = null;
let resizeRaf = null;
function watchOrderScreenResize() {
  if (mainResizeObserver || typeof ResizeObserver === 'undefined') return;
  const main = document.getElementById('app');
  mainResizeObserver = new ResizeObserver(() => {
    // 창을 드래그로 빠르게 늘렸다 줄였다 해도 매 프레임 수십 번씩 다시 재지
    // 않도록, 한 애니메이션 프레임에 한 번만 재계산하게 묶는다.
    if (resizeRaf) cancelAnimationFrame(resizeRaf);
    resizeRaf = requestAnimationFrame(() => {
      resizeRaf = null;
      reclampOrderScreen();
    });
  });
  mainResizeObserver.observe(main);
}

// ---- 토스트 틀이 footer를 가리지 않게 ----
// .toast-stack은 화면 맨 아래에 fixed로 고정되는데 footer도 같은 자리에 있다.
// 토스트가 여러 개 쌓이거나(품절+완료가 겹칠 때) 글자 크기가 커지면 틀의 높이가
// 늘어나 footer와 겹칠 수 있다. footer의 실제 렌더 높이(글자 크기·좁은 화면에서의
// 줄바꿈에 따라 바뀐다)만큼 토스트 틀의 바닥 여백을 띄워, 토스트가 항상 footer
// 위에서만 쌓이게 한다.
function syncToastBottomOffset() {
  const footer = document.querySelector('footer');
  if (!footer) return;
  document.documentElement.style.setProperty('--toast-bottom', `${footer.offsetHeight + 16}px`);
}

// footer도 #app처럼 절대 다시 만들어지지 않는 고정 엘리먼트라, 옵저버를 한 번만
// 달아 두면 된다(글자 크기 변경은 applyFontScale에서 즉시 한 번 더 불러 한 프레임의
// 지연도 없앤다).
let footerResizeObserver = null;
function watchFooterResize() {
  if (footerResizeObserver || typeof ResizeObserver === 'undefined') return;
  const footer = document.querySelector('footer');
  if (!footer) return;
  footerResizeObserver = new ResizeObserver(() => syncToastBottomOffset());
  footerResizeObserver.observe(footer);
}

// 상단바 가/가/가 버튼 전용 — 이 기기만의 선택으로 기억한다(localStorage).
// 학생이 자기 앞 태블릿만 조절하는 것이므로 다른 기기에 영향을 주면 안 된다.
function setFontScale(key) {
  applyFontScale(key);
  localStorage.setItem(CONFIG.fontScaleKey, state.fontScale);
}

// ---- 관리 화면 (PRD 3.6) ----
// 선생님이 코드를 열지 않고 메뉴·담당·설정을 바꾸는 유일한 경로다.

// 학생이 실수로 들어가 메뉴를 지우는 일을 막는 잠금장치다 (보안 장치는 아니다).
// 풀린 상태는 어디에도 저장하지 않는다 — 새로고침하거나, 관리 화면을 나가거나,
// 한동안 아무도 건드리지 않으면 다시 비밀번호를 묻는다.
let adminUnlocked = false;
let adminLastTouch = 0;

function lockAdmin() {
  adminUnlocked = false;
  pinInput = '';
}

// 관리 화면을 켜 둔 채 자리를 비우면 저절로 잠근다.
// 열려 있던 입력창(메뉴 편집 · 확인창)도 닫는다 — 잠긴 뒤에 누가 '저장'을 누르면 안 된다.
function watchAdminIdle() {
  const touch = () => { adminLastTouch = Date.now(); };
  for (const ev of ['pointerdown', 'keydown', 'wheel']) {
    document.addEventListener(ev, touch, { capture: true, passive: true });
  }
  const check = () => {
    if (state.role !== 'admin' || !adminUnlocked) return;
    if (Date.now() - adminLastTouch < CONFIG.adminIdleMinutes * 60 * 1000) return;
    lockAdmin();
    for (const m of document.querySelectorAll('.modal-back')) m.remove();
    if (guideOpen) guideOpen = false;
    render();
    toast('잠시 쓰지 않아서 관리 화면을 잠갔어요.', { ms: 6000 });
  };
  setInterval(check, 10 * 1000);
  // 화면이 가려져 있으면 브라우저가 타이머를 늦춘다 (다른 앱으로 갔다가 돌아온 경우).
  // 다시 보이는 순간 먼저 검사해야, 돌아와서 첫 손길이 풀린 관리 화면에 닿지 않는다.
  document.addEventListener('visibilitychange', () => { if (!document.hidden) check(); });
}
let pinInput = '';
let adminTab = 'menu';   // 'menu' | 'baristas' | 'customers' | 'seats' | 'ingredients' | 'records' | 'staff' | 'settings'

function renderPinGate(el) {
  el.innerHTML = `
    <div class="card pin-gate">
      <h2>선생님 확인</h2>
      <p>관리 화면에 들어가려면 비밀번호 4자리를 눌러 주세요.</p>
      <div class="pin-dots" id="pin-dots"></div>
      <div class="keypad" id="pin-pad"></div>
    </div>`;

  const dots = el.querySelector('#pin-dots');
  const pad = el.querySelector('#pin-pad');

  function drawDots() {
    dots.innerHTML = '';
    for (let i = 0; i < 4; i++) {
      const d = document.createElement('span');
      d.className = 'pin-dot' + (i < pinInput.length ? ' on' : '');
      dots.appendChild(d);
    }
  }

  function push(ch) {
    if (pinInput.length >= 4) return;
    pinInput += ch;
    drawDots();
    if (pinInput.length === 4) setTimeout(check, 150);
  }

  function check() {
    const expected = String(state.settings.pin || CONFIG.defaults.pin);
    if (pinInput === expected) {
      adminUnlocked = true;
      adminLastTouch = Date.now();
      pinInput = '';
      render();
    } else {
      dots.classList.add('shake');
      setTimeout(() => dots.classList.remove('shake'), 400);
      pinInput = '';
      drawDots();
    }
  }

  for (const label of ['1','2','3','4','5','6','7','8','9','','0','지우기']) {
    const b = document.createElement('button');
    b.textContent = label;
    b.className = 'key' + (label === '지우기' ? ' wide' : '');
    if (label === '') { b.disabled = true; b.className = 'key blank'; }
    else if (label === '지우기') b.onclick = () => { pinInput = pinInput.slice(0, -1); drawDots(); };
    else b.onclick = () => push(label);
    pad.appendChild(b);
  }

  pinInput = '';
  drawDots();
}

function renderAdminTabs(el) {
  el.innerHTML = `
    <div class="admin">
      <div class="admin-tabs" role="tablist">
        <button class="admin-tab" data-tab="menu">🍹 메뉴</button>
        <button class="admin-tab" data-tab="baristas">🧑‍🍳 바리스타</button>
        <button class="admin-tab" data-tab="customers">🙋 주문자</button>
        <button class="admin-tab" data-tab="seats">🗺️ 자리배치도</button>
        <button class="admin-tab" data-tab="ingredients">🥛 재료</button>
        <button class="admin-tab" data-tab="records">📊 기록</button>
        <button class="admin-tab" data-tab="staff">🧑‍🍳 담당</button>
        <button class="admin-tab" data-tab="settings">⚙️ 설정</button>
      </div>
      <div class="admin-body" id="admin-body"></div>
    </div>`;

  for (const b of el.querySelectorAll('.admin-tab')) {
    b.classList.toggle('on', b.dataset.tab === adminTab);
    b.onclick = () => { adminTab = b.dataset.tab; renderAdminTabs(el); };
  }

  const body = el.querySelector('#admin-body');
  if (adminTab === 'baristas') renderBaristaTab(body);
  else if (adminTab === 'customers') renderCustomerTab(body);
  else if (adminTab === 'seats') renderSeatTab(body);
  else if (adminTab === 'ingredients') renderIngredientTab(body);
  else if (adminTab === 'records') renderRecordsTab(body);
  else if (adminTab === 'staff') renderStaffTab(body);
  else if (adminTab === 'settings') renderSettingsTab(body);
  else renderMenuTab(body);
}

function renderMenuTab(body) {
  const list = sortedMenus(state.menus);
  body.innerHTML = `
    <div class="menu-tab-head">
      <button class="btn primary" id="btn-add-menu">＋ 메뉴 추가</button>
    </div>
    <div class="menu-list" id="menu-list"></div>`;
  body.querySelector('#btn-add-menu').onclick = () => openMenuModal();

  const listEl = body.querySelector('#menu-list');
  if (list.length === 0) {
    const p = document.createElement('p');
    p.className = 'empty-hint';
    p.textContent = '등록된 메뉴가 없어요. 위 버튼으로 첫 메뉴를 추가해 보세요.';
    listEl.appendChild(p);
    return;
  }

  list.forEach((m, i) => {
    const row = document.createElement('div');
    row.className = 'menu-row';

    const thumb = document.createElement('div');
    thumb.className = 'menu-thumb';
    if (m.photo) {
      const img = document.createElement('img');
      img.src = m.photo;
      img.alt = m.name || '메뉴 사진';
      thumb.appendChild(img);
    } else {
      thumb.textContent = m.emoji || '☕';
    }
    row.appendChild(thumb);

    const info = document.createElement('div');
    info.className = 'menu-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'menu-name';
    nameEl.textContent = m.name || '(이름 없음)';
    if (m.soldOut) {
      const badge = document.createElement('span');
      badge.className = 'badge soldout';
      badge.textContent = '품절';
      nameEl.appendChild(badge);
    }
    const priceEl = document.createElement('div');
    priceEl.className = 'menu-price';
    const rc = (m.recipe || []).length;
    priceEl.textContent = `${(Number(m.price) || 0).toLocaleString('ko-KR')}원 · ${rc ? `재료 ${rc}가지` : '재고 차감 안 함'}`;
    info.append(nameEl, priceEl);
    row.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'menu-actions';

    const upBtn = document.createElement('button');
    upBtn.className = 'icon-btn';
    upBtn.textContent = '▲';
    upBtn.title = '위로';
    upBtn.disabled = i === 0;
    upBtn.onclick = () => moveMenu(m.id, -1);

    const downBtn = document.createElement('button');
    downBtn.className = 'icon-btn';
    downBtn.textContent = '▼';
    downBtn.title = '아래로';
    downBtn.disabled = i === list.length - 1;
    downBtn.onclick = () => moveMenu(m.id, 1);

    const soldOutBtn = document.createElement('button');
    soldOutBtn.className = 'btn ghost small';
    soldOutBtn.textContent = m.soldOut ? '품절 해제' : '품절 처리';

}

// 목록 순서를 위/아래로 한 칸 옮기고 order를 1부터 다시 매긴다.
// (order 값이 서로 겹치거나 비어 있어도 항상 정확한 순서로 정리된다)
async function moveMenu(id, dir) {
  const list = sortedMenus(state.menus);
  const idx = list.findIndex((m) => m.id === id);
  const j = idx + dir;
  if (idx < 0 || j < 0 || j >= list.length) return;
  [list[idx], list[j]] = [list[j], list[idx]];
  await Promise.all(list.map((m, i) => state.backend.set('menus', m.id, { order: i + 1 })));
}

// ---- 메뉴 추가 · 수정 모달 ----
// existing이 있으면 수정, 없으면 새 메뉴 추가.
function openMenuModal(existing) {

  let photo = existing?.photo || null;

  back.className = 'modal-back';
  back.innerHTML = `
    <div class="modal menu-modal">

        <span>이름</span>

      </label>
      <label class="field">
        <span>가격 (원)</span>
        <input type="number" id="mm-price" min="0" step="100" placeholder="예: 1000">
      </label>
      <label class="field">
        <span>이모지 (사진이 없을 때 표시)</span>
        <input type="text" id="mm-emoji" maxlength="4" placeholder="☕">
      </label>
      <div class="field">
        <span>사진 (선택)</span>
        <div class="photo-pick">
          <div class="photo-preview" id="mm-preview">${photo ? `<img src="${photo}" alt="미리보기">` : '사진 없음'}</div>
          <input type="file" accept="image/*" id="mm-file" style="display:none">
          <button type="button" class="btn ghost small" id="mm-pick-btn">사진 선택</button>
          <button type="button" class="btn ghost small" id="mm-clear-btn" ${photo ? '' : 'disabled'}>사진 지우기</button>
        </div>
        <p class="modal-hint" id="mm-hint"></p>
      </div>
      <div class="field">
        <span>레시피 (1잔에 들어가는 재료)</span>
        <div class="recipe-rows" id="mm-recipe"></div>
        <div><button type="button" class="btn ghost small" id="mm-add-recipe">＋ 재료 넣기</button></div>
        <small class="hint" id="mm-recipe-hint"></small>
      </div>
      <div class="modal-actions">
        <button class="btn ghost" id="mm-cancel">취소</button>
        <button class="btn primary" id="mm-save">저장</button>
      </div>
    </div>`;
  document.body.appendChild(back);

  const nameInput = back.querySelector('#mm-name');
  const priceInput = back.querySelector('#mm-price');
  const emojiInput = back.querySelector('#mm-emoji');
  const preview = back.querySelector('#mm-preview');
  const fileInput = back.querySelector('#mm-file');
  const pickBtn = back.querySelector('#mm-pick-btn');
  const clearBtn = back.querySelector('#mm-clear-btn');
  const hint = back.querySelector('#mm-hint');
  const saveBtn = back.querySelector('#mm-save');
  const cancelBtn = back.querySelector('#mm-cancel');

  nameInput.value = existing?.name || '';
  priceInput.value = existing?.price ?? '';
  emojiInput.value = existing?.emoji || '☕';

  // ---- 레시피 (Task 13) ----
  // 비워 두면 이 메뉴는 재고를 건드리지 않는다 (점진 도입).
  let recipe = (existing?.recipe || []).map((r) => ({ ...r }));
  const recipeEl = back.querySelector('#mm-recipe');
  const recipeHint = back.querySelector('#mm-recipe-hint');
  const addRecipeBtn = back.querySelector('#mm-add-recipe');
  const ings = sortedIngredients();
  function drawRecipe() {
    recipeEl.innerHTML = '';
    recipe.forEach((r, i) => {
      const row = document.createElement('div');
      row.className = 'recipe-row';
      const sel = document.createElement('select');
      sel.setAttribute('aria-label', '재료');
      const known = ings.some((g) => g.id === r.ingredientId);
      if (!known) {
        const o = document.createElement('option');
        o.value = r.ingredientId || '';
        o.textContent = '(지워진 재료)';
        sel.appendChild(o);
      }
      for (const g of ings) {
        const o = document.createElement('option');
        o.value = g.id;
        o.textContent = g.name;
        sel.appendChild(o);
      }
      sel.value = r.ingredientId || '';
      const qty = document.createElement('input');
      qty.type = 'number';
      qty.min = '0';
      qty.step = 'any';
      qty.inputMode = 'decimal';
      qty.placeholder = '양';
      qty.setAttribute('aria-label', '1잔에 쓰는 양');
      qty.value = r.qty ?? '';
      const unit = document.createElement('span');
      unit.className = 'recipe-unit';
      const unitOf = () => ings.find((g) => g.id === sel.value)?.unit || '';
      unit.textContent = unitOf();
      sel.onchange = () => { recipe[i].ingredientId = sel.value; unit.textContent = unitOf(); };
      qty.oninput = () => { recipe[i].qty = qty.value; };
      const del = document.createElement('button');
      del.type = 'button';
      del.className = 'icon-btn';
      del.textContent = '✕';
      del.setAttribute('aria-label', '이 재료 빼기');
      del.onclick = () => { recipe.splice(i, 1); drawRecipe(); };
      row.append(sel, qty, unit, del);
      recipeEl.appendChild(row);
    });
    if (ings.length === 0) {
      addRecipeBtn.disabled = true;
      recipeHint.textContent = '관리 → 재료 탭에서 재료를 먼저 등록하면 레시피를 넣을 수 있어요. 비워 둬도 주문은 그대로 됩니다.';
    } else {
      addRecipeBtn.disabled = false;
      recipeHint.textContent = recipe.length ? '' : '재료를 넣지 않으면 재고를 차감하지 않습니다. 나중에 채워도 됩니다.';
    }
  }
  addRecipeBtn.onclick = () => { recipe.push({ ingredientId: ings[0]?.id, qty: '' }); drawRecipe(); };
  drawRecipe();

  pickBtn.onclick = () => fileInput.click();
  cancelBtn.onclick = () => back.remove();

  function setPreview() {
    preview.innerHTML = '';
    if (photo) {
      const img = document.createElement('img');
      img.src = photo;
      img.alt = '미리보기';
      preview.appendChild(img);
    } else {
      preview.textContent = '사진 없음';
    }
    clearBtn.disabled = !photo;
  }

  fileInput.onchange = async () => {
    const file = fileInput.files[0];
    fileInput.value = '';
    if (!file) return;
    pickBtn.disabled = true;
    saveBtn.disabled = true;
    hint.textContent = '사진을 줄이는 중...';
    try {
      photo = await shrinkImage(file);
      setPreview();
      hint.textContent = '';
    } catch (err) {
      hint.textContent = '사진을 불러오지 못했어요. 다른 사진으로 시도해 주세요.';
    } finally {
      pickBtn.disabled = false;
      saveBtn.disabled = false;
    }
  };

  clearBtn.onclick = () => { photo = null; setPreview(); };

  saveBtn.onclick = async () => {
    const name = nameInput.value.trim();
    const price = Number(priceInput.value);
    const emoji = emojiInput.value.trim() || '☕';
    if (!name) { toast('메뉴 이름을 입력해 주세요.'); return; }
    if (!Number.isFinite(price) || price < 0) { toast('가격을 올바르게 입력해 주세요.'); return; }
    // shrinkImage는 3번 재시도해도 용량을 못 맞추면 큰 사진을 그대로 돌려준다.
    // 그대로 저장하면 1MB 문서 제한에 걸려 아무 안내 없이 저장이 실패하므로 미리 막는다.
    if (photo && dataUrlBytes(photo) > CONFIG.photoMaxBytes) {
      toast('사진 용량이 너무 커요. 다른 사진으로 다시 올려 주세요.', { ms: 5000 });
      return;
    }
    // 레시피: 재료를 고르고 양을 적은 줄만 남기고, 같은 재료는 합친다
    const merged = {};
    for (const r of recipe) {
      const q = Number(r.qty);
      if (!r.ingredientId || !Number.isFinite(q) || q <= 0) continue;
      merged[r.ingredientId] = (merged[r.ingredientId] || 0) + q;
    }
    if (recipe.some((r) => r.qty !== '' && r.qty !== undefined && !(Number(r.qty) > 0))) {
      toast('레시피의 양은 0보다 큰 숫자로 입력해 주세요.');
      return;
    }
    const cleanRecipe = Object.entries(merged).map(([ingredientId, qty]) => ({ ingredientId, qty }));
    saveBtn.disabled = true;
    try {
      const patch = { name, price, emoji, photo, recipe: cleanRecipe };
      if (isEdit) {
        await state.backend.set('menus', existing.id, patch);
      } else {
        const maxOrder = state.menus.reduce((mx, m) => Math.max(mx, Number(m.order) || 0), 0);
        await state.backend.add('menus', { ...patch, order: maxOrder + 1, visible: true, soldOut: false });
      }
      back.remove();
      toast(isEdit ? '메뉴를 저장했어요.' : '메뉴를 추가했어요.');
    } finally {
      saveBtn.disabled = false;
    }
  };
}

async function moveBarista(id, dir) {
  const list = sortedBaristas(state.baristas);
  const idx = list.findIndex((b) => b.id === id);
  const j = idx + dir;
  if (idx < 0 || j < 0 || j >= list.length) return;
  [list[idx], list[j]] = [list[j], list[idx]];

}

    thumb.className = 'menu-thumb';
    thumb.textContent = c.emoji || '🙋';
    row.appendChild(thumb);

    const info = document.createElement('div');
    info.className = 'menu-info';
    const nameEl = document.createElement('div');
    nameEl.className = 'menu-name';
    nameEl.textContent = c.name || '(이름 없음)';
    const sub = document.createElement('div');
    sub.className = 'menu-price';
    sub.textContent = '주문 화면에서 고를 수 있어요';
    info.append(nameEl, sub);
    row.appendChild(info);

    const actions = document.createElement('div');
    actions.className = 'menu-actions';

    const upBtn = document.createElement('button');
    upBtn.className = 'icon-btn';
    upBtn.textContent = '▲';
    upBtn.title = '위로';
    upBtn.disabled = i === 0;
    upBtn.onclick = () => moveCustomer(c.id, -1);

    const downBtn = document.createElement('button');
    downBtn.className = 'icon-btn';
    downBtn.textContent = '▼';
    downBtn.title = '아래로';
    downBtn.disabled = i === list.length - 1;
    downBtn.onclick = () => moveCustomer(c.id, 1);

    const editBtn = document.createElement('button');
    editBtn.className = 'btn ghost small';
    editBtn.textContent = '수정';
    editBtn.onclick = () => openCustomerModal(c);

    const delBtn = document.createElement('button');
    delBtn.className = 'btn danger small';
    delBtn.textContent = '삭제';
    delBtn.onclick = async () => {
      const ok = await confirmModal({
        title: '주문자를 삭제할까요?',
        msg: `"${c.name}"을(를) 명단에서 지웁니다.\n이미 받은 주문 기록은 그대로 남아요.`,
        okText: '삭제', okClass: 'danger', cancelText: '취소',
      });
      if (!ok) return;
      await state.backend.remove('customers', c.id);
      if (orderCustomer.id === c.id) setOrderCustomer({ id: '', name: '' });
      toast('주문자를 삭제했어요.');
    };

    actions.append(upBtn, downBtn, editBtn, delBtn);
    row.appendChild(actions);
    listEl.appendChild(row);
  });
}

async function moveCustomer(id, dir) {
  const list = sortedCustomers(state.customers);
  const idx = list.findIndex((c) => c.id === id);
  const j = idx + dir;
  if (idx < 0 || j < 0 || j >= list.length) return;
  [list[idx], list[j]] = [list[j], list[idx]];
  await Promise.all(list.map((c, i) => state.backend.set('customers', c.id, { order: i + 1 })));
}

async function openCustomerModal(existing) {
  const values = await formModal({
    title: existing ? '주문자 수정' : '주문자 추가',
    desc: '받을 장소를 괄호로 함께 적어 두면 가져다 드릴 때 편해요.',
    fields: [
      { id: 'name', label: '이름 (장소)', value: existing?.name, placeholder: '예: 김민수 선생님 (교무실)' },
      { id: 'emoji', label: '이모지', value: existing?.emoji || '🙋', placeholder: '🙋' },
    ],
    validate: (v) => {
      if (!v.name) return '이름을 입력해 주세요.';
      if (state.customers.some((c) => c.name === v.name && c.id !== existing?.id)) return '같은 이름이 이미 있어요.';
      return null;
    },
  });
  if (!values) return;
  const patch = { name: values.name, emoji: values.emoji || '🙋' };
  if (existing) {
    await state.backend.set('customers', existing.id, patch);
    toast('주문자를 저장했어요.');
  } else {
    const maxOrder = state.customers.reduce((mx, c) => Math.max(mx, Number(c.order) || 0), 0);
    await state.backend.add('customers', { ...patch, order: maxOrder + 1, createdAt: Date.now() });
    toast('주문자를 추가했어요.');
  }
}

// ---- 자리배치도 상자 하나 그리기 ----
// 주문 화면(고르기)과 관리 화면(미리보기)이 같은 모양을 쓰도록 한 군데로 모은다.
// onPick이 있으면 누를 수 있는 칸, 없으면 보기만 하는 칸이다.
function buildSeatRoomCard(room, cells, { mapped, onPick, placeOnly, onCell } = {}) {
  const card = document.createElement('div');
  card.className = 'seat-room'
    + (room.width === 'narrow' ? ' narrow' : '')
    + (placeOnly ? ' place-only' : '')
    + (mapped ? ' mapped' : '')
    + (mapped && (room.width === 'wide' || room.cols >= 3) ? ' wide' : '');
  if (mapped) card.style.setProperty('--cols', room.cols);

  const h5 = document.createElement('h5');
  h5.textContent = room.room;
  card.appendChild(h5);
  if (room.note) {
    const note = document.createElement('p');
    note.className = 'note';
    note.textContent = room.note;
    card.appendChild(note);
  }

  const grid = document.createElement('div');
  grid.className = 'seat-grid';
  cells.forEach((person, i) => {
    if (person.blank) {
      // 빈 책상 자리. 격자에서 한 칸을 차지해 뒤 칸을 밀어 준다.
      const hole = document.createElement(onCell ? 'button' : 'div');
      hole.className = 'seat-blank';
      if (onCell) {
        hole.type = 'button';
        hole.textContent = '빈칸';
        hole.setAttribute('aria-label', `${i + 1}번째 칸 (빈칸) 고치기`);
        hole.onclick = () => onCell(i);
      }
      grid.appendChild(hole);
      return;
    }
    const cell = document.createElement('button');
    cell.type = 'button';
    cell.className = 'seat-cell' + (person.place ? ' place' : '');
    const name = document.createElement('b');
    name.textContent = person.name;
    const tel = document.createElement('small');
    tel.textContent = [person.title, person.tel].filter(Boolean).join(' · ');
    cell.append(name, tel);
    if (mapped) {
      // 책상 여러 칸을 쓰는 자리(부장·교감 등)는 그만큼 늘린다
      if (person.span > 1) cell.style.gridColumnEnd = `span ${person.span}`;
      if (person.rspan > 1) cell.style.gridRowEnd = `span ${person.rspan}`;
    }
    if (onCell) {
      cell.setAttribute('aria-label', `${person.name} 자리 고치기`);
      cell.onclick = () => onCell(i);
    } else if (onPick) {
      cell.setAttribute('aria-label', `${seatLabel(person, room.room)} 주문자로 고르기`);
      cell.onclick = () => onPick(person);
    }
    grid.appendChild(cell);
  });
  card.appendChild(grid);
  return card;
}

// ---- 자리배치도 탭 ----
function renderSeatTab(body) {
  const list = seatMap();
  const stored = state.seats.length > 0;
  body.innerHTML = `
    <p class="tab-desc">
      주문 화면의 <b>‘🗺️ 자리배치도’</b>에 나오는 명단입니다. 방을 만들고 그 안에 자리를 놓으세요.
      자리는 <b>왼쪽 위부터 넣은 순서대로</b> 놓입니다 — 책상 사이가 비어 있으면 <b>빈칸</b>을 넣어 밀어 주세요.
      명단이 비면 주문 화면에서 자리배치도 칸이 저절로 숨고, 주문자는 ‘직접 적기’로만 넣습니다.
    </p>
    <div class="menu-tab-head">
      <button class="btn primary" id="btn-add-room">＋ 방 추가</button>
      <span id="seat-restore"></span>
    </div>
    <div class="seat-admin" id="seat-admin"></div>`;
  body.querySelector('#btn-add-room').onclick = () => openSeatRoomModal();

  // 기본 명단이 있는데 아직 고친 적이 없으면, 가져와서 고치도록 안내한다.
  const restore = body.querySelector('#seat-restore');
  if (!stored && DEFAULT_SEAT_MAP.length) {
    const hint = document.createElement('small');
    hint.className = 'seat-restore-hint';
    hint.textContent = '앱에 들어 있는 기본 명단을 보고 있어요. 고치려면 먼저 가져오세요.';
    const btn = document.createElement('button');
    btn.className = 'btn';
    btn.textContent = '기본 명단 가져오기';
    btn.onclick = importDefaultSeats;
    restore.append(btn, hint);
  } else if (stored && DEFAULT_SEAT_MAP.length) {
    const btn = document.createElement('button');
    btn.className = 'btn ghost';
    btn.textContent = '기본 명단으로 되돌리기';
    btn.onclick = resetSeatsToDefault;
    restore.appendChild(btn);
  }

  const listEl = body.querySelector('#seat-admin');
  if (list.length === 0) {
    const p = document.createElement('p');
    p.className = 'empty-hint';
    p.textContent = '아직 방이 없어요. ‘＋ 방 추가’로 교무실부터 만들어 보세요.';
    listEl.appendChild(p);
    return;
  }

  list.forEach((room, i) => {
    const wrap = document.createElement('section');
    wrap.className = 'seat-edit-room';

    const head = document.createElement('div');
    head.className = 'seat-edit-head';
    const title = document.createElement('div');
    title.className = 'seat-edit-title';
    const b = document.createElement('b');
    b.textContent = `${room.floor || '(층 없음)'} · ${room.room || '(이름 없음)'}`;
    const sub = document.createElement('small');
    const widthLabel = room.width === 'wide' ? '한 줄 전체'
      : room.width === 'narrow' ? '반의 반 줄' : '반 줄';
    sub.textContent = [room.note, `${room.cols || 1}칸씩`, widthLabel,
      `자리 ${seatPeople(room).length}`].filter(Boolean).join(' · ');
    title.append(b, sub);
    head.appendChild(title);

    const acts = document.createElement('div');
    acts.className = 'menu-actions';
    const mk = (text, title2, fn, disabled) => {
      const x = document.createElement('button');
      x.className = 'icon-btn';
      x.textContent = text;
      x.title = title2;
      x.disabled = !!disabled;
      x.onclick = fn;
      return x;
    };
    acts.append(
      mk('▲', '위로', () => moveSeatRoom(room.id, -1), !stored || i === 0),
      mk('▼', '아래로', () => moveSeatRoom(room.id, 1), !stored || i === list.length - 1),
    );
    const edit = document.createElement('button');
    edit.className = 'btn small';
    edit.textContent = '방 고치기';
    edit.onclick = () => openSeatRoomModal(room);
    const del = document.createElement('button');
    del.className = 'btn small danger';
    del.textContent = '삭제';
    del.onclick = () => removeSeatRoom(room);
    acts.append(edit, del);
    head.appendChild(acts);
    wrap.appendChild(head);

    const preview = document.createElement('div');
    preview.className = 'seat-rooms seat-preview';
    preview.appendChild(buildSeatRoomCard(room, room.cells || [], {
      mapped: !!room.cols,
      placeOnly: seatPeople(room).every((p) => p.place),
      onCell: (idx) => openSeatCellModal(room, idx),
    }));
    wrap.appendChild(preview);

    const add = document.createElement('div');
    add.className = 'seat-edit-add';
    const addPerson = document.createElement('button');
    addPerson.className = 'btn small';
    addPerson.textContent = '＋ 자리';
    addPerson.onclick = () => openSeatCellModal(room, -1);
    const addBlank = document.createElement('button');
    addBlank.className = 'btn small ghost';
    addBlank.textContent = '＋ 빈칸';
    addBlank.onclick = () => addSeatCell(room, { blank: true });
    add.append(addPerson, addBlank);
    wrap.appendChild(add);

    listEl.appendChild(wrap);
  });
}

// 기본 명단을 저장소로 옮긴다 — 이때부터 관리 화면에서 고칠 수 있다.
async function importDefaultSeats() {
  const ok = await confirmModal({
    title: '기본 명단을 가져올까요?',
    msg: '앱에 들어 있는 명단을 그대로 복사해 옵니다. 이때부터 관리 화면에서 고칠 수 있어요.',
    okText: '가져오기',
  });
  if (!ok) return;
  await Promise.all(DEFAULT_SEAT_MAP.map((room, i) =>
    state.backend.add('seats', { ...room, order: i + 1, createdAt: Date.now() })));
  await saveSettings({ seatsEdited: true });
  toast('기본 명단을 가져왔어요. 이제 고칠 수 있습니다.');
}

async function resetSeatsToDefault() {
  const ok = await confirmModal({
    title: '기본 명단으로 되돌릴까요?',
    msg: '지금 명단을 모두 지우고 앱에 들어 있는 기본 명단으로 바꿉니다. 되돌릴 수 없어요.',
    okText: '되돌리기', okClass: 'danger',
  });
  if (!ok) return;
  await Promise.all(state.seats.map((r) => state.backend.remove('seats', r.id)));
  await Promise.all(DEFAULT_SEAT_MAP.map((room, i) =>
    state.backend.add('seats', { ...room, order: i + 1, createdAt: Date.now() })));
  toast('기본 명단으로 되돌렸어요.');
}

// 고치려면 먼저 저장소에 있어야 한다 (기본 명단은 코드 안에 있어 고칠 수 없다).
async function ensureSeatsStored() {
  if (state.seats.length) return true;
  await importDefaultSeats();
  return state.seats.length > 0;
}

async function openSeatRoomModal(existing) {
  if (existing && !(await ensureSeatsStored())) return;
  const values = await formModal({
    title: existing ? '방 고치기' : '방 추가',
    desc: '층과 방 이름은 주문에 남는 이름에도 쓰입니다 (예: 고명희 (4층 본관 교무실)).',
    fields: [
      { id: 'floor', label: '층', value: existing?.floor, placeholder: '예: 4층' },
      { id: 'room', label: '방 이름', value: existing?.room, placeholder: '예: 4층 본관 교무실' },
      { id: 'note', label: '설명 (없어도 됩니다)', value: existing?.note, placeholder: '예: 1학년부' },
      { id: 'cols', label: '한 줄에 몇 칸', type: 'number', min: 1, step: 1,
        value: existing?.cols ?? 4, hint: '책상이 한 줄에 몇 개인지 적으세요.' },
      { id: 'width', label: '상자 폭', type: 'select', value: existing?.width || 'normal',
        options: [['normal', '반 줄 (보통)'], ['wide', '한 줄 전체'], ['narrow', '반의 반 줄']] },
    ],
    validate: (v) => {
      if (!v.floor) return '층을 적어 주세요.';
      if (!v.room) return '방 이름을 적어 주세요.';
      if (!(Number(v.cols) >= 1)) return '한 줄 칸 수는 1 이상이어야 해요.';
      return null;
    },
  });
  if (!values) return;
  const patch = {
    floor: values.floor, room: values.room, note: values.note || '',
    cols: Number(values.cols), width: values.width,
  };
  if (existing) {
    await state.backend.set('seats', existing.id, patch);
    toast('방을 저장했어요.');
  } else {
    if (state.seats.length === 0) await saveSettings({ seatsEdited: true });
    const maxOrder = state.seats.reduce((mx, r) => Math.max(mx, Number(r.order) || 0), 0);
    await state.backend.add('seats', { ...patch, cells: [], order: maxOrder + 1, createdAt: Date.now() });
    toast('방을 추가했어요. 이제 자리를 놓아 보세요.');
  }
}

async function removeSeatRoom(room) {
  if (!(await ensureSeatsStored())) return;
  const ok = await confirmModal({
    title: `‘${room.room}’을 지울까요?`,
    msg: '그 방의 자리도 함께 사라집니다. 지난 주문 기록은 그대로 남아요.',
    okText: '지우기', okClass: 'danger',
  });
  if (!ok) return;
  await state.backend.remove('seats', room.id);
  toast('방을 지웠어요.');
}

async function moveSeatRoom(id, dir) {
  const list = sortedSeatRooms(state.seats);
  const idx = list.findIndex((r) => r.id === id);
  const j = idx + dir;
  if (idx < 0 || j < 0 || j >= list.length) return;
  [list[idx], list[j]] = [list[j], list[idx]];
  await Promise.all(list.map((r, i) => state.backend.set('seats', r.id, { order: i + 1 })));
}

async function saveSeatCells(room, cells) {
  await state.backend.set('seats', room.id, { cells });
}

async function addSeatCell(room, cell) {
  if (!(await ensureSeatsStored())) return;
  const fresh = state.seats.find((r) => r.id === room.id) || room;
  await saveSeatCells(fresh, [...(fresh.cells || []), cell]);
}

// 칸 하나 고치기 — idx가 -1이면 새 자리를 뒤에 붙인다.
async function openSeatCellModal(room, idx) {
  if (!(await ensureSeatsStored())) return;
  const fresh = state.seats.find((r) => r.id === room.id);
  if (!fresh) return;
  const cells = [...(fresh.cells || [])];
  const adding = idx < 0;
  const cur = adding ? {} : cells[idx] || {};

  // 자리를 옮기고 지우는 길. 고치기 창 안에 함께 두어 창을 여러 번 열지 않게 한다.
  const moveField = {
    id: 'action', label: '자리 옮기기 · 지우기', type: 'select', value: 'keep',
    options: [['keep', '그대로 두기'], ['left', '◀ 한 칸 앞으로'], ['right', '한 칸 뒤로 ▶'],
      ['delete', '이 칸 지우기']],
    hint: '칸은 왼쪽 위부터 순서대로 놓입니다. 앞뒤로 옮겨 자리를 맞추세요.',
  };

  if (cur.blank) {
    // 빈칸은 고칠 내용이 없다 — 옮기거나 지우기만 한다.
    const v = await formModal({
      title: '빈칸',
      desc: '책상 사이를 벌려 주는 빈 자리입니다.',
      fields: [moveField],
      okText: '적용',
    });
    if (!v || v.action === 'keep') return;
    await applySeatCellAction(fresh, cells, idx, v.action);
    return;
  }

  const fields = [
    { id: 'name', label: '이름', value: cur.name, placeholder: '예: 고명희' },
    { id: 'title', label: '직책 (없어도 됩니다)', value: cur.title, placeholder: '예: 1학년부장' },
    { id: 'tel', label: '전화 (없어도 됩니다)', value: cur.tel, placeholder: '예: 100(863)' },
    { id: 'span', label: '가로로 몇 칸', type: 'number', min: 1, step: 1, value: cur.span || 1 },
    { id: 'rspan', label: '세로로 몇 칸', type: 'number', min: 1, step: 1, value: cur.rspan || 1 },
    { id: 'place', label: '사람이 아닌 공간인가요', type: 'select',
      value: cur.place ? 'yes' : 'no',
      options: [['no', '아니요 — 사람 자리'], ['yes', '네 — 미술실 같은 공간']],
      hint: '공간으로 두면 주문에 방 이름 없이 그 이름만 남습니다.' },
  ];
  if (!adding) fields.push(moveField);

  const values = await formModal({
    title: adding ? '자리 추가' : '자리 고치기',
    desc: '전화번호는 교무실 내선번호처럼 짧게 적어도 됩니다.',
    fields,
    validate: (v) => {
      if (v.action === 'delete') return null;      // 지울 거면 이름이 비어도 된다
      if (!v.name) return '이름을 적어 주세요.';
      const span = Number(v.span);
      if (!(span >= 1)) return '가로 칸 수는 1 이상이어야 해요.';
      if (fresh.cols && span > fresh.cols) return `가로 칸 수가 한 줄(${fresh.cols}칸)보다 클 수 없어요.`;
      if (!(Number(v.rspan) >= 1)) return '세로 칸 수는 1 이상이어야 해요.';
      return null;
    },
  });
  if (!values) return;

  if (values.action === 'delete') {
    await applySeatCellAction(fresh, cells, idx, 'delete');
    toast('자리를 지웠어요.');
    return;
  }

  const cell = { name: values.name };
  if (values.title) cell.title = values.title;
  if (values.tel) cell.tel = values.tel;
  if (values.place === 'yes') cell.place = true;
  if (Number(values.span) > 1) cell.span = Number(values.span);
  if (Number(values.rspan) > 1) cell.rspan = Number(values.rspan);

  if (adding) cells.push(cell);
  else cells[idx] = cell;

  if (values.action === 'left' || values.action === 'right') {
    await applySeatCellAction(fresh, cells, idx, values.action);
  } else {
    await saveSeatCells(fresh, cells);
  }
  toast(adding ? '자리를 놓았어요.' : '자리를 고쳤어요.');
}

async function applySeatCellAction(room, cells, idx, what) {
  if (what === 'delete') {
    cells.splice(idx, 1);
  } else {
    const j = idx + (what === 'left' ? -1 : 1);
    if (j < 0 || j >= cells.length) return;
    [cells[idx], cells[j]] = [cells[j], cells[idx]];
  }
  await saveSeatCells(room, cells);
}


// ---- 재고 반영 (Task 13) ----
// 재료 수량을 늘리고 줄이는 유일한 길. 기록(stockLogs)은 쓰기만 하고 구독하지 않는다 —
// 판매마다 쌓이므로 모든 기기가 통째로 받으면 금방 무료 한도를 넘는다.
// 기록 화면에서 필요한 기간만 불러온다.
async function applyStock(delta, type, extra = {}) {
  const known = new Set(state.ingredients.map((i) => i.id));
  // 지워진 재료에 더하면 이름 없는 유령 재료 문서가 생긴다
  const entries = Object.entries(delta).filter(([id, d]) => d && known.has(id));
  if (entries.length === 0) return;
  await Promise.all(entries.map(([id, d]) => state.backend.bump('ingredients', id, { current: d })));
  await state.backend.add('stockLogs', {
    type, delta: Object.fromEntries(entries), businessDate: businessDateOf(), createdAt: Date.now(), ...extra,
  });
}

function fmtQty(n, unit) {
  const v = Math.round((Number(n) || 0) * 100) / 100;
  return `${v.toLocaleString('ko-KR')}${unit || ''}`;
}

function sortedIngredients() {
  return [...state.ingredients].sort((a, b) => String(a.name).localeCompare(String(b.name), 'ko'));
}

const UNIT_OPTIONS = [['ml', 'ml (우유·시럽)'], ['g', 'g (원두·가루)'], ['개', '개 (컵·빨대)']];

function parseQty(v, { allowEmpty = false } = {}) {
  if (v === '' && allowEmpty) return null;
  const n = Number(v);
  return Number.isFinite(n) && n >= 0 ? n : NaN;
}

async function openIngredientModal(existing) {
  const values = await formModal({
    title: existing ? '재료 수정' : '재료 추가',
    fields: [
      { id: 'name', label: '이름', value: existing?.name, placeholder: '예: 우유' },
      { id: 'unit', label: '단위', type: 'select', options: UNIT_OPTIONS, value: existing?.unit || 'ml' },
      { id: 'current', label: '지금 있는 양', type: 'number', min: 0, step: 'any', value: existing?.current ?? '',
        hint: existing ? '실제로 세어 본 양으로 고치면 재고가 그 값으로 맞춰져요.' : '' },
      { id: 'reorderPoint', label: '장볼 기준 (이만큼 이하로 떨어지면 장볼 목록에)', type: 'number', min: 0, step: 'any',
        value: existing?.reorderPoint ?? '', hint: '비워 두면 장볼 목록에 넣지 않아요.' },
    ],
    validate: (v) => {
      if (!v.name) return '재료 이름을 입력해 주세요.';
      if (Number.isNaN(parseQty(v.current))) return '지금 있는 양을 0 이상의 숫자로 입력해 주세요.';
      if (Number.isNaN(parseQty(v.reorderPoint, { allowEmpty: true }))) return '장볼 기준은 숫자로 입력하거나 비워 주세요.';
      const dup = state.ingredients.find((i) => i.name === v.name && i.id !== existing?.id);
      if (dup) return '같은 이름의 재료가 이미 있어요.';
      return null;
    },
  });
  if (!values) return;
  const current = parseQty(values.current);
  const patch = { name: values.name, unit: values.unit, current, reorderPoint: parseQty(values.reorderPoint, { allowEmpty: true }) };
  if (existing) {
    await state.backend.set('ingredients', existing.id, patch);
    const diff = current - (Number(existing.current) || 0);
    if (diff) {
      await state.backend.add('stockLogs', {
        type: 'adjust', delta: { [existing.id]: diff }, businessDate: businessDateOf(), createdAt: Date.now(),
      });
    }
    toast('재료를 저장했어요.');
  } else {
    await state.backend.add('ingredients', { ...patch, createdAt: Date.now() });
    toast('재료를 추가했어요.');
  }
}

async function restockFlow(ing) {
  const values = await formModal({
    title: `${ing.name} 입고`,
    desc: `지금 ${fmtQty(ing.current, ing.unit)} 있어요. 새로 사 온 양만 적어 주세요.`,
    okText: '입고',
    fields: [{ id: 'qty', label: `들어온 양 (${ing.unit})`, type: 'number', min: 0, step: 'any' }],
    validate: (v) => (parseQty(v.qty) > 0 ? null : '0보다 큰 숫자로 입력해 주세요.'),
  });
  if (!values) return;
  const n = parseQty(values.qty);
  await applyStock({ [ing.id]: n }, 'restock');
  toast(`${ing.name} ${fmtQty(n, ing.unit)}을 입고했어요.`);
}

async function deleteIngredient(ing) {
  const users = state.menus.filter((m) => (m.recipe || []).some((r) => r.ingredientId === ing.id));
  const ok = await confirmModal({
    title: `${ing.name}을(를) 삭제할까요?`,
    msg: users.length
      ? `${users.map((m) => m.name).join(', ')} 레시피에서 쓰고 있어요.\n삭제하면 그 레시피에서도 빠집니다.`
      : '삭제하면 되돌릴 수 없어요.',
    okText: '삭제', okClass: 'danger', cancelText: '취소',
  });
  if (!ok) return;
  for (const m of users) {
    await state.backend.set('menus', m.id, { recipe: m.recipe.filter((r) => r.ingredientId !== ing.id) });
  }
  await state.backend.remove('ingredients', ing.id);
  toast('재료를 삭제했어요.');
}

// ---- 기록 탭 (PRD 3.5 · Task 16) ----
// 고른 기간의 주문과 재고 기록을 그때 불러온다. 다시 그릴 때마다 읽지 않도록 기간별로 담아 둔다.
let recordsKind = 'today';                 // 'today' | 'week' | 'month' | 'custom'
const recordsCustom = { from: '', to: '' };
let recordsCache = null;                   // { key, orders, logs, loadedAt } | { key, error }
let recordsLoading = false;

const STATUS_LABEL = { waiting: '제조 중', ready: '준비 완료', pickedUp: '수령 완료', cancelled: '취소' };

function recordsRange() {
  const today = businessDateOf();
  if (recordsKind === 'custom' && recordsCustom.from && recordsCustom.to) {
    const [from, to] = [recordsCustom.from, recordsCustom.to].sort();
    return { from, to };
  }
  return rangeOf(recordsKind === 'custom' ? 'today' : recordsKind, today);
}

async function loadRecords(force = false) {
  const { from, to } = recordsRange();
  const key = `${from}~${to}`;
  if (recordsLoading || (!force && recordsCache?.key === key)) return;
  recordsLoading = true;
  render();
  try {
    const [orders, logs, feedbacks] = await Promise.all([
      state.backend.queryRange('orders', 'businessDate', from, to),
      state.backend.queryRange('stockLogs', 'businessDate', from, to),
      state.backend.queryRange('feedbacks', 'businessDate', from, to).catch(() => []),
    ]);
    recordsCache = { key, orders, logs, feedbacks, loadedAt: Date.now() };
  } catch (err) {
    console.error(err);
    recordsCache = { key, error: true };
  } finally {
    recordsLoading = false;
    render();
  }
}

const hhmm = (ts) => new Date(ts).toTimeString().slice(0, 5);
const itemsText = (o) => (o.items || []).map((it) => `${it.name}×${it.qty}`).join(', ');

      cards2.appendChild(c);
    }
    fbSec.appendChild(cards2);

    // 음료 점수 분포 — 얼굴로 보여 준다
    const faces = ['😞 별로예요', '😐 괜찮아요', '🙂 맛있어요', '😄 최고예요'];
    const maxD = Math.max(...fb.drinkCounts.map((d) => d.count), 1);
    for (const d of [...fb.drinkCounts].reverse()) {
      const row = document.createElement('div');
      row.className = 'bar-row';
      const name = document.createElement('span');
      name.className = 'bar-name';
      name.textContent = faces[d.score - 1];
      const track = document.createElement('span');
      track.className = 'bar-track';
      track.setAttribute('aria-hidden', 'true');
      const barEl = document.createElement('span');
      barEl.className = 'bar';
      barEl.style.width = `${(d.count / maxD) * 100}%`;
      track.appendChild(barEl);
      const qty = document.createElement('b');
      qty.className = 'bar-qty';
      qty.textContent = `${d.count}건`;
      row.append(name, track, qty);
      fbSec.appendChild(row);
    }

    // 학생별 칭찬 — 점수가 아니라 칭찬 개수만
    if (fb.byBarista.length) {
      const h = document.createElement('h3');
      h.style.marginTop = '16px';
      h.textContent = '학생별 받은 칭찬';
      fbSec.appendChild(h);
      const table = document.createElement('table');
      table.className = 'rec-table';
      table.innerHTML = '<thead><tr><th>바리스타</th><th>받은 칭찬</th><th>평가 수</th></tr></thead>';
      const tb = document.createElement('tbody');
      for (const b of fb.byBarista) {
        const tr = document.createElement('tr');
        for (const v of [b.name || '(이름 없음)', `${b.praises}개`, `${b.count}건`]) {
          const td = document.createElement('td');
          td.textContent = v;
          tr.appendChild(td);
        }
        tb.appendChild(tr);
      }
      table.appendChild(tb);
      fbSec.appendChild(table);
    }

    if (fb.praises.length) {
      const h = document.createElement('h3');
      h.style.marginTop = '16px';
      h.textContent = '많이 받은 칭찬';
      fbSec.appendChild(h);
      const ul = document.createElement('ul');
      ul.className = 'rec-list';
      for (const x of fb.praises) {
        const li = document.createElement('li');
        li.textContent = `${x.text} — ${x.count}번`;
        ul.appendChild(li);
      }
      fbSec.appendChild(ul);
    }

    if (fb.comments.length) {
      const h = document.createElement('h3');
      h.style.marginTop = '16px';
      h.textContent = `손님이 남긴 말 (${fb.comments.length})`;
      fbSec.appendChild(h);
      const note = document.createElement('p');
      note.className = 'rec-meta';
      note.textContent = '선생님만 보입니다. 학생에게 읽어 줄 때는 골라서 전해 주세요.';
      fbSec.appendChild(note);
      const ul = document.createElement('ul');
      ul.className = 'rec-list';
      for (const c of fb.comments) {
        const li = document.createElement('li');
        li.textContent = `${c.orderNo}번${c.baristaName ? ` · ${c.baristaName}` : ''} — “${c.comment.trim()}”`;
        ul.appendChild(li);
      }
      fbSec.appendChild(ul);
    }
  }

  // ---- 재료 사용 ----
  if (state.ingredients.length) {
    const ingSec = section('재료 입고 · 사용');
    const table = document.createElement('table');
    table.className = 'rec-table';
    table.innerHTML = '<thead><tr><th>재료</th><th>입고</th><th>사용</th><th>조정</th><th>지금 남은 양</th></tr></thead>';
    const tb = document.createElement('tbody');
    for (const r of stockLedger(logs, state.ingredients)) {
