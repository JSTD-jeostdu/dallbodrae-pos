      for (const v of [r.name, fmtQty(r.restock, r.unit), fmtQty(r.used, r.unit), fmtQty(r.adjust, r.unit), fmtQty(r.current, r.unit)]) {
        const td = document.createElement('td');
        td.textContent = v;
        tr.appendChild(td);
      }
      tb.appendChild(tr);
    }
    table.appendChild(tb);
    ingSec.appendChild(table);
  }

  // ---- 취소 내역 ----
  const cancelled = orders.filter((o) => inRange(o, from, to) && o.status === 'cancelled')
    .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  if (cancelled.length) {
    const cSec = section(`취소 내역 (${cancelled.length}건)`);
    const ul = document.createElement('ul');
    ul.className = 'rec-list';
    for (const o of cancelled) {
      const li = document.createElement('li');
      li.textContent = `${o.businessDate.slice(5)} ${hhmm(o.createdAt)} · ${o.orderNo}번 · ${itemsText(o)}`;
      ul.appendChild(li);
    }
    cSec.appendChild(ul);
  }

  // ---- 내려받기 ----
  const dl = section('엑셀로 내려받기');
  const span = from === to ? from : `${from}_${to}`;
  const act = document.createElement('div');
  act.className = 'shopping-actions';

  b1.className = 'btn ghost small';

  b1.onclick = () => downloadCsv(`${CONFIG.cafeName}_요약_${span}.csv`, [
    ['기간', from, to],
    [],
    ['메뉴', '판매 잔 수', ...(showPrice ? ['금액'] : [])],
    ...sum.byMenu.map((m) => [m.name, m.qty, ...(showPrice ? [m.amount] : [])]),
    [],
    ['합계', sum.totalQty, ...(showPrice ? [sum.totalAmount] : [])],
    ['주문 건수', sum.orderCount],
    ['취소 건수', sum.cancelledCount],
    [],
    ['바리스타', '만든 잔 수', '주문 건수'],
    ...byBarista.map((b) => [b.name, b.qty, b.orderCount]),
    [],
    ['주문자', '주문 건수', '잔 수'],
    ...byCustomer.map((c) => [c.name, c.orderCount, c.qty]),
  ]);

  b3.disabled = fb.total === 0;
  b3.onclick = () => downloadCsv(`${CONFIG.cafeName}_손님평가_${span}.csv`, [
    ['영업일', '시각', '주문번호', '바리스타', '음료(1~4)', '주문대로', '기다린 시간', '칭찬', '남긴 말'],
    ...[...feedbacks].sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0)).map((f) => [
      f.businessDate, hhmm(f.createdAt), f.orderNo, f.baristaName || '', f.drink ?? '',
      typeof f.accurate === 'boolean' ? (f.accurate ? '맞음' : '다름') : '',
      SPEED_LABEL[f.speed] || '', (f.praises || []).join(' / '), (f.comment || '').trim(),
    ]),
  ]);

  const b2 = document.createElement('button');
  b2.className = 'btn ghost small';
  b2.textContent = '주문 내역 (CSV)';
  b2.onclick = () => downloadCsv(`${CONFIG.cafeName}_주문내역_${span}.csv`, [
    ['영업일', '주문 시각', '주문번호', '주문자', '바리스타', '상태', '메뉴', '잔 수', ...(showPrice ? ['금액'] : [])],
    ...orders.filter((o) => inRange(o, from, to))
      .sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0))
      .map((o) => [
        o.businessDate, hhmm(o.createdAt), o.orderNo, (o.customerName || '').trim(), o.baristaName || '',
        STATUS_LABEL[o.status] || o.status, itemsText(o),
        (o.items || []).reduce((n, it) => n + (Number(it.qty) || 0), 0),
        ...(showPrice ? [o.total || 0] : []),
      ]),
  ]);
  act.append(b1, b2, b3);
  dl.appendChild(act);
}

function downloadCsv(filename, rows) {
  // 엑셀에서 한글이 깨지지 않도록 BOM을 붙인다
  const blob = new Blob(['\uFEFF' + toCsv(rows)], { type: 'text/csv;charset=utf-8;' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

// 기록만 지운다. 메뉴 · 재료 · 설정은 남긴다 — 리허설 뒤에 메뉴를 다시 등록하게 만들면 안 된다.

// feedbacks(고객 평가)는 일부러 뺐다 — 리허설 기록을 지워도 평가는 남긴다 (선생님 결정).
const RECORD_COLLECTIONS = ['orders', 'stockLogs', 'counterResets', 'counters'];

async function clearRecordsFlow() {
  const ok = await confirmModal({
    title: '기록을 모두 지울까요?',
    msg: '주문 · 판매 · 재고 기록이 모두 지워지고 주문번호가 1번부터 다시 시작돼요.\n메뉴 · 재료 목록 · 설정은 남습니다. 지운 기록은 되살릴 수 없어요.',
    okText: '모두 지우기', okClass: 'danger', cancelText: '그만두기',
  });
  if (!ok) return;
  try {
    let total = 0;
    for (const name of RECORD_COLLECTIONS) total += await state.backend.deleteAll(name);
    recordsCache = null;   // 기록 탭이 지운 뒤 모습을 다시 불러오게
    toast(`기록 ${total}건을 지웠어요. 다음 주문은 1번입니다. 재료 수량을 확인해 주세요.`, { ms: 8000 });
  } catch (err) {
    console.error(err);
    toast('기록을 다 지우지 못했어요. 인터넷 연결을 확인하고 다시 해 주세요.', { ms: 8000 });
  }
  render();
}

// ---- 주문번호 초기화 (PRD 3.6.1) ----
// 판정은 Task 2의 resetPlan이 한다. 여기서는 묻고, 되돌리고, 이력을 남긴다.
async function resetOrderNoFlow() {
  const businessDate = businessDateOf();
  const startFrom = Number(document.getElementById('reset-start').value);
  const clearDisplay = document.getElementById('reset-clear-display').checked;
  const waiting = waitingOrders(state.orders.filter((o) => o.businessDate === businessDate));

  const counterValue = await state.backend.getCounter(businessDate);
  const plan = resetPlan(counterValue, startFrom, waiting.length);
  if (!plan.ok) { toast(plan.message, { ms: 5000 }); return; }

  // 대기 주문이 남아 있으면 같은 번호가 두 번 불릴 수 있다 — 한 번 더 확인받는다.
  const ok = await confirmModal({
    title: plan.needsConfirm ? '번호가 겹칠 수 있어요' : '주문번호를 되돌릴까요?',
    msg: plan.message,
    okText: '되돌리기',
    okClass: plan.needsConfirm ? 'danger' : 'primary',
  });
  if (!ok) return;

  await state.backend.resetOrderNo(businessDate, plan.newCounterValue);

  // 나중에 "왜 3번이 두 개지?"에 답할 근거를 남긴다.
  await state.backend.add('counterResets', {
    businessDate,
    beforeValue: counterValue,
    startFrom,
    waitingCount: waiting.length,
    clearedDisplay: clearDisplay,
    createdAt: Date.now(),
  });

  if (clearDisplay) {
    // 호출 화면에서만 감춘다. 주문을 지우면 판매 기록까지 사라진다.
    for (const o of state.orders.filter((x) => x.status === 'ready' && !x.hiddenFromDisplay)) {
      await state.backend.set('orders', o.id, { hiddenFromDisplay: true });
    }
  }

  toast(`주문번호를 ${startFrom}번부터 다시 시작합니다.`);
  render();   // 카운터는 구독 대상이 아니라서 '지금 번호'가 저절로 바뀌지 않는다
}

// ---- 주문 화면 (PRD 3.1) ----
// 글을 못 읽는 학생도 손님을 맞을 수 있게, 사진과 글자를 항상 함께 보여준다(AAC 원칙).
// 아래 상태는 render()가 데이터 변경마다 다시 불려도 사라지면 안 되므로 모듈 전역에 둔다.
let cart = [];              // [{ menuId, name, photo, emoji, price, qty }]
let orderNoShown = null;    // 방금 발번한 번호. 있으면 큰 번호 화면을 보여준다.
let orderNoTimer = null;    // 번호 화면 자동 복귀 타이머 (재렌더마다 새로 잡지 않는다)
let submitting = false;     // 발번 중 중복 탭 방지

// ---- 바리스타 고르기 ----
// 한 학생이 연속으로 여러 잔을 만드는 일이 많아, 한 번 고르면 바꿀 때까지 유지한다.
// 기기마다 기억하므로 주문 태블릿을 껐다 켜도 그대로다.
let selectedBaristaId = null;
let baristaFilterId = null;   // 제조 화면 '내 주문만 보기'
// 누가 시켰는지. 비워 두면 카운터 앞 손님(현장 손님)이다.
// 주문을 넣고 나면 비운다 — 다음 손님 주문에 앞사람 이름이 딸려 가면 안 된다.
let orderCustomer = { id: '', name: '' };
function setOrderCustomer(next) {
  orderCustomer = { id: next.id || '', name: (next.name || '').trim() };
  render();
}

function setSelectedBarista(id) {
  selectedBaristaId = id;
  try {
    if (id) localStorage.setItem(CONFIG.baristaKey, id);
    else localStorage.removeItem(CONFIG.baristaKey);
  } catch { /* 저장을 막아 둔 기기에서도 이번 세션은 그대로 쓴다 */ }
  render();
}

// 고른 학생이 지워졌거나 '쉬는 날'로 바뀌었으면 고르지 않은 것으로 본다.
function currentBarista() {
  return activeBaristas(state.baristas).find((b) => b.id === selectedBaristaId) || null;
}

// 사진(없으면 이모지) 동그라미 한 개. 여러 화면에서 같은 모양으로 쓴다.
function buildBaristaFace(barista, cls = 'bt-photo') {
  const box = document.createElement('div');
  box.className = cls;
  if (barista?.photo) {
    const img = document.createElement('img');
    img.src = barista.photo;
    img.alt = '';
    box.appendChild(img);
  } else {
    box.textContent = barista?.emoji || '🧑‍🍳';
  }
  return box;
}

// 누가 시켰는지 표. 카운터 앞 손님(이름 없음)에는 붙이지 않는다.
function buildCustomerChip(order) {
  const name = (order.customerName || '').trim();
  if (!name) return null;
  const chip = document.createElement('span');
  chip.className = 'cust-chip';
  const em = document.createElement('span');
  em.textContent = '🙋';
  em.setAttribute('aria-hidden', 'true');
  const text = document.createElement('span');
  text.textContent = name;
  chip.append(em, text);
  chip.title = `주문자: ${name}`;
  return chip;
}

// 제조·매니저 카드에 "누가 만들어요"를 붙인다. 고르지 않은 주문에는 아무것도 붙이지 않는다.
function buildWhoChip(order) {
  if (!order.baristaId && !order.baristaName) return null;
  const found = state.baristas.find((b) => b.id === order.baristaId);
  const chip = document.createElement('span');
  chip.className = 'who-chip';
  const name = document.createElement('span');
  name.textContent = order.baristaName || found?.name || '';
  chip.append(buildBaristaFace(found, 'bt-photo'), name);
  chip.title = `${name.textContent} 바리스타`;
  return chip;
}

// 메뉴 타일 — 사진(또는 이모지) + 이름이 한 버튼 안에 함께 있다.
// 품절이면 disabled로 두어 "누를 수 없는 버튼"을 실제로 누를 수 없게 만든다.
function buildMenuTile(menu) {
  const tile = document.createElement('button');
  tile.type = 'button';
  tile.className = 'tile' + (menu.soldOut ? ' soldout' : '');
  tile.dataset.menuId = menu.id;
  tile.disabled = !!menu.soldOut;

  const photoBox = document.createElement('div');
  photoBox.className = 'tile-photo';
  if (menu.photo) {
    const img = document.createElement('img');
    img.src = menu.photo;
    img.alt = '';
    photoBox.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'emoji';
    span.textContent = menu.emoji || '☕';
    photoBox.appendChild(span);
  }
  tile.appendChild(photoBox);

  const nameEl = document.createElement('div');
  nameEl.className = 'tile-name';
  nameEl.textContent = menu.name || '';
  tile.appendChild(nameEl);

  // 재료 부족: 경고만 한다. 판매를 막는 것은 품절 토글뿐이다.
  if (!menu.soldOut) {
    const ingMap = Object.fromEntries(state.ingredients.map((i) => [i.id, i]));
    if (menuLowStock(menu, ingMap)) {
      const low = document.createElement('span');
      low.className = 'tile-low';
      low.textContent = '재료 부족';
      tile.appendChild(low);
    }
  }

  // 품절: 색으로만 구분하지 않는다 — 흐림(.soldout) + 화면을 덮는 큰 ✕
  if (menu.soldOut) {
    const x = document.createElement('div');
    x.className = 'tile-soldout';
    x.setAttribute('aria-hidden', 'true');
    x.textContent = '✕';
    tile.appendChild(x);
  } else {
    tile.onclick = () => {
      cart = cartAdd(cart, menu);
      navigator.vibrate?.(30);   // 탭에 대한 즉각적인 다감각 피드백
      render();
    };
  }
  return tile;
}

// 담은 내용 카드 — 글을 못 읽어도 사진만 보고 무엇을 담았는지 알 수 있게 한다.
function buildCartCard(item) {
  const card = document.createElement('div');
  card.className = 'cart-card';

  const thumb = document.createElement('div');
  thumb.className = 'cart-thumb';
  if (item.photo) {
    const img = document.createElement('img');
    img.src = item.photo;
    img.alt = '';
    thumb.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'emoji';
    span.textContent = item.emoji || '☕';
    thumb.appendChild(span);
  }
  card.appendChild(thumb);

  const info = document.createElement('div');
  info.className = 'cart-info';
  const nameEl = document.createElement('div');
  nameEl.className = 'cart-name';
  nameEl.textContent = item.name || '';
  info.appendChild(nameEl);

  const qtyRow = document.createElement('div');
  qtyRow.className = 'qty-row';

  const minusBtn = document.createElement('button');
  minusBtn.type = 'button';
  minusBtn.className = 'qty-btn';
  minusBtn.textContent = '－';
  minusBtn.setAttribute('aria-label', `${item.name} 수량 줄이기`);
  minusBtn.onclick = () => {
    cart = cartSetQty(cart, item.menuId, item.qty - 1);
    navigator.vibrate?.(30);
    render();
  };

  const qtyNum = document.createElement('span');
  qtyNum.className = 'qty-num';
  qtyNum.textContent = String(item.qty);

  const plusBtn = document.createElement('button');
  plusBtn.type = 'button';
  plusBtn.className = 'qty-btn';
  plusBtn.textContent = '＋';
  plusBtn.setAttribute('aria-label', `${item.name} 수량 늘리기`);
  plusBtn.onclick = () => {
    cart = cartSetQty(cart, item.menuId, item.qty + 1);
    navigator.vibrate?.(30);
    render();
  };

  qtyRow.append(minusBtn, qtyNum, plusBtn);
  info.appendChild(qtyRow);
  card.appendChild(info);

  const delBtn = document.createElement('button');
  delBtn.type = 'button';
  delBtn.className = 'cart-del';
  delBtn.textContent = '✕';
  delBtn.setAttribute('aria-label', `${item.name} 빼기`);
  delBtn.onclick = () => {
    cart = cartSetQty(cart, item.menuId, 0);
    navigator.vibrate?.(30);
    render();
  };
  card.appendChild(delBtn);

  return card;
}

// ---- 스크롤 패널이 항목을 중간에서 자르지 않게 하기 ----
// AAC 원칙(사진 + 글자가 항상 함께)이 걸린 곳: 타일 줄이 반만 보이면 이름 글자도
// 반만 보인다. 그래서 "화면 비율의 몇 %"처럼 어림잡지 않고, 실제로 렌더된 각 항목의
// 위치를 재서 항상 "줄 전체" 단위로만 보이게 자른다. 이름이 길어 두 줄로 접히는
// 항목이 섞여 있어도, 평균이 아니라 각 항목의 실제 위치를 보고 판단하므로 안전하다.

// 항목들을 실제 렌더된 위치 기준으로 "줄"별로 묶는다(순수 측정, 스타일은 안 건드림).
function measureRows(pane, items) {
  const paneTop = pane.getBoundingClientRect().top - pane.scrollTop;
  const rows = [];
  for (const item of items) {
    const rect = item.getBoundingClientRect();
    const top = rect.top - paneTop;
    const bottom = top + rect.height;
    const row = rows.find((r) => Math.abs(r.top - top) < 1);
    if (row) row.bottom = Math.max(row.bottom, bottom);
    else rows.push({ top, bottom });
  }
  rows.sort((a, b) => a.top - b.top);
  return rows;
}

// pane이 지금 가진 공간(clientHeight) 안에서 "줄 전체"만 보이도록 max-height를
// 맞춘다. 반환값은 잘린 줄이 있는지 여부 — 스크롤 화살표를 켤지 그대로 쓴다.
function clampToRows(pane, rows) {
  const cs = getComputedStyle(pane);
  const padTop = parseFloat(cs.paddingTop) || 0;
  const padBottom = parseFloat(cs.paddingBottom) || 0;
  const available = pane.clientHeight - padTop - padBottom;
  let fit = rows[0].bottom;   // 한 줄도 안 들어가는 극단적인 경우에도 첫 줄은 보여준다
  for (const row of rows) {
    if (row.bottom > available) break;
    fit = row.bottom;
  }
  pane.style.maxHeight = (fit + padTop + padBottom) + 'px';
  return fit < rows[rows.length - 1].bottom;
}

// 메뉴 타일 패널과 장바구니 패널의 높이를 함께 정한다. 왜 따로따로가 아니라 "함께"인가:
// 좁은 화면에서는 장바구니가 늘어난 만큼 메뉴가 줄어드는 구조라, 장바구니가 커지면
// 메뉴 타일 줄이 중간에서 잘릴 수 있다(이번 라운드에서 고치는 문제).
// 그렇다고 메뉴에 무조건 최소 높이를 주기만 하면, 이번엔 메뉴+장바구니 합이
// order-screen(= main) 높이를 넘어 footer를 다시 침범한다(Fix round 1에서 고친 문제).
// 그래서 순서를 정해 둘을 한 번에 계산한다:
//   1) 메뉴 "한 줄" 최소 높이를 먼저 잰다 — 메뉴는 이 아래로 줄어들 수 없다.
//   2) 장바구니의 최대 높이를 "전체 − 그 한 줄 − 간격"으로 역산한다
//      (기존 CSS 상한 50%와 비교해 더 작은 쪽을 쓴다).
//   3) 장바구니를 그 한도 안에서 카드 목록 줄 단위로 자리 잡게 한다.
//   4) 장바구니가 실제로 정착한 높이만 빼고 나머지를 전부 메뉴에게 주고,
//      그 안에서 다시 줄 단위로 자른다 — 장바구니가 작으면 메뉴는 한 줄보다
//      더 많이 보일 수 있다.
// 화면을 좌우로 나누는 넓은 화면에서는 두 패널이 각자 height: 100%로 독립적이라
// 이런 다툼이 없으므로 각자 잰다.
// menuPane/cartList는 [스크롤 영역 + 화살표]를 세로로 쌓는 틀이고,
// menuScroll/cartScroll이 실제로 스크롤되는(overflow-y: auto) 안쪽 상자다.
// 타일/카드 줄 단위 계산은 항상 안쪽 상자를 기준으로 한다.
function layoutOrderPanels(menuPane, menuScroll, menuItems, cartPane, cartList, cartScroll, cartItems) {
  const screen = menuPane.parentElement;   // .order-screen
  const stacked = getComputedStyle(screen).flexDirection === 'column';

  // 이전에 재 둔 값이 남아 있으면 지금 실제로 쓸 수 있는 공간을 잘못 잰다
  // (예: 글자 크기가 커져 옆 패널이 자라난 뒤라면, 예전 값 그대로는 "얼마나
  // 남았는지"를 알 수 없다) — 늘 지우고 나서 새로 잰다.
  menuPane.style.maxHeight = '';
  menuPane.style.minHeight = '';
  menuScroll.style.maxHeight = '';
  cartPane.style.maxHeight = '';
  cartScroll.style.maxHeight = '';

  if (!stacked || menuItems.length === 0) {
    const cartTruncated = cartItems.length ? clampToRows(cartScroll, measureRows(cartScroll, cartItems)) : false;
    const menuTruncated = menuItems.length ? clampToRows(menuScroll, measureRows(menuScroll, menuItems)) : false;
    return { cartTruncated, menuTruncated };
  }

  // 화살표는 항상 자기 자리(고정 높이)를 차지하므로, 보이든 안 보이든 그 높이를
  // "메뉴 틀 전체가 최소한 필요로 하는 높이"에 더해야 한다.
  const menuCue = menuPane.querySelector('.scroll-cue');
  const cueBox = menuCue.getBoundingClientRect();
  const cueMarginTop = parseFloat(getComputedStyle(menuCue).marginTop) || 0;
  const cueReserve = cueBox.height + cueMarginTop;

  const menuRows = measureRows(menuScroll, menuItems);
  const oneRow = menuRows[0].bottom;
  const menuFloor = oneRow + cueReserve;   // .order-menu 틀 전체 기준 최소 높이(한 줄 + 화살표 자리)

  // min-height를 명시적으로 걸어 둔다. .order-menu에는 overflow: hidden이 있는데,
  // 이는 (스크롤/클립 컨테이너에게 자동 최소 높이를 0으로 주는 flexbox 규칙 때문에)
  // 화면이 아주 좁고 낮을 때 order-screen이 menuFloor보다 작으면 flex가 이 패널을
  // 한 줄 밑으로 짜부라뜨릴 수 있다는 뜻이다. 명시적 min-height는 그 자동 규칙을
  // 덮어써서 무조건 한 줄은 지키게 하고, 대신 장바구니(overflow-y: auto라 자동
  // 최소 높이가 0)가 먼저 줄어들게 한다 — 그래도 공간이 부족하면 main의
  // overflow-y: auto(Fix round 1)가 마지막 안전망으로 전체를 스크롤시킨다.
  menuPane.style.minHeight = menuFloor + 'px';

  const gap = parseFloat(getComputedStyle(screen).rowGap) || 0;
  const screenHeight = screen.clientHeight;

  // CSS의 max-height: 50%는 JS가 실패할 때만 쓰이는 정적 안전망이다 — 여기서
  // getComputedStyle로 다시 읽지 않는다(퍼센트가 항상 px로 풀리는 게 아니라,
  // 컨테이닝 블록에 따라 "50%" 문자열 그대로 돌아올 수 있어 parseFloat가
  // 50%를 50px로 잘못 읽는 함정이 있다). 아래 계산이 이미 "메뉴 한 줄은 반드시
  // 남긴다"는 조건으로 상한을 정하므로 그 자체로 안전하다.
  //
  // 다만 상한을 0까지 내려버리면(화면이 아주 좁고 낮아 메뉴 한 줄만으로도 이미
  // 공간이 모자란 극단적인 경우) 장바구니 머리글·주문하기 버튼처럼 스스로 줄어들
  // 수 없는 요소들이 이상하게 찌그러진 채 렌더링될 수 있다. 그래서 장바구니가
  // "카드 목록 없이 머리글 + 버튼만 있을 때"의 자연스러운 최소 높이 아래로는
  // 내려가지 않게 한다 — 카드 목록(.cart-scroll)은 0까지 접혀도 되지만(overflow:
  // hidden으로 조용히 가려짐), 버튼은 항상 제 모양을 유지해야 한다. 그래도 전체가
  // 화면에 못 들어가면 main의 overflow-y: auto가 나머지를 스크롤로 받아 준다.
  // 머리글 높이 + 버튼 높이 + 각각의 margin + padding을 일일이 더하면 CSS가
  // 바뀔 때마다 어긋나기 쉽다(실제로 margin을 하나 빠뜨려 8px 차이가 났었다).
  // 대신 카드 목록을 잠깐 display: none으로 빼고 실제 렌더된 높이를 그대로
  // 재는 쪽이 항상 정확하다 — 재고 나서 바로 되돌린다.
  const cartListDisplay = cartList.style.display;
  cartList.style.display = 'none';
  const cartFloor = cartPane.getBoundingClientRect().height;
  cartList.style.display = cartListDisplay;

  const cartCap = Math.max(cartFloor, screenHeight - gap - menuFloor);
  cartPane.style.maxHeight = cartCap + 'px';

  const cartTruncated = cartItems.length ? clampToRows(cartScroll, measureRows(cartScroll, cartItems)) : false;

  const cartActual = cartPane.getBoundingClientRect().height;
  const menuWrapperAvailable = Math.max(menuFloor, screenHeight - gap - cartActual);
  menuPane.style.maxHeight = menuWrapperAvailable + 'px';
  menuScroll.style.maxHeight = (menuWrapperAvailable - cueReserve) + 'px';
  const menuTruncated = clampToRows(menuScroll, menuRows);

  return { cartTruncated, menuTruncated };
}

// 스크롤로 가려진 내용이 더 있을 때만 화살표 표시를 보여주고, 끝까지 스크롤하면 감춘다.
// 색으로만 "더 있음"을 표시하지 않도록(접근성 원칙 2) 화살표 모양을 쓴다.
// truncated(clampPaneToWholeRows의 반환값)가 false면 애초에 잘린 줄이 없다는
// 뜻이라 스크롤 위치와 무관하게 화살표를 절대 보여주지 않는다.
// render()가 패널을 통째로 새로 만들 때뿐 아니라, reclampOrderScreen()이 같은
// DOM을 재사용해 다시 부를 때도 있다 — 이전에 달아 둔 리스너를 먼저 떼어 내
// 스크롤 리스너가 쌓이지 않게 한다.
function attachScrollCue(pane, cue, truncated) {
  if (pane._scrollCueHandler) {
    pane.removeEventListener('scroll', pane._scrollCueHandler);
    pane._scrollCueHandler = null;
  }
  if (!truncated) { cue.classList.remove('show'); return; }
  function update() {
    const hasMore = pane.scrollHeight - pane.scrollTop - pane.clientHeight > 1;
    cue.classList.toggle('show', hasMore);
  }
  pane._scrollCueHandler = update;
  pane.addEventListener('scroll', update);
  update();
}

// 주문 화면 본체 — 왼쪽 메뉴 타일 / 오른쪽 담은 내용.
function renderOrderCartScreen(el) {

  // 왼쪽에 [주문자 + 바리스타·메뉴], 오른쪽에 담은 주문을 위아래로 꽉 채워 둔다.
  const page = document.createElement('div');
  page.className = 'order-page';
  const main = document.createElement('div');
  main.className = 'order-main';
  main.appendChild(buildCustomerBar());

  // ---- 왼쪽: 메뉴 타일 ----
  // .order-menu(틀) 안에 [.menu-scroll(스크롤 영역) + 화살표]를 쌓는다.
  // 화살표가 스크롤 영역 "밖"에 있어야 타일 줄과 절대 겹치지 않는다.
  const menuPane = document.createElement('div');
  menuPane.className = 'order-menu';
  // 바리스타 줄은 메뉴와 함께 스크롤된다 — 화면 높이를 고정으로 먹지 않게.
  menuPane.appendChild(buildBaristaPicker());
  const menuScroll = document.createElement('div');
  menuScroll.className = 'menu-scroll';
  const grid = document.createElement('div');
  grid.className = 'menu-grid';
  const menus = sortedMenus(state.menus).filter((m) => m.visible !== false);
  if (menus.length === 0) {
    const hint = document.createElement('p');
    hint.className = 'empty-hint';
    hint.textContent = '등록된 메뉴가 없어요. 선생님께 메뉴 등록을 부탁해 주세요.';
    grid.appendChild(hint);
  } else {
    for (const m of menus) grid.appendChild(buildMenuTile(m));
  }
  menuScroll.appendChild(grid);
  menuPane.appendChild(menuScroll);
  const menuCue = document.createElement('div');
  menuCue.className = 'scroll-cue';
  menuCue.setAttribute('aria-hidden', 'true');
  menuCue.textContent = '⌄';
  menuPane.appendChild(menuCue);

  // ---- 오른쪽: 담은 내용 ----
  const cartPane = document.createElement('div');
  cartPane.className = 'order-cart';

  const head = document.createElement('div');
  head.className = 'cart-head';
  const h2 = document.createElement('h2');
  h2.textContent = '담은 주문';
  head.appendChild(h2);
  if (cart.length > 0) {
    const clearBtn = document.createElement('button');
    clearBtn.type = 'button';
    clearBtn.className = 'btn ghost small';
    clearBtn.textContent = '전체 비우기';
    clearBtn.onclick = async () => {
      const ok = await confirmModal({
        title: '모두 뺄까요?',
        msg: '담은 내용을 모두 비웁니다.',
        okText: '비우기', okClass: 'danger', cancelText: '취소',
      });
      if (ok) { cart = []; render(); }
    };
    head.appendChild(clearBtn);
  }
  cartPane.appendChild(head);

  // .cart-list(틀) 안에 [.cart-scroll(스크롤 영역) + 화살표]를 쌓는다 — 메뉴와 같은 구조.
  const list = document.createElement('div');
  list.className = 'cart-list';
  const cartScroll = document.createElement('div');
  cartScroll.className = 'cart-scroll';
  if (cart.length === 0) {
    const hint = document.createElement('p');
    hint.className = 'empty-hint';
    hint.textContent = '메뉴를 눌러 담아 주세요.';
    cartScroll.appendChild(hint);
  } else {
    for (const item of cart) cartScroll.appendChild(buildCartCard(item));
  }
  list.appendChild(cartScroll);
  const cartCue = document.createElement('div');
  cartCue.className = 'scroll-cue';
  cartCue.setAttribute('aria-hidden', 'true');
  cartCue.textContent = '⌄';
  list.appendChild(cartCue);
  cartPane.appendChild(list);

  // 금액 표시(off): 이번 버전에서는 가격·합계를 DOM에 아예 만들지 않는다.
  if (state.settings.priceMode !== 'off' && cart.length > 0) {
    const totalEl = document.createElement('div');
    totalEl.className = 'cart-total';
    totalEl.textContent = `합계 ${cartTotal(cart).toLocaleString('ko-KR')}원`;
    cartPane.appendChild(totalEl);
  }

  // 누가 시켰는지 (선택). 원격 주문일 때만 고르면 된다.
  const custBtn = document.createElement('button');
  custBtn.type = 'button';
  custBtn.className = 'cust-pick' + (orderCustomer.name ? ' on' : '');
  const custLabel = document.createElement('span');
  custLabel.className = 'label';
  custLabel.textContent = '🙋 주문자';
  const custWho = document.createElement('span');
  custWho.className = 'who';
  custWho.textContent = orderCustomer.name || '현장 손님 (누르면 고를 수 있어요)';
  const custArrow = document.createElement('span');
  custArrow.className = 'label';
  custArrow.textContent = '▸';
  custBtn.append(custLabel, custWho, custArrow);
  custBtn.setAttribute('aria-label', `주문자 고르기. 지금은 ${orderCustomer.name || '현장 손님'}`);
  custBtn.onclick = openCustomerPicker;
  cartPane.appendChild(custBtn);

  // 누가 만드는지 한 번 더 보여 주고, 고르지 않았으면 주문을 막는다.
  const picked = currentBarista();
  if (picked) {
    const who = document.createElement('div');
    who.className = 'cart-barista';
    const txt = document.createElement('span');
    txt.innerHTML = '만드는 사람: ';
    const b = document.createElement('b');
    b.textContent = picked.name;
    txt.appendChild(b);
    who.append(buildBaristaFace(picked), txt);
    cartPane.appendChild(who);
  } else if (activeBaristas(state.baristas).length > 0) {
    const need = document.createElement('p');
    need.className = 'need-barista';
    need.textContent = '맨 위에서 만드는 사람을 먼저 골라 주세요';
    cartPane.appendChild(need);
  }

  const submitBtn = document.createElement('button');
  submitBtn.type = 'button';
  submitBtn.className = 'btn primary big';
  submitBtn.textContent = '주문하기';
  // 바리스타가 아직 한 명도 등록되지 않았다면 예전처럼 그냥 주문할 수 있게 둔다.
  const needsBarista = activeBaristas(state.baristas).length > 0 && !picked;
  submitBtn.disabled = cart.length === 0 || submitting || needsBarista;
  submitBtn.onclick = () => submitOrder();
  cartPane.appendChild(submitBtn);

  main.appendChild(menuPane);
  page.append(main, cartPane);
  el.appendChild(page);

  // DOM에 실제로 붙은 뒤에만 렌더된 크기를 잴 수 있다 — 타일/카드 줄이 잘리지 않게
  // 여기서 두 패널의 높이를 함께 맞추고(layoutOrderPanels), 더 있을 때만 스크롤
  // 화살표를 켠다.
  // 예전에는 두 패널의 높이를 재서 줄 단위로 잘라 냈다(layoutOrderPanels).
  // 지금은 메뉴를 모두 펼쳐 두고 페이지가 스크롤되므로 잘라 낼 것이 없다.
}

// 주문 화면 맨 위 — 누가 주문하는지 고르는 줄.
// 메신저로 받은 원격 주문을 남기려면 여기서 먼저 고른다.
function buildCustomerBar() {
  const sec = document.createElement('section');
  sec.className = 'cust-bar' + (orderCustomer.name ? '' : ' empty');

  const head = document.createElement('div');
  head.className = 'barista-head';
  const h2 = document.createElement('h2');
  h2.textContent = '🙋 누가 주문하나요?';
  const hint = document.createElement('span');
  hint.className = 'pick-hint';
  hint.textContent = orderCustomer.name
    ? '바꾸려면 다른 칸을 누르세요'
    : (CONFIG.showWalkInTile
      ? '카운터 앞 손님이면 그대로 두세요 · 메신저 주문이면 골라 주세요'
      : '주문하신 분을 골라 주세요');
  head.append(h2, hint);
  sec.appendChild(head);

  const strip = document.createElement('div');
  strip.className = 'cust-strip';
  strip.setAttribute('role', 'group');
  strip.setAttribute('aria-label', '주문자 고르기');

  const addTile = (emoji, name, on, onclick, extraClass = '') => {
    const t = document.createElement('button');
    t.type = 'button';
    t.className = `ct${on ? ' on' : ''}${extraClass ? ' ' + extraClass : ''}`;
    t.setAttribute('aria-pressed', String(on));
    const em = document.createElement('span');
    em.className = 'em';
    em.textContent = emoji;
    em.setAttribute('aria-hidden', 'true');
    const nm = document.createElement('span');
    nm.className = 'nm';
    nm.textContent = name;
    t.append(em, nm);
    t.onclick = () => { onclick(); navigator.vibrate?.(20); };
    strip.appendChild(t);
    return t;
  };

  // 카운터 앞 손님이 기본이다. 숨겨 둔 동안에도 '직접 적기' 창의 [현장 손님으로]로 되돌릴 수 있다.
  if (CONFIG.showWalkInTile) {
    addTile('🏪', '현장 손님', !orderCustomer.name, () => setOrderCustomer({ id: '', name: '' }));
  }

  for (const c of sortedCustomers(state.customers)) {
    const on = orderCustomer.id === c.id;
    addTile(c.emoji || '🙋', c.name, on, () => setOrderCustomer(on ? { id: '', name: '' } : { id: c.id, name: c.name }));
  }

  // 자리배치도에서 고르기 — 선생님 이름을 외우지 않아도 자리로 찾을 수 있다.
  // 명단이 비어 있으면 눌러도 빈 창만 뜨므로 아예 숨긴다 (관리 → 자리배치도에서 채운다).
  if (seatMap().length) addTile('🗺️', '자리배치도', false, openSeatPicker, 'seats');

  // 명단에 없는 손님 — 직접 적는다. 적어 둔 이름이 있으면 그 이름을 보여 준다.
  const typed = !orderCustomer.id && orderCustomer.name;
  addTile('✏️', typed ? orderCustomer.name : '직접 적기', !!typed, openCustomerPicker, 'write');

  sec.appendChild(strip);
  return sec;
}

// 자리배치도에서 고르기 — 사진을 띄우고, 그 아래 이름 버튼으로 고른다.
// 사진 위를 직접 누르게 하지 않는 이유: 글자가 작아 손가락으로 정확히 짚기 어렵고,
// 자리가 바뀔 때마다 좌표를 다시 잡아야 한다. 사진은 '어디쯤인지' 보는 용도다.
function openSeatPicker() {
  const back = document.createElement('div');
  back.className = 'modal-back';
  const modal = document.createElement('div');
  modal.className = 'modal seat-modal';

  const h = document.createElement('h3');
  h.textContent = '자리배치도에서 고르기';
  modal.appendChild(h);
  const lead = document.createElement('p');
  lead.className = 'tab-desc';
  lead.textContent = '층을 눌러 펼친 뒤, 주문하신 선생님을 눌러 주세요. 이름으로 바로 찾아도 됩니다.';
  modal.appendChild(lead);

  const search = document.createElement('label');
  search.className = 'field seat-search';
  const sLabel = document.createElement('span');
  sLabel.textContent = '이름으로 찾기';
  const input = document.createElement('input');
  input.type = 'search';
  input.placeholder = '예: 고명희 · 교무실 · 보건';
  search.append(sLabel, input);
  modal.appendChild(search);

  const body = document.createElement('div');
  body.className = 'seat-body';

  const rooms = document.createElement('div');
  body.appendChild(rooms);
  modal.appendChild(body);

  // 칸이 작아 옆자리를 누를 수 있다 — 고르기 전에 한 번 확인받는다.
  // 배치도 창 위에 겹쳐 띄운다. 아래에 깔리면 눌러도 아무 일 없는 것처럼 보인다.
  let ask = null;
  function closeAsk() {
    if (ask) { ask.remove(); ask = null; }
  }
  function askSeat(person, room) {
    closeAsk();
    ask = document.createElement('div');
    ask.className = 'seat-confirm-back';
    const bubble = document.createElement('div');
    bubble.className = 'seat-confirm';
    const text = document.createElement('p');
    text.textContent = seatLabel(person, room.room);
    const sub2 = document.createElement('small');
    sub2.textContent = [person.title, person.tel].filter(Boolean).join(' · ');
    text.appendChild(sub2);
    const row = document.createElement('div');
    row.className = 'row';
    const no = document.createElement('button');
    no.type = 'button';
    no.className = 'btn ghost';
    no.textContent = '아니요';
    no.onclick = closeAsk;
    const yes = document.createElement('button');
    yes.type = 'button';
    yes.className = 'btn ok';
    yes.textContent = '이분이에요';
    yes.onclick = () => {
      closeAsk();
      back.remove();
      setOrderCustomer({ id: '', name: seatLabel(person, room.room) });
    };
    row.append(no, yes);
    bubble.append(text, row);
    // 어두운 바탕을 눌러도 닫는다. 창 안을 누른 것은 닫지 않는다.
    ask.onclick = (e) => { if (e.target === ask) closeAsk(); };
    ask.appendChild(bubble);
    document.body.appendChild(ask);
    yes.focus();
  }

  function draw(query = '') {
    const q = query.trim().toLowerCase();
    rooms.innerHTML = '';
    let shown = 0;

    // 층 → 교무실 순서로 늘어놓는다
    const floors = [];
    for (const room of seatMap()) {
      const hit = (c) => !q
        || (c.name || '').toLowerCase().includes(q)
        || (c.title || '').toLowerCase().includes(q)
        || room.room.toLowerCase().includes(q)
        || (room.note || '').toLowerCase().includes(q)
        || (room.floor || '').toLowerCase().includes(q);
      // 검색 중에는 찾은 사람만 추리고 빈칸을 버린다. 격자를 그대로 두면
      // 걸러진 자리마다 구멍이 뚫려 보기 나쁘다.
      const cells = q ? seatPeople(room).filter(hit) : (room.cells || []);
      const people = cells.filter((c) => !c.blank && c.name);
      if (people.length === 0) continue;
      shown += people.length;
      let floor = floors.find((f) => f.name === room.floor);
      if (!floor) { floor = { name: room.floor, rooms: [] }; floors.push(floor); }
      floor.rooms.push({ room, cells, people });
    }

    for (const floor of floors) {
      const sec = document.createElement('details');
      sec.className = 'seat-floor';
      // 검색 중에는 결과가 있는 층을 열어 둔다. 평소에는 모두 접어 두어 한눈에 들어오게.
      sec.open = !!q || (floors.length === 1);
      const head = document.createElement('summary');
      head.appendChild(document.createTextNode(floor.name));
      const count = document.createElement('span');
      count.className = 'count';
      const n = floor.rooms.reduce((sum, r) => sum + r.people.length, 0);
      count.textContent = `${n}자리`;
      head.appendChild(count);
      sec.appendChild(head);

      const grid = document.createElement('div');
      grid.className = 'seat-rooms';
      for (const { room, cells, people } of floor.rooms) {
        grid.appendChild(buildSeatRoomCard(room, cells, {
          mapped: !!room.cols && !q,
          onPick: (person) => askSeat(person, room),
          placeOnly: people.every((p) => p.place),
        }));
      }
      sec.appendChild(grid);
      rooms.appendChild(sec);
    }

    if (shown === 0) {
      const none = document.createElement('p');
      none.className = 'seat-empty';
      none.textContent = '찾는 이름이 없어요. 철자를 확인하거나 ‘직접 적기’를 써 주세요.';
      rooms.appendChild(none);
    }
  }

  input.oninput = () => draw(input.value);
  draw();

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const cancel = document.createElement('button');
  cancel.className = 'btn ghost';
  cancel.textContent = '닫기';
  cancel.onclick = () => { closeAsk(); back.remove(); };
  actions.appendChild(cancel);
  modal.appendChild(actions);

  back.appendChild(modal);
  document.body.appendChild(back);
  input.focus();
}

// 주문자 고르기 창 — 명단이 길어졌을 때와 직접 적을 때 쓴다.
function openCustomerPicker() {
  const back = document.createElement('div');
  back.className = 'modal-back';
  const modal = document.createElement('div');
  modal.className = 'modal menu-modal';
  const h = document.createElement('h3');
  h.textContent = '누가 주문했나요?';
  const desc = document.createElement('p');
  desc.className = 'tab-desc';
  desc.textContent = '카운터 앞 손님이면 고르지 않아도 됩니다. 메신저로 받은 주문일 때 골라 주세요.';
  modal.append(h, desc);

  const list = sortedCustomers(state.customers);
  if (list.length) {
    const grid = document.createElement('div');
    grid.className = 'cust-grid';
    for (const c of list) {
      const tile = document.createElement('button');
      tile.type = 'button';
      tile.className = 'cust-tile';
      tile.setAttribute('aria-pressed', String(orderCustomer.id === c.id));
      const em = document.createElement('span');
      em.className = 'em';
      em.textContent = c.emoji || '🙋';
      const name = document.createElement('span');
      name.textContent = c.name;
      tile.append(em, name);
      tile.onclick = () => { back.remove(); setOrderCustomer({ id: c.id, name: c.name }); };
      grid.appendChild(tile);
    }
    modal.appendChild(grid);
  }

  // 명단에 없는 손님 — 그때만 적는다
  const field = document.createElement('label');
  field.className = 'field';
  const span = document.createElement('span');
  span.textContent = list.length ? '명단에 없으면 여기에 적어 주세요' : '주문자 이름을 적어 주세요';
  const input = document.createElement('input');
  input.type = 'text';
  input.maxLength = 30;
  input.placeholder = '예: 박지훈 선생님 (3층 과학실)';
  input.value = orderCustomer.id ? '' : orderCustomer.name;
  const hint = document.createElement('small');
  hint.className = 'hint';
  hint.textContent = '자주 주문하는 분이면 관리 → 주문자에 등록해 두면 다음부터 누르기만 하면 돼요.';
  field.append(span, input, hint);
  modal.appendChild(field);

  const actions = document.createElement('div');
  actions.className = 'modal-actions';
  const clear = document.createElement('button');
  clear.className = 'btn ghost';
  clear.textContent = '현장 손님으로';
  clear.onclick = () => { back.remove(); setOrderCustomer({ id: '', name: '' }); };
  const ok = document.createElement('button');
  ok.className = 'btn primary';
  ok.textContent = '이 이름으로';
  ok.onclick = () => { back.remove(); setOrderCustomer({ id: '', name: input.value }); };
  const cancel = document.createElement('button');
  cancel.className = 'btn ghost';
  cancel.textContent = '취소';
  cancel.onclick = () => back.remove();
  actions.append(cancel, clear, ok);
  modal.appendChild(actions);

  back.appendChild(modal);
  document.body.appendChild(back);
  input.focus();
}

// 주문 화면 맨 위 — 누가 만들지 고르는 줄.
function buildBaristaPicker() {
  const sec = document.createElement('section');
  sec.className = 'barista-bar';

  const head = document.createElement('div');
  head.className = 'barista-head';
  const h2 = document.createElement('h2');
  h2.textContent = '누가 만들까요?';
  head.appendChild(h2);

  const list = activeBaristas(state.baristas);
  const picked = currentBarista();
  const hint = document.createElement('span');
  hint.className = 'pick-hint';
  hint.textContent = picked ? '바꾸려면 다른 사진을 누르세요' : '사진을 눌러 골라 주세요';
  head.appendChild(hint);
  sec.appendChild(head);

  if (list.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'barista-empty';
    empty.textContent = state.baristas.length === 0
      ? '아직 등록된 바리스타가 없어요. 관리 → 바리스타에서 추가할 수 있어요. (지금은 고르지 않고 주문해도 괜찮아요)'
      : '오늘은 모두 쉬는 날로 되어 있어요. 관리 → 바리스타에서 바꿀 수 있어요.';
    sec.appendChild(empty);
    return sec;
  }

  const strip = document.createElement('div');
  strip.className = 'barista-strip';
  strip.setAttribute('role', 'group');
  strip.setAttribute('aria-label', '만드는 사람 고르기');
  for (const b of list) {
    const on = picked?.id === b.id;
    const tile = document.createElement('button');
    tile.type = 'button';
    tile.className = 'bt' + (on ? ' on' : '');
    tile.setAttribute('aria-pressed', String(on));
    const name = document.createElement('div');
    name.className = 'bt-name';
    name.textContent = b.name;
    tile.append(buildBaristaFace(b), name);
    if (on) {
      const check = document.createElement('span');
      check.className = 'bt-check';
      check.setAttribute('aria-hidden', 'true');
      check.textContent = '✓';
      tile.appendChild(check);
    }
    // 고른 사람을 다시 누르면 선택을 푼다 — 잘못 눌렀을 때 되돌릴 길을 둔다.
    tile.onclick = () => {
      setSelectedBarista(on ? null : b.id);
      navigator.vibrate?.(30);
    };
    strip.appendChild(tile);
  }
  sec.appendChild(strip);
  return sec;
}

// 주문 완료 — 화면을 덮는 큰 번호. 3초 뒤 자동으로 빈 주문 화면으로 돌아간다.
function renderOrderNoScreen(el, orderNo) {
  const wrap = document.createElement('div');
  wrap.className = 'order-no-screen';
  const label = document.createElement('p');
  label.className = 'order-no-label';
  label.textContent = '주문번호';
  const big = document.createElement('p');
  big.className = 'order-no-big';
  big.textContent = String(orderNo);
  const sub = document.createElement('p');

}

function renderOrderView(el) {
  if (orderNoShown != null) { renderOrderNoScreen(el, orderNoShown); return; }
  renderOrderCartScreen(el);
}

// 큰 번호 표시 + 음성 안내. 3초 뒤 자동 복귀 — 타이머는 호출할 때 한 번만 잡는다
// (render()가 그 사이 다시 불려도 번호 화면을 다시 그릴 뿐, 타이머를 새로 잡지 않는다).
function showOrderNumber(orderNo) {
  orderNoShown = orderNo;
  if (orderNoTimer) clearTimeout(orderNoTimer);
  render();
  try {
    const utter = new SpeechSynthesisUtterance(`${sinoKorean(orderNo)}번이에요`);
    utter.lang = 'ko-KR';
    speechSynthesis.speak(utter);
  } catch {
    // 접속 직후에는 음성이 막히는 브라우저가 있다 — 조용히 넘어간다.
  }
  orderNoTimer = setTimeout(() => {
    orderNoShown = null;
    orderNoTimer = null;
    render();
  }, 3000);
}

// 주문 저장. 반환하는 orderId는 Task 13(재료 차감 기록)에서 stockLogs.orderId로 쓴다.
async function submitOrder() {
  if (cart.length === 0 || submitting) return;
  submitting = true;
  render();   // 버튼을 바로 비활성화해 중복 탭을 막는다
  const businessDate = businessDateOf();
  try {
    const orderNo = await state.backend.issueOrderNo(businessDate);   // 트랜잭션 — 실패할 수 있다
    const staff = state.settings.todayStaff || {};
    // 이름은 주문에 함께 적어 둔다 — 나중에 학생 이름을 고치거나 지워도 그날 기록은 그대로 남는다.
    const picked = currentBarista();
    // 재료는 주문할 때 차감한다. 차감한 양을 주문에 함께 적어 두어야 취소·되살리기에서
    // 정확히 그만큼 되돌릴 수 있다 (주문 뒤에 레시피가 바뀌어도 어긋나지 않는다).
    const menuMap = Object.fromEntries(state.menus.map((m) => [m.id, m]));
    const known = new Set(state.ingredients.map((i) => i.id));
    const delta = Object.fromEntries(Object.entries(stockDelta(cart, menuMap)).filter(([id]) => known.has(id)));
    const orderId = await state.backend.add('orders', {
      orderNo,
      businessDate,
      stockDelta: delta,
      items: cart,
      total: cartTotal(cart),
      status: 'waiting',
      cashier: staff.cashier || '',   // 기록만 해 둔다 (이번 버전에서는 집계하지 않는다)
      barista: staff.barista || '',
      baristaId: picked?.id || '',
      baristaName: picked?.name || '',
      customerId: orderCustomer.id,
      customerName: orderCustomer.name,
      createdAt: Date.now(),
    });
    submitting = false;
    cart = [];   // 주문이 안전하게 저장된 뒤에만 장바구니를 비운다
    orderCustomer = { id: '', name: '' };   // 다음 손님에게 앞사람 이름이 딸려 가지 않게
    showOrderNumber(orderNo);
    // 재고 반영이 실패해도 주문은 이미 들어갔다 — 번호를 못 받은 것처럼 안내하면 안 된다
    applyStock(delta, 'sale', { orderId, orderNo }).catch(() => {
      toast('재료 수량을 줄이지 못했어요. 관리 → 재료에서 확인해 주세요.', { ms: 6000 });
    });
    return orderId;
  } catch (err) {
    // 발번이 실패하면 장바구니를 그대로 두어 다시 시도할 수 있게 한다.
    submitting = false;
    render();
    toast('주문 번호를 받아오지 못했어요. 다시 눌러 주세요.', { ms: 5000 });
  }
}

// ---- 제조 화면 (PRD 3.2) ----
// 바리스타 학생이 "무엇을 몇 개 만들지"만 보고, 다 만들면 버튼 하나만 누르면 된다.
// 레이아웃은 main(#app)이 이미 가진 overflow-y: auto에 그대로 맡기는 흐르는 카드
// 그리드다 — Task 7에서 스크롤 구간을 JS로 재다가 세 번 고친 전례가 있어서,
// 여기서는 아예 높이를 재지 않는 쪽을 택했다(잴 게 없으면 잘못 잴 일도 없다).

// 경과 시간·지연 표시를 10초마다 다시 그리지 않고 이 값만 갱신한다.
// 역할이 바뀌거나(다른 화면으로 이동) 주문 데이터가 바뀌어 render()가 다시 불리면
// 카드가 통째로 새로 만들어지므로, 그때마다 반드시 이전 타이머를 지워야
// 재렌더 때마다 인터벌이 쌓이지 않는다.
let baristaTimer = null;
function stopBaristaTimer() {
  if (baristaTimer) { clearInterval(baristaTimer); baristaTimer = null; }
}

// 카드 한 장의 "경과 시간·지연 여부"만 갱신한다(그리기는 buildOrderCard가 한다).
function updateCardTiming(card, order, now, lateMinutes) {
  const late = isLate(order, now, lateMinutes);
  card.classList.toggle('late', late);   // 색에만 기대지 않는다: 두꺼운 테두리(CSS) + 아래 ⏰ 아이콘과 함께 쓴다
  const mins = Math.max(0, Math.floor((now - order.createdAt) / 60000));
  card.querySelector('.elapsed-text').textContent = `${mins}분 경과`;
}

// 받침 유무에 따라 "을/를"을 골라 붙인다. 메뉴 이름은 관리자가 자유롭게 짓기 때문에
// 매번 맞는 조사를 붙이려면 이렇게 계산해야 한다(예: "아메리카노를", "핫초코를", "빵을").
function withObjectParticle(word) {
  const last = String(word || '').trim().slice(-1);
  const code = last.charCodeAt(0);
  const isHangulSyllable = code >= 0xAC00 && code <= 0xD7A3;
  const hasBatchim = isHangulSyllable && (code - 0xAC00) % 28 !== 0;
  return `${word}${hasBatchim ? '을' : '를'}`;
}

// 재료가 떨어진 걸 가장 먼저 아는 사람이 바리스타이므로, 관리 화면까지 가지 않고
// 여기서 바로 품절 처리할 수 있게 한다.
// 이 버튼은 이 주문 한 줄이 아니라 카페 전체 메뉴에 영향을 준다 — 주문 화면 타일이
// 바로 흐려질 만큼 파급이 크므로, 완료(markReady)와 똑같이 되돌리기 토스트를 보여준다
// (접근성 원칙 4: 모든 동작은 되돌릴 수 있다 / 원칙 6: 즉각적인 다감각 피드백).
// set은 필드 단위로 merge하므로 soldOut 한 필드만 보낸다
// (메뉴 객체 전체나 배열을 잘못 보내면 recipe 등 다른 필드가 날아간다).
function toggleMenuSoldOut(menuId) {
  const menu = state.menus.find((m) => m.id === menuId);
  if (!menu) return;
  const was = !!menu.soldOut;
  const willBeSoldOut = !was;
  const name = menu.name || '이 메뉴';
  state.backend.set('menus', menuId, { soldOut: willBeSoldOut });
  toast(
    willBeSoldOut
      ? `${withObjectParticle(name)} 오늘 품절로 바꿨어요`
      : `${withObjectParticle(name)} 다시 팔 수 있어요`,
    {
      actionText: '되돌리기',
      ms: CONFIG.undoSeconds * 1000,
      onAction: () => state.backend.set('menus', menuId, { soldOut: was }),
    },
  );
}

// 주문 한 줄(메뉴 하나) — 사진(또는 이모지) + 이름 + 수량을 항상 함께 보여준다(AAC 원칙).
function buildOrderItemRow(item) {
  const row = document.createElement('div');
  row.className = 'oi';

  const thumb = document.createElement('div');
  thumb.className = 'oi-thumb';
  if (item.photo) {
    const img = document.createElement('img');
    img.src = item.photo;
    img.alt = '';
    thumb.appendChild(img);
  } else {
    const span = document.createElement('span');
    span.className = 'emoji';
    span.textContent = item.emoji || '☕';
    thumb.appendChild(span);
  }
  row.appendChild(thumb);

  const name = document.createElement('span');
  name.className = 'oi-name';
  name.textContent = item.name || '';
  row.appendChild(name);

  const qty = document.createElement('b');
  qty.className = 'oi-qty';
  qty.textContent = `×${item.qty}`;
  row.appendChild(qty);

  const menu = state.menus.find((m) => m.id === item.menuId);
  const soldOutBtn = document.createElement('button');
  soldOutBtn.type = 'button';
  soldOutBtn.className = 'oi-soldout' + (menu?.soldOut ? ' on' : '');
  // 이 버튼은 이 주문 한 줄이 아니라 메뉴 전체에 적용된다 — 글자 그대로 보이는
  // 이름에도 "메뉴"라는 범위를 넣어, aria-label을 못 읽는 학생도 뜻을 알 수 있게 한다.
  soldOutBtn.textContent = menu?.soldOut ? '다시 팔기' : '메뉴 품절';
  soldOutBtn.setAttribute('aria-label', `${item.name} 메뉴를 ${menu?.soldOut ? '다시 팔 수 있게 하기' : '오늘 품절로 바꾸기'}`);
  soldOutBtn.onclick = () => toggleMenuSoldOut(item.menuId);
  row.appendChild(soldOutBtn);

  return row;
}

// 대기 카드 한 장.
function buildOrderCard(order, now, lateMinutes) {
  const card = document.createElement('div');
  card.className = 'order-card';
  card.dataset.orderId = order.id;

  const no = document.createElement('div');
  no.className = 'order-no';
  no.textContent = String(order.orderNo);
  card.appendChild(no);

  const who = buildWhoChip(order);
  if (who) card.appendChild(who);
  const cust = buildCustomerChip(order);
  if (cust) card.appendChild(cust);

  const items = document.createElement('div');
  items.className = 'order-items';
  for (const item of order.items) items.appendChild(buildOrderItemRow(item));
  card.appendChild(items);

  const elapsed = document.createElement('div');
  elapsed.className = 'order-elapsed';
  const badge = document.createElement('span');
  badge.className = 'late-badge';
  badge.setAttribute('aria-hidden', 'true');   // 색에만 기대지 않는 지연 표시 — 아이콘
  badge.textContent = '⏰';
  const text = document.createElement('span');
  text.className = 'elapsed-text';
  elapsed.append(badge, text);
  card.appendChild(elapsed);

  const doneBtn = document.createElement('button');
  doneBtn.type = 'button';
  doneBtn.className = 'btn ok big';
  doneBtn.textContent = '완료';
  doneBtn.setAttribute('aria-label', `${order.orderNo}번 주문 완료`);
  doneBtn.onclick = () => markReady(order);
  card.appendChild(doneBtn);

  updateCardTiming(card, order, now, lateMinutes);
  return card;
}

// 주문 상태를 바꾸는 유일한 길. 되돌릴 동작을 주면 토스트에 '되돌리기'를 단다
// (접근성 원칙 4: 모든 동작은 되돌릴 수 있다).
async function applyOrder(order, action, { message, undo } = {}) {
  const cur = state.orders.find((o) => o.id === order.id) || order;
  if (!canApply(action, cur)) {
    toast(`${cur.orderNo}번은 이미 다른 화면에서 바뀌었어요.`);
    return;
  }
  const patch = orderPatch(action, cur, Date.now());
  await state.backend.set('orders', cur.id, patch);
  // 취소하면 주문할 때 뺀 재료를 되돌리고, 되살리면 다시 뺀다 (Task 14)
  const effect = stockEffect(action, cur);
  if (Object.keys(effect).length) {
    await applyStock(effect, action, { orderId: cur.id, orderNo: cur.orderNo }).catch(() => {
      toast('재료 수량을 맞추지 못했어요. 관리 → 재료에서 확인해 주세요.', { ms: 6000 });
    });
  }
  if (!message) return;
  if (!undo) { toast(message); return; }
  const after = { ...cur, ...patch };
  toast(message, {
    actionText: '되돌리기',
    ms: CONFIG.undoSeconds * 1000,
    // 되돌리기도 같은 길로 — 그래야 취소를 되돌릴 때 재료도 다시 빠진다
    onAction: () => applyOrder(after, undo),
  });
}

function markReady(order) {
  return applyOrder(order, 'complete', { message: `${order.orderNo}번 호출했어요`, undo: 'backToMaking' });
}

function markPickedUp(order) {
  return applyOrder(order, 'pickUp', { message: `${order.orderNo}번 손님이 가져갔어요`, undo: 'unPickUp' });
}

// 제조 화면 아래의 '준비 완료' 카드 — 음료를 건네면서 '가져감'을 누른다.
function buildPickupCard(order) {
  const card = document.createElement('div');
  card.className = 'order-card pickup-card';
  const no = document.createElement('div');
  no.className = 'order-no';
  no.textContent = String(order.orderNo);
  card.appendChild(no);
  const who = buildWhoChip(order);
  if (who) card.appendChild(who);
  const cust = buildCustomerChip(order);
  if (cust) card.appendChild(cust);
  const items = document.createElement('div');
  items.className = 'order-items';
  for (const item of order.items || []) items.appendChild(buildItemLine(item));
  card.appendChild(items);
  const btn = document.createElement('button');
  btn.type = 'button';
  btn.className = 'btn primary big';
  btn.textContent = '가져감';
  btn.setAttribute('aria-label', `${order.orderNo}번 손님이 가져감`);
  btn.onclick = () => markPickedUp(order);
  card.appendChild(btn);
  return card;
}

// 메뉴 한 줄 (사진 또는 이모지 + 이름 + 수량). 품절 버튼 없이 보여주기만 한다.
function buildItemLine(item) {
  const row = document.createElement('div');
  row.className = 'oi';
  const thumb = document.createElement('div');
  thumb.className = 'oi-thumb';
  if (item.photo) {
    const img = document.createElement('img');
    img.src = item.photo;
    img.alt = '';
    thumb.appendChild(img);
  } else {
    thumb.textContent = item.emoji || '☕';
  }
  const name = document.createElement('span');
  name.className = 'oi-name';
  name.textContent = item.name || '';
  const qty = document.createElement('b');
  qty.className = 'oi-qty';
  qty.textContent = `×${item.qty}`;
  row.append(thumb, name, qty);
  return row;
}

function renderBaristaView(el) {
  stopBaristaTimer();
  const all = waitingOrders(state.orders);
  const mine = state.baristas.find((b) => b.id === baristaFilterId);
  const list = mine ? all.filter((o) => o.baristaId === mine.id) : all;
  const lateMinutes = Number(state.settings.lateMinutes) || CONFIG.defaults.lateMinutes;

  const wrap = document.createElement('div');
  wrap.className = 'barista-screen';
  wrap.appendChild(buildMineBar(all));

  if (list.length === 0) {
    const hint = document.createElement('p');
    hint.className = 'empty-hint';
    hint.textContent = mine
      ? `${mine.name}이(가) 만들 음료가 지금은 없어요. ‘모두 보기’를 누르면 다른 주문도 볼 수 있어요.`
      : '지금은 만들 음료가 없어요. 잠시 쉬어도 좋아요 :)';
    wrap.appendChild(hint);
  } else {
    const grid = document.createElement('div');
    grid.className = 'order-grid';
    const now0 = Date.now();
    for (const order of list) grid.appendChild(buildOrderCard(order, now0, lateMinutes));
    wrap.appendChild(grid);
  }

  // 다 만든 음료 — 손님께 건네면 '가져감'. 가져간 번호는 호출 화면에서 빠진다.
  const readyAll = readyQueue(state.orders);
  const ready = mine ? readyAll.filter((o) => o.baristaId === mine.id) : readyAll;
  if (ready.length) {
    const head = document.createElement('h2');
    head.className = 'pickup-head';
    head.textContent = '✅ 준비 완료 — 손님께 건네면 ‘가져감’을 눌러요';
    wrap.appendChild(head);
    const grid = document.createElement('div');
    grid.className = 'order-grid';
    for (const order of ready) grid.appendChild(buildPickupCard(order));
    wrap.appendChild(grid);
  }
  el.appendChild(wrap);

  // 경과 시간은 시간이 흐르기만 해도 바뀐다 — 데이터가 안 바뀌어도 10초마다 다시 잰다.
  baristaTimer = setInterval(() => {
    const now = Date.now();
    const lm = Number(state.settings.lateMinutes) || CONFIG.defaults.lateMinutes;
    for (const order of list) {
      const card = el.querySelector(`.order-card[data-order-id="${order.id}"]`);
      if (card) updateCardTiming(card, order, now, lm);
    }
  }, 10000);
}

// 제조 화면 위쪽 — 두세 명이 같이 만들 때 자기 주문만 보기.
// 바리스타가 한 명도 등록되지 않았으면 아무것도 보여 주지 않는다.
function buildMineBar(allWaiting) {
  const bar = document.createElement('div');
  bar.className = 'mine-bar';
  const list = activeBaristas(state.baristas);
  if (list.length === 0) return bar;

  const label = document.createElement('span');
  label.className = 'label';
  label.textContent = '볼 주문:';
  bar.appendChild(label);

  const addBtn = (text, on, onclick, face) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'mine-btn';
    b.setAttribute('aria-pressed', String(on));
    if (face) b.appendChild(face);
    const span = document.createElement('span');
    span.textContent = text;
    b.appendChild(span);
    b.onclick = onclick;
    bar.appendChild(b);
  };

  const setFilter = (id) => {
    baristaFilterId = id;
    try {
      if (id) localStorage.setItem(CONFIG.baristaFilterKey, id);
      else localStorage.removeItem(CONFIG.baristaFilterKey);
    } catch { }
    render();
  };

  addBtn(`모두 보기 (${allWaiting.length})`, !baristaFilterId, () => setFilter(null));
  for (const b of list) {
    const n = allWaiting.filter((o) => o.baristaId === b.id).length;
    addBtn(`${b.name} (${n})`, baristaFilterId === b.id, () => setFilter(b.id), buildBaristaFace(b));
  }
  return bar;
}

// ---- 호출 화면 (PRD 3.3) ----
// 손님이 보는 화면이라 조작 요소를 두지 않는다.

// 브라우저 자동재생 정책 — 손님이 화면을 한 번 건드리기 전에는 소리를 낼 수 없다.
let displayReady = false;
// 번호가 크게 튀어오르는 연출을 언제까지 이어 갈지.
// 화면은 다시 그릴 때마다 통째로 새로 만들어지고, 저장 한 번에 구독이 여럿 반응해
// render()가 연달아 여러 번 돈다. 그래서 '이번에 연출할까'를 한 번 쓰고 버리는
// 플래그로 두면 바로 뒤의 다시 그리기가 연출을 지워버린다.
// 대신 연출이 끝나는 시각을 적어 두고, 그때까지는 몇 번을 다시 그려도 이어 간다.
const CALL_POP_MS = 1400;   // CSS의 call-pop 길이와 맞춘다
let popUntil = 0;

// AudioContext는 사용자 제스처 안에서 만들어야 잠기지 않는다.
function audioContext() {
  return (window.__ac ||= new (window.AudioContext || window.webkitAudioContext)());
}

// 차임음 — 오디오 파일 없이 WebAudio로 두 음을 낸다 (기내 안내방송 느낌)
function playChime() {
  if (!state.settings.chime) return;
  try {
    const ctx = audioContext();
    const now = ctx.currentTime;
    for (const [i, freq] of [880, 660].entries()) {
      const osc = ctx.createOscillator(), gain = ctx.createGain();
      osc.frequency.value = freq;
      osc.type = 'sine';
      gain.gain.setValueAtTime(0.0001, now + i * 0.35);
      gain.gain.exponentialRampToValueAtTime(0.3, now + i * 0.35 + 0.03);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + i * 0.35 + 0.5);
      osc.connect(gain).connect(ctx.destination);
      osc.start(now + i * 0.35);
      osc.stop(now + i * 0.35 + 0.55);
    }
  } catch { /* 소리를 못 내는 기기에서는 조용히 넘어간다 */ }
}

function speak(text) {
  try {
    const u = new SpeechSynthesisUtterance(text);
    u.lang = 'ko-KR';
    // 볼륨 0은 "끄기"라는 뜻의 유효한 값이므로 || 로 기본값을 덮어쓰지 않는다.
    const rate = Number(state.settings.ttsRate), volume = Number(state.settings.ttsVolume);
    u.rate = Number.isFinite(rate) ? rate : CONFIG.defaults.ttsRate;
    u.volume = Number.isFinite(volume) ? volume : CONFIG.defaults.ttsVolume;
    speechSynthesis.speak(u);
  } catch { /* 음성이 없는 기기에서는 조용히 넘어간다 */ }
}

// 호출 화면에는 상단바가 없어 '역할 바꾸기'를 누를 수 없다.
// 손님 눈에는 잘 띄지 않되 선생님은 찾을 수 있도록, 구석에 흐린 버튼을 둔다.
// 손가락으로 겨냥할 수 있어야 하므로 흐릴 뿐 작지는 않다(44px).
function buildDisplayExit() {
  const btn = document.createElement('button');
  btn.className = 'display-exit';
  btn.textContent = '역할 바꾸기';
  btn.setAttribute('aria-label', '역할 선택으로 돌아가기');
  btn.onclick = () => {
    // 전체화면으로 열었다면 먼저 빠져나와야 다음 화면이 창에 갇히지 않는다.
    try { if (document.fullscreenElement) document.exitFullscreen?.(); } catch { }
    changeRole();
  };
  return btn;
}

function buildDisplayGate() {
  const gate = document.createElement('button');
  gate.className = 'display-gate';
  const icon = document.createElement('span');
  icon.className = 'display-gate-icon';
  icon.textContent = '\u{1F446}';
  const strong = document.createElement('strong');
  strong.textContent = '화면을 한 번 눌러 주세요';
  const small = document.createElement('small');
  small.textContent = '소리로 번호를 불러 드릴게요';
  gate.append(icon, strong, small);
  gate.onclick = () => {
    displayReady = true;
    // 이 제스처 안에서 오디오를 깨워 둔다. 실제 소리는 호출이 있을 때만 난다.
    try { audioContext().resume(); } catch { /* 소리 없이도 화면은 쓴다 */ }
    // 전체화면은 선생님이 끌 수 있다. 창 모드로 두고 다른 화면과 나란히 보는 경우가 있다.
    // 켜 두어도 기기가 거절할 수 있다 (iOS Safari 등) — 실패해도 그대로 쓴다.
    if (state.settings.displayFullscreen) {
      try { document.documentElement.requestFullscreen?.().catch(() => {}); } catch { }
    }
    render();
  };
  return gate;
}

function renderDisplayView(el) {
  const board = displayBoard(state.orders, CONFIG.displayReadyCount, CONFIG.displayWaitingCount);
  const top = board.current;

  const wrap = document.createElement('div');
  wrap.className = 'display-screen';

  // ---- 위: 로고 ----
  const head = document.createElement('div');
  head.className = 'display-head';
  const title = document.createElement('h1');
  title.className = 'display-title';
  title.textContent = CONFIG.cafeName;
  if (CONFIG.logoSrc) {
    const logo = document.createElement('img');
    logo.className = 'display-logo';
    logo.src = CONFIG.logoSrc;
    logo.alt = CONFIG.cafeName;
    // 파일이 없거나 못 받아오면 카페 이름 글자로 대신한다
    logo.onerror = () => logo.replaceWith(title);
    head.appendChild(logo);
  } else {
    head.appendChild(title);
  }
  wrap.appendChild(head);

  // ---- 가운데: 지금 부르는 번호 ----
  const center = document.createElement('div');
  center.className = 'display-center';
  if (!top) {
    const hint = document.createElement('p');
    hint.className = 'display-empty';
    // 아직 부른 번호가 없을 때와, 마지막 번호를 손님이 가져갔을 때 모두 이 문구다
    hint.textContent = '음료가 준비되면 번호를 불러 드려요.';
    center.appendChild(hint);
  } else {
    const no = document.createElement('div');
    // 연출을 시작할지는 onOrdersChanged가 정한다. 여기서는 따라 그리기만 한다.
    no.className = 'display-no' + (Date.now() < popUntil ? ' pop' : '');
    // 화면에는 숫자를 그대로 — 손님이 번호표와 눈으로 맞춰야 한다.
    no.textContent = top.orderNo;
    center.appendChild(no);

    const line = document.createElement('p');
    line.className = 'display-line';
    // 소리를 못 듣는 손님에게는 이 줄이 안내의 전부다.
    line.setAttribute('aria-live', 'assertive');
    line.textContent = callText(state.settings.ttsText, top.orderNo);
    center.appendChild(line);

    // 원격 주문이면 누구 것인지 함께 띄운다 — 대신 받으러 온 사람도 알아볼 수 있게
    const custName = (top.customerName || '').trim();
    if (custName) {
      const who = document.createElement('p');
      who.className = 'display-cust';
      who.textContent = `🙋 ${custName}`;
      center.appendChild(who);
    }
  }
  wrap.appendChild(center);

  // ---- 아래: 제조 중 · 준비 완료 ----
  const boardEl = document.createElement('div');
  boardEl.className = 'display-board';
  boardEl.append(
    buildBoardCol('making', '☕ 제조 중', board.waiting, board.waitingMore, null),
    buildBoardCol('done', '✅ 준비 완료', board.ready, 0, top),
  );
  wrap.appendChild(boardEl);

  el.appendChild(wrap);
  el.appendChild(buildDisplayExit());
  if (!displayReady) el.appendChild(buildDisplayGate());
}

function buildBoardCol(kind, heading, list, more, latest) {
  const col = document.createElement('section');
  col.className = `board-col ${kind}`;
  const h = document.createElement('h2');
  h.textContent = heading;
  col.appendChild(h);

  const ul = document.createElement('div');
  ul.className = 'board-list';
  if (list.length === 0) {
    const none = document.createElement('span');
    none.className = 'board-none';
    none.textContent = '없음';
    ul.appendChild(none);
  }
  for (const o of list) {
    const chip = document.createElement('span');
    chip.className = 'board-no' + (latest && o.id === latest.id ? ' latest' : '');
    chip.textContent = o.orderNo;
    ul.appendChild(chip);
  }
  if (more > 0) {
    const m = document.createElement('span');
    m.className = 'board-more';
    m.textContent = `외 ${more}건`;
    ul.appendChild(m);
  }
  col.appendChild(ul);
  return col;
}

// 매니저 보드 되그리기 — 수령 완료 카드는 시간이 지나기만 해도 사라져야 한다.
// render()가 다시 불릴 때마다 새로 잡지 않도록, 켜져 있으면 그대로 둔다.
let managerTimer = null;
function startManagerTimer() {
  if (managerTimer) return;
  managerTimer = setInterval(() => {
    if (state.role !== 'manager') { stopManagerTimer(); return; }
    render();
  }, 20 * 1000);
}
function stopManagerTimer() {
  if (managerTimer) { clearInterval(managerTimer); managerTimer = null; }
}

// 새 호출 감지 — 주문 구독이 바뀔 때마다 불린다.
let lastCallAt = 0;          // 이미 반응을 끝낸 가장 최근 호출 시각
let displayPrimed = false;
function onOrdersChanged() {
  const [top] = recentCalls(state.orders, 1);

  // 첫 콜백에서는 이미 쌓여 있던 주문을 '이미 부른 것'으로 삼는다.
  // 그래야 호출 화면을 새로고침해도 과거 주문이 갑자기 울리지 않는다.
  if (!displayPrimed) {
    displayPrimed = true;
    lastCallAt = top ? callTime(top) : 0;
    return;
  }

  // 부른 시각이 더 최근일 때만 새 호출이다 (완료 · 다시 호출).
  // 제조로 되돌리거나 손님이 가져가면 맨 앞이 이전 번호로 바뀌는데, 그건 새로 나온
  // 음료가 아니다. 이미 불렀던 번호를 다시 부르면 안 된다.
  if (!top || !(callTime(top) > lastCallAt)) return;
  lastCallAt = callTime(top);

  // 소리는 손님이 보는 화면에서만 난다. 주문·제조 화면에서 울리면 방해가 된다.
  if (state.role !== 'display') return;
  popUntil = Date.now() + CALL_POP_MS;
  if (!displayReady) return;   // 아직 화면을 한 번도 누르지 않았다
  playChime();
  // 차임음이 끝난 뒤에 말해야 둘이 겹치지 않는다.
  setTimeout(() => speak(speechText(state.settings.ttsText, top.orderNo)), 900);
}

// ---- 매니저 보드 (Task 11.5) ----
// 선생님이 주문 · 제조 · 호출을 한 화면에서 보고 바로잡는다. 비밀번호는 걸지 않는다.
const MANAGER_COLUMNS = [
  { key: 'waiting',   title: '☕ 제조 중' },
  { key: 'ready',     title: '🔔 준비 완료' },
  { key: 'pickedUp',  title: '✅ 수령 완료' },
  { key: 'cancelled', title: '✖ 취소' },
];

// 모드는 선생님이 고른 게 있으면 그것, 없으면 화면 폭으로 정한다.
function managerMode() {
  let saved = null;
  try { saved = localStorage.getItem(CONFIG.managerModeKey); } catch { }
  if (saved === 'tablet' || saved === 'mobile') return saved;
  return window.innerWidth < 700 ? 'mobile' : 'tablet';
}
function setManagerMode(mode) {
  try { localStorage.setItem(CONFIG.managerModeKey, mode); } catch { }
  render();
}

let managerTab = 'waiting';     // 모바일 모드에서 보고 있는 열
const managerScroll = {};       // 열마다 스크롤 위치 — 다시 그려도 튀지 않게

function renderManagerView(el) {
  const mode = managerMode();
  const visibleMinutes = Number(state.settings.pickedUpVisibleMinutes ?? CONFIG.pickedUpVisibleMinutes);
  const board = managerBoard(state.orders, businessDateOf(), Date.now(), visibleMinutes);

  const wrap = document.createElement('div');
  wrap.className = 'manager';

  const bar = document.createElement('div');
  bar.className = 'manager-bar';
  const h = document.createElement('h2');
  h.textContent = '주문 한눈에 보기';
  const seg = document.createElement('div');
  seg.className = 'seg';
  seg.setAttribute('role', 'group');
  seg.setAttribute('aria-label', '보기 방식');
  for (const [key, label] of [['tablet', '태블릿 모드'], ['mobile', '모바일 모드']]) {
    const b = document.createElement('button');
    b.type = 'button';
    b.textContent = label;
    b.setAttribute('aria-pressed', String(mode === key));
    b.onclick = () => setManagerMode(key);
    seg.appendChild(b);
  }
  bar.append(h, seg);
  wrap.appendChild(bar);

  let columns = MANAGER_COLUMNS;
  if (mode === 'mobile') {
    const tabs = document.createElement('div');
    tabs.className = 'mtabs';
    tabs.setAttribute('role', 'tablist');
    for (const c of MANAGER_COLUMNS) {
      const t = document.createElement('button');
      t.type = 'button';
      t.setAttribute('role', 'tab');
      t.setAttribute('aria-selected', String(managerTab === c.key));
      const name = document.createElement('span');
      name.textContent = c.title;
      const count = document.createElement('b');
      count.textContent = board[c.key].length;
      t.append(name, count);
      t.onclick = () => { managerTab = c.key; render(); };
      tabs.appendChild(t);
    }
    wrap.appendChild(tabs);
    columns = MANAGER_COLUMNS.filter((c) => c.key === managerTab);
  }

  const boardEl = document.createElement('div');
  boardEl.className = 'mboard' + (mode === 'mobile' ? ' single' : '');
  for (const c of columns) {
    const past = `${visibleMinutes}분이 지난 건은 관리 → 기록에서 볼 수 있어요`;
    const note = c.key === 'pickedUp' ? `${past} · 오늘 ${board.pickedUpTodayCount}건`
      : c.key === 'cancelled' ? `${past} · 오늘 ${board.cancelledTodayCount}건`
      : null;
    boardEl.appendChild(buildManagerColumn(c, board[c.key], note));
  }
  wrap.appendChild(boardEl);
  el.appendChild(wrap);

  // 시간이 흐르기만 해도 수령 완료 카드가 사라져야 한다 — 데이터가 안 바뀌어도 다시 그린다.
  startManagerTimer();

  // 붙인 뒤에야 스크롤 위치를 되살릴 수 있다
  for (const body of el.querySelectorAll('.mcol-body')) {
    body.scrollTop = managerScroll[body.dataset.col] || 0;
  }
}

function buildManagerColumn(col, list, note) {
  const sec = document.createElement('section');
  sec.className = `mcol ${col.key}`;
  const head = document.createElement('div');
  head.className = 'mcol-head';
  const title = document.createElement('span');
  title.textContent = col.title;
  const count = document.createElement('span');
  count.className = 'mcol-count';
  count.textContent = list.length;
  count.setAttribute('aria-label', `${list.length}건`);
  head.append(title, count);
  sec.appendChild(head);
  if (note) {
    const noteEl = document.createElement('p');
    noteEl.className = 'mcol-note';
    noteEl.textContent = note;
    sec.appendChild(noteEl);
  }

  const body = document.createElement('div');
  body.className = 'mcol-body';
  body.dataset.col = col.key;
  body.addEventListener('scroll', () => { managerScroll[col.key] = body.scrollTop; });
  if (list.length === 0) {
    const empty = document.createElement('p');
    empty.className = 'mcol-empty';
    empty.textContent = col.key === 'pickedUp' ? '최근에 가져간 주문이 없어요' : '없음';
    body.appendChild(empty);
  }
  for (const order of list) body.appendChild(buildManagerCard(order, col.key));
  sec.appendChild(body);
  return sec;
}

function buildManagerCard(order, colKey) {
  const card = document.createElement('div');
  card.className = 'mcard';
  const no = document.createElement('div');
  no.className = 'mcard-no';
  no.textContent = String(order.orderNo);
  card.appendChild(no);
  const who = buildWhoChip(order);
  if (who) card.appendChild(who);
  const cust = buildCustomerChip(order);
  if (cust) card.appendChild(cust);
  for (const item of order.items || []) card.appendChild(buildItemLine(item));

  const actions = document.createElement('div');
  actions.className = 'mcard-actions';
  const n = order.orderNo;
  const add = (label, cls, aria, onclick) => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = `btn ${cls}`;
    b.textContent = label;
    b.setAttribute('aria-label', aria);
    b.onclick = onclick;
    actions.appendChild(b);
  };

  if (colKey === 'waiting') {
    add('완료 ▶', 'ok', `${n}번 완료하고 호출`, () => markReady(order));
    add('취소', 'danger-ghost', `${n}번 주문 취소`, () => cancelOrder(order));
  } else if (colKey === 'ready') {
    add('◀ 제조로', 'ghost', `${n}번을 제조 중으로 되돌리기`,
      () => applyOrder(order, 'backToMaking', { message: `${n}번을 제조 중으로 되돌렸어요` }));
    add('다시 호출', 'ghost', `${n}번 다시 호출`,
      () => applyOrder(order, 'recall', { message: `${n}번을 다시 불렀어요` }));
    add('수령 ▶', 'primary', `${n}번 손님이 가져감`, () => markPickedUp(order));
    add('취소', 'danger-ghost', `${n}번 주문 취소`, () => cancelOrder(order));
  } else if (colKey === 'pickedUp') {
    add('◀ 준비 완료로', 'ghost', `${n}번을 준비 완료로 되돌리기`,
      () => applyOrder(order, 'unPickUp', { message: `${n}번을 준비 완료로 되돌렸어요` }));
  } else if (colKey === 'cancelled') {
    add('되살리기', 'ghost', `${n}번 주문 되살리기`,
      () => applyOrder(order, 'restore', { message: `${n}번 주문을 되살렸어요` }));
  }
  card.appendChild(actions);
  return card;
}

// 취소는 판매 기록에서 빠지는 일이라 한 번 더 묻는다. 그래도 잘못 눌렀으면 되돌릴 수 있다.
async function cancelOrder(order) {
  const ok = await confirmModal({
    title: `${order.orderNo}번 주문을 취소할까요?`,
    msg: '판매 기록에서 빠지고 호출 화면에서도 사라집니다. 레시피대로 뺐던 재료는 다시 돌아와요.\n취소 열에서 언제든 되살릴 수 있어요.',
    okText: '주문 취소',
    okClass: 'danger',
    cancelText: '그대로 두기',
  });
  if (!ok) return;
  await applyOrder(order, 'cancel', { message: `${order.orderNo}번 주문을 취소했어요`, undo: 'restore' });
}

// ---- 라우팅 ----
const VIEWS = {
  order:   { render: renderOrderView },
  barista: { render: renderBaristaView },
  display: { render: renderDisplayView },
  manager: { render: renderManagerView },
  admin: {
    render(el) {
      if (!adminUnlocked) { renderPinGate(el); return; }
      renderAdminTabs(el);
    },
  },
};

function render() {
  // 매니저 화면을 떠나면 되그리기 타이머도 멈춘다 (보드를 그릴 때 다시 켠다).
  if (state.role !== 'manager') stopManagerTimer();
  // 제조 화면이 떠 있었다면 카드를 갈아엎기 전에 경과 시간 인터벌부터 지운다.
  // 그래야 다른 화면으로 옮기거나 데이터가 바뀌어 다시 그릴 때마다 인터벌이 쌓이지 않는다.
  stopBaristaTimer();
  const el = document.getElementById('app');
  const bar = document.getElementById('topbar');
  // 사용법은 역할 위에 겹쳐 뜬다 — 읽는 동안 다른 것이 끼어들지 않게 먼저 가로챈다.
  if (guideOpen) {
    bar.hidden = true;
    renderGuideView(el);
    return;
  }
  if (!state.role) {
    bar.hidden = true;
    renderRolePicker(el);
    return;
  }
  bar.hidden = state.role === 'display';   // 호출 화면은 손님이 보므로 상단바를 감춘다
  document.getElementById('role-tag').textContent = ROLE_LABEL[state.role];

  // 오늘의 담당 학생 이름 (빈칸이면 아무것도 표시하지 않는다)
  const staff = state.settings.todayStaff || {};
  const who = state.role === 'order' ? staff.cashier : state.role === 'barista' ? staff.barista : '';
  const label = state.role === 'order' ? '오늘의 캐셔' : '오늘의 바리스타';
  document.getElementById('staff-tag').textContent = who ? `${label}: ${who}` : '';

  el.innerHTML = '';
  VIEWS[state.role].render(el);
}

// DOM·네트워크를 건드리지 않는 순수 로직만 여기서 검증한다.
const TESTS = [];
function test(name, fn) { TESTS.push({ name, fn }); }

// 깊은 비교 단언. 다르면 Error를 던진다.
function eq(actual, expected, msg) {
  const a = JSON.stringify(actual), e = JSON.stringify(expected);
  if (a !== e) throw new Error(`${msg ? msg + ' — ' : ''}기대: ${e} / 실제: ${a}`);
}

function runSelfTest() {
  const fails = [];
  let pass = 0;
  for (const t of TESTS) {
    try { t.fn(); pass++; }
    catch (err) { fails.push(`✗ ${t.name}\n    ${err.message}`); }
  }
  const head = fails.length === 0 ? `PASS ${pass}/${TESTS.length}` : `FAIL ${pass}/${TESTS.length}`;
  document.body.innerHTML =
    `<pre id="selftest-result">${head}\n\n${fails.join('\n\n') || '모든 테스트를 통과했습니다.'}</pre>`;
}

test('테스트 러너가 불일치를 잡아낸다', () => {
  let caught = false;
  try { eq(1, 2); } catch (err) { caught = true; }
  if (!caught) throw new Error('eq가 불일치를 통과시켰습니다');
});

test('자리는 한 줄 칸 수를 넘지 않는다', () => {
  // 순서대로 놓이므로 겹칠 일은 없다. 가로로 한 줄보다 넓은 자리만 막으면 된다.
  const bad = [];
  for (const room of DEFAULT_SEAT_MAP) {
    if (!room.cols) continue;
    for (const c of room.cells || []) {
      const span = c.span || 1;
      if (span > room.cols) bad.push(`${room.room} ${c.name}: 가로 ${span}칸이 한 줄(${room.cols})보다 넓다`);
      if ((c.rspan || 1) < 1) bad.push(`${room.room} ${c.name}: 세로 칸 수가 0 이하`);
    }
  }
  eq(bad, []);
});

test('빈칸은 사람으로 세지 않는다', () => {
  const room = { cells: [{ name: '가' }, { blank: true }, { name: '나' }] };
  eq(seatPeople(room).map((c) => c.name), ['가', '나']);
  eq(seatPeople({ cells: [] }), []);
  eq(seatPeople({}), []);
});

test('자리배치도가 성한 모양이다', () => {
  const seen = new Set();
  const bad = [];
  for (const room of DEFAULT_SEAT_MAP) {
    if (!room.floor) bad.push(`${room.room}: 층이 없다`);
    if (!room.room) bad.push('방 이름이 없는 칸이 있다');
    for (const p of seatPeople(room)) {
      if (!p.name) bad.push(`${room.room}: 이름이 빈 자리가 있다`);
      const key = `${p.name}/${room.room}`;
      if (seen.has(key)) bad.push(`중복: ${key}`);
      seen.add(key);
    }
  }
  eq(bad, []);
});

// ===== 7. 시작 =====
if (new URLSearchParams(location.search).has('selftest')) {
  runSelfTest();
} else {
  // Firebase 키가 있으면 클라우드, 비어 있으면 로컬 모드로 동작한다 (PRD 6.2)
  let netLabel = '연습 모드';
  if (CONFIG.firebase.apiKey) {
    try {
      state.backend = await createFirestoreBackend();
      netLabel = '연결됨';
    } catch (err) {
      // 설정값이 틀렸거나 Firebase 파일을 못 받아온 경우다. 앱은 쓸 수 있게 로컬로 물러서되,
      // 기기끼리 주문이 오가지 않으므로 선생님이 반드시 알아채야 한다.
      console.error(err);
      state.backend = createLocalBackend();
      netLabel = '연결 안 됨';
      toast('클라우드에 연결하지 못했어요. 이 기기에서만 저장됩니다. 인터넷과 설정값을 확인해 주세요.', { ms: 10000 });
    }
  } else {
    state.backend = createLocalBackend();
  }

  // 저장된 데이터가 깨져 있으면 로컬 백엔드는 조용히 빈 상태로 시작한다.
  // 선생님 눈에는 "메뉴가 이유 없이 사라진" 것으로 보이므로 반드시 알린다.
  const raw = localStorage.getItem(CONFIG.localStorageKey);
  if (raw) {
    try { JSON.parse(raw); }
    catch {
      toast('저장된 자료를 읽지 못했어요. 메뉴를 다시 등록해 주세요.', { ms: 8000 });
    }
  }

  for (const name of ['menus', 'baristas', 'customers', 'ingredients', 'seats']) {
    state.backend.subscribe(name, (docs) => { state[name] = docs; render(); });
  }
  // 주문은 최근 며칠 것만 실시간으로 받는다 — 끝나지 않은 주문과 오늘 기록을 보기에 충분하다.
  // 더 오래된 주문은 관리 → 기록에서 고른 기간만 불러온다.
  // 이 기기가 지난번에 고른 바리스타를 되살린다 (없거나 쉬는 날이면 저절로 비워진다)
  try { selectedBaristaId = localStorage.getItem(CONFIG.baristaKey) || null; } catch { }
  try { baristaFilterId = localStorage.getItem(CONFIG.baristaFilterKey) || null; } catch { }

  const liveSince = businessDateOf(new Date(Date.now() - CONFIG.liveOrderDays * 24 * 60 * 60 * 1000));
  state.backend.subscribeSince('orders', 'businessDate', liveSince, (docs) => {
    state.orders = docs;
    // 호출 연출은 그리기 전에 판정해야 새 번호가 곧바로 크게 떠오른다.
    onOrdersChanged();
    render();
  });
  state.backend.subscribe('settings', (docs) => {
    state.settings = { ...CONFIG.defaults, ...(docs.find((d) => d.id === 'app') || {}) };
    // 이 기기가 직접 고른 글자 크기가 없을 때만 선생님의 기본값을 따라간다.
    // (있으면 학생이 이미 고른 값을 절대 덮어쓰지 않는다)
    if (!localStorage.getItem(CONFIG.fontScaleKey)) {
      applyFontScale(state.settings.fontScale);
    }
    render();
  });

  // 지금 로컬인지 클라우드인지 상단바에 표시한다 — 선생님이 "지금 연결돼 있나?"를 알 수 있어야 한다.
  document.getElementById('net-tag').textContent = netLabel;

  // 토스트가 footer를 가리지 않도록 처음 한 번 맞추고, 이후 크기 변화를 계속 지켜본다.
  syncToastBottomOffset();
  watchFooterResize();

  // 글자 크기 초기값: 이 기기의 선택 → 선생님 기본값 → 전역 기본값 순서로 정한다.
  applyFontScale(localStorage.getItem(CONFIG.fontScaleKey) || state.settings.fontScale || CONFIG.defaults.fontScale);
  for (const b of document.querySelectorAll('.font-switch button')) {
    b.onclick = () => setFontScale(b.dataset.scale);
  }
  document.getElementById('btn-change-role').onclick = changeRole;
  watchAdminIdle();

  // 기억하지 않는 카페에서는, 예전 버전이 저장해 둔 역할이 남아 있어도 주문 화면에서 시작한다.
  let saved = null;
  try {
    saved = CONFIG.rememberRole ? localStorage.getItem(CONFIG.roleKey) : null;
    if (!CONFIG.rememberRole) localStorage.removeItem(CONFIG.roleKey);
  } catch { }
  setRole(saved || (CONFIG.rememberRole ? null : 'order'));
}
</script>
